# Ticketing platform — local stack (US-001).
# `docker compose up` from a clean clone brings up: postgres + NATS JetStream
# + otel-lgtm + the five Go services + gateway + storefront + scanner.
# Published ports are env-overridable so `make smoke` can run a path-isolated
# Compose project next to a running dev stack.
name: ticketing

# One-shot migration job (ADR-022): runs the service's own binary with the
# `migrate` subcommand against its own database, then exits. Services depend on
# their job with service_completed_successfully, so no process ever starts
# against an unmigrated schema. Five independent jobs, never a cross-service
# coordinator — each holds only its own role (ADR-002/007).
x-migrate-job: &migrate-job
  restart: "no"
  command: ["migrate"]
  depends_on:
    postgres:
      condition: service_healthy

x-go-deps: &go-deps
  postgres:
    condition: service_healthy
  nats:
    condition: service_healthy
  nats-init:
    condition: service_completed_successfully

x-go-service: &go-service
  restart: unless-stopped
  environment: &go-env
    # No default credential ships in the repo (TKT-83): `make up` generates one.
    INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?no default is shipped - run 'make up' once to generate a local credential}
    OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
    # fast export cadence so telemetry is queryable within seconds (smoke)
    OTEL_METRIC_EXPORT_INTERVAL: "5000"
    OTEL_BSP_SCHEDULE_DELAY: "1000"
    OTEL_BLRP_SCHEDULE_DELAY: "1000"
    HTTP_READ_HEADER_TIMEOUT: ${HTTP_READ_HEADER_TIMEOUT:-5s}
    HTTP_READ_TIMEOUT: ${HTTP_READ_TIMEOUT:-15s}
    HTTP_WRITE_TIMEOUT: ${HTTP_WRITE_TIMEOUT:-30s}
    HTTP_IDLE_TIMEOUT: ${HTTP_IDLE_TIMEOUT:-60s}
    DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-25}
    DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-10}
    DB_CONN_MAX_LIFETIME: ${DB_CONN_MAX_LIFETIME:-30m}
    DB_CONN_MAX_IDLE_TIME: ${DB_CONN_MAX_IDLE_TIME:-5m}
    # ADR-028 runtime enforcement (TKT-125). Default on: dev, CI and the smoke
    # gate keep the guarantee without configuring anything.
    OPENAPI_RESPONSE_VALIDATION_ENABLED: ${OPENAPI_RESPONSE_VALIDATION_ENABLED:-true}
  # Merged into each service's own depends_on (which adds its migrate job).
  # A plain `depends_on:` override would replace this map wholesale, not extend
  # it — hence the anchor.
  depends_on: *go-deps
  healthcheck:
    test: ["CMD", "/app", "healthcheck"]
    interval: 5s
    timeout: 3s
    retries: 10
    start_period: 5s

services:
  postgres:
    image: postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
    restart: unless-stopped
    environment:
      # No committed password (ai-review S11). The superuser's was the literal
      # "postgres" and each service role's was its own NAME, so every process on
      # the developer's machine had superuser on the published port by typing the
      # obvious thing. `make up` generates all six; the isolated stacks generate
      # their own per run.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?no default is shipped - run 'make up' once to generate local database passwords}
      # Read by deploy/postgres-init/01-databases.sh on first boot. The entrypoint
      # runs *.sh with the environment available and *.sql without it, which is
      # why that file is a script now.
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:?run 'make up' once to generate local database passwords}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD:?run 'make up' once to generate local database passwords}
      COMMERCE_DB_PASSWORD: ${COMMERCE_DB_PASSWORD:?run 'make up' once to generate local database passwords}
      PAYMENTS_DB_PASSWORD: ${PAYMENTS_DB_PASSWORD:?run 'make up' once to generate local database passwords}
      ACCESS_DB_PASSWORD: ${ACCESS_DB_PASSWORD:?run 'make up' once to generate local database passwords}
    volumes:
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql
    # -h forces TCP: the entrypoint runs a temporary socket-only server
    # (listen_addresses='') while executing docker-entrypoint-initdb.d, so a
    # socket probe reports healthy before the service databases exist — and the
    # migrate jobs (ADR-022) that gate on this are fail-fast with no retry.
    # start_period covers cold initdb: failures during it don't spend retries.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  nats:
    image: nats:2.14.4-alpine3.22@sha256:f2123f533c2b0cada0a5c5ec434fb2b8cfe1cf220215ef9d7517e1372917ad66
    restart: unless-stopped
    # file-backed JetStream store on a named volume: streams survive
    # container recreation (ADR-007 durability)
    command: ["-c", "/etc/nats/nats-server.conf", "-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - natsdata:/data
      - ./deploy/nats/nats-server.conf:/etc/nats/nats-server.conf:ro
    environment:
      # NATS server publisher ACL credentials (TKT-170, ADR-072).
      # Held by nats to configure per-user authorization in nats-server.conf.
      # NATS_INVENTORY_REPROCESS_PASSWORD is intentionally delivered ONLY here
      # and never to the inventory container.
      # Wrapped in quotes so NATS internal config lexer (conf/parse.go parseEnv)
      # parses environment variable expansions as strings even when a random hex
      # draw resembles scientific notation (e.g. 34e084f3).
      NATS_ADMIN_PASSWORD: "\"${NATS_ADMIN_PASSWORD:?no default is shipped - run 'make up' once to generate a local credential}\""
      NATS_CATALOG_PASSWORD: "\"${NATS_CATALOG_PASSWORD:?no default is shipped - run 'make up' once to generate a local credential}\""
      NATS_INVENTORY_PASSWORD: "\"${NATS_INVENTORY_PASSWORD:?no default is shipped - run 'make up' once to generate a local credential}\""
      NATS_INVENTORY_REPROCESS_PASSWORD: "\"${NATS_INVENTORY_REPROCESS_PASSWORD:?no default is shipped - run 'make up' once to generate a local credential}\""
      NATS_COMMERCE_PASSWORD: "\"${NATS_COMMERCE_PASSWORD:?no default is shipped - run 'make up' once to generate a local credential}\""
      NATS_PAYMENTS_PASSWORD: "\"${NATS_PAYMENTS_PASSWORD:?no default is shipped - run 'make up' once to generate a local credential}\""
      NATS_ACCESS_PASSWORD: "\"${NATS_ACCESS_PASSWORD:?no default is shipped - run 'make up' once to generate a local credential}\""
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: provisions the PLATFORM stream (ADR-007) at stack init.
  # Idempotent; the smoke suite asserts the stream EXISTS, it no longer creates it.
  nats-init:
    image: natsio/nats-box:0.19.7@sha256:ffce8bd103383f179f8c7f11cf645726acf5d17280706c530c3b342dbe16334c
    depends_on:
      nats:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    environment:
      NATS_ADMIN_PASSWORD: ${NATS_ADMIN_PASSWORD:?no default is shipped - run 'make up' once to generate a local credential}
    command:
      # set -e: each provisioning compound must fail the init job itself —
      # without it, only the LAST compound's status survives the semicolons
      # and an earlier durable's creation failure exits 0 (ai-review G7).
      - >-
        set -e;
        nats --server nats://platform-admin:${NATS_ADMIN_PASSWORD}@nats:4222 stream info PLATFORM >/dev/null 2>&1 ||
        nats --server nats://platform-admin:${NATS_ADMIN_PASSWORD}@nats:4222 stream add PLATFORM
        --subjects "platform.>" --storage file --retention limits --defaults;
        nats --server nats://platform-admin:${NATS_ADMIN_PASSWORD}@nats:4222 consumer info PLATFORM access-lifecycle-integrity-operator >/dev/null 2>&1 ||
        nats --server nats://platform-admin:${NATS_ADMIN_PASSWORD}@nats:4222 consumer add PLATFORM access-lifecycle-integrity-operator
        --filter "platform.access.lifecycle-integrity.alarm" --pull --deliver all --ack explicit --defaults;
        nats --server nats://platform-admin:${NATS_ADMIN_PASSWORD}@nats:4222 consumer info PLATFORM access-admission-conflict-operator >/dev/null 2>&1 ||
        nats --server nats://platform-admin:${NATS_ADMIN_PASSWORD}@nats:4222 consumer add PLATFORM access-admission-conflict-operator
        --filter "platform.access.admission-conflict.alarm" --pull --deliver all --ack explicit --defaults;
        nats --server nats://platform-admin:${NATS_ADMIN_PASSWORD}@nats:4222 consumer info PLATFORM access-policy-conflict-operator >/dev/null 2>&1 ||
        nats --server nats://platform-admin:${NATS_ADMIN_PASSWORD}@nats:4222 consumer add PLATFORM access-policy-conflict-operator
        --filter "platform.access.admission-policy-conflict.alarm" --pull --deliver all --ack explicit --defaults

  lgtm:
    image: grafana/otel-lgtm:0.30.0@sha256:46ca028e294bd728e8e930a28e887f640a8f2a9533cc283f79bcc6ab73d2ffd8
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  catalog-migrate:
    <<: *migrate-job
    build: { context: ., dockerfile: build/go.Dockerfile, args: { PKG: ticketing/services/catalog/cmd/catalog } }
    environment:
      DATABASE_URL: postgres://catalog:${CATALOG_DB_PASSWORD}@postgres:5432/catalog

  catalog:
    <<: *go-service
    depends_on:
      <<: *go-deps
      catalog-migrate:
        condition: service_completed_successfully
    build: { context: ., dockerfile: build/go.Dockerfile, args: { PKG: ticketing/services/catalog/cmd/catalog } }
    environment:
      <<: *go-env
      DATABASE_URL: postgres://catalog:${CATALOG_DB_PASSWORD}@postgres:5432/catalog
      # Per-service NATS publisher credential (TKT-170, ADR-072). Held by catalog
      # alone — deliberately NOT in the shared &go-env anchor.
      NATS_URL: nats://catalog:${NATS_CATALOG_PASSWORD:?no default is shipped - run 'make up' once to generate a local credential}@nats:4222
      # TKT-191: the credential catalog checks on every unsafe contract operation.
      # Held by catalog and the back office and nothing else — deliberately NOT in
      # the shared &go-env anchor, which every service inherits.
      CATALOG_STAFF_WRITE_TOKEN: ${CATALOG_STAFF_WRITE_TOKEN:?no default is shipped - run 'make up' once to generate a local credential}
      # TKT-245: the key catalog SIGNS organizer assertions with. Held by catalog
      # alone — the back office receives minted assertions in the sign-in
      # response and never the key, which is what makes the assertion a boundary
      # rather than a formality. Catalog refuses to start when it equals either
      # credential above.
      CATALOG_ORGANIZER_ASSERTION_KEY: ${CATALOG_ORGANIZER_ASSERTION_KEY:?no default is shipped - run 'make up' once to generate a local signing key}
    # Catalog's internal surface is deliberately not routed through the gateway
    # (public edge), same as inventory's. Since TKT-210 that surface includes the
    # cache kill-switch (GET/PUT /internal/cache-control), which an operator must be
    # able to reach during an incident. The access path is loopback, published by the
    # compose.direct-ports.yaml overlay — not here: this file publishes no service
    # ports, and adding one would put the internal surface on the host by default.

  inventory-migrate:
    <<: *migrate-job
    build: { context: ., dockerfile: build/go.Dockerfile, args: { PKG: ticketing/services/inventory/cmd/inventory } }
    environment:
      DATABASE_URL: postgres://inventory:${INVENTORY_DB_PASSWORD}@postgres:5432/inventory

  inventory:
    <<: *go-service
    depends_on:
      <<: *go-deps
      inventory-migrate:
        condition: service_completed_successfully
    build: { context: ., dockerfile: build/go.Dockerfile, args: { PKG: ticketing/services/inventory/cmd/inventory } }
    # The staff/internal surface (operational holds, staff availability) is deliberately
    # not routed through the gateway (public edge); localhost is the box-office/ops
    # access path in this testbed, and the smoke suite drives it here.
    #
    # The MAPPING that provides that access moved to compose.direct-ports.yaml
    # (ai-review S11). This file publishes the gateway and nothing else, so a
    # deployment built from it does not inherit a loopback door into every
    # internal surface; `make up` and both gate scripts add the overlay back.
    environment:
      <<: *go-env
      DATABASE_URL: postgres://inventory:${INVENTORY_DB_PASSWORD}@postgres:5432/inventory
      HOLD_TTL: ${HOLD_TTL:-10m}
      CATALOG_URL: http://catalog:8080
      # Per-service NATS credential (TKT-170, ADR-072). Held by the inventory
      # server — deliberately NOT in the shared &go-env anchor. Holds NO publish
      # rights on any platform.* subject.
      NATS_URL: nats://inventory:${NATS_INVENTORY_PASSWORD:?no default is shipped - run 'make up' once to generate a local credential}@nats:4222
      # The back office's channel-allocation editor (TKT-244, ADR-057). Opens exactly
      # two operations — the staff availability read and the allocation replace — and
      # is deliberately NOT the shared INTERNAL_SERVICE_TOKEN in the &go-env anchor:
      # that one value opens every inventory operation, and the caller is a
      # public-facing SSR process. Inventory refuses to start if the two are equal.
      INVENTORY_STAFF_WRITE_TOKEN: ${INVENTORY_STAFF_WRITE_TOKEN:?no default is shipped - run 'make up' once to generate a local credential}

  commerce-migrate:
    <<: *migrate-job
    build: { context: ., dockerfile: build/go.Dockerfile, args: { PKG: ticketing/services/commerce/cmd/commerce } }
    environment:
      DATABASE_URL: postgres://commerce:${COMMERCE_DB_PASSWORD}@postgres:5432/commerce

  commerce:
    <<: *go-service
    depends_on:
      <<: *go-deps
      commerce-migrate:
        condition: service_completed_successfully
    build: { context: ., dockerfile: build/go.Dockerfile, args: { PKG: ticketing/services/commerce/cmd/commerce } }
    environment:
      <<: *go-env
      DATABASE_URL: postgres://commerce:${COMMERCE_DB_PASSWORD}@postgres:5432/commerce
      # Per-service NATS publisher credential (TKT-170, ADR-072). Held by commerce
      # alone — deliberately NOT in the shared &go-env anchor.
      NATS_URL: nats://commerce:${NATS_COMMERCE_PASSWORD:?no default is shipped - run 'make up' once to generate a local credential}@nats:4222
      # Commerce is payments' one caller, so it is the one service that holds the
      # money credential alongside the shared one (ai-review S8). It refuses to
      # start if any two of its four credentials are equal.
      PAYMENTS_INTERNAL_TOKEN: ${PAYMENTS_INTERNAL_TOKEN:?no default is shipped - run 'make up' once to generate a local credential}
      # TKT-194: the back office's credential, checked on the staff refund and on
      # nothing else. Held by commerce and the back office only — deliberately NOT
      # in the shared &go-env anchor.
      COMMERCE_STAFF_WRITE_TOKEN: ${COMMERCE_STAFF_WRITE_TOKEN:?no default is shipped - run 'make up' once to generate a local credential}
      # The HMAC key for customer checkout assertions (TKT-221). Commerce-only:
      # nothing else mints or verifies them, and the storefront deliberately gets
      # NO credential (ADR-049 §1) — it forwards an assertion the customer earned
      # by signing in, which is not the same thing as holding a key.
      COMMERCE_CUSTOMER_ASSERTION_KEY: ${COMMERCE_CUSTOMER_ASSERTION_KEY:?no default is shipped - run 'make up' once to generate a local credential}
      CATALOG_URL: http://catalog:8080
      INVENTORY_URL: http://inventory:8080
      PAYMENTS_URL: http://payments:8080
      # Refund ticket voiding (TKT-157). Optional in the binary: without it a refund
      # returns the money and leaves the reversal outstanding rather than refusing to
      # start.
      ACCESS_URL: http://access:8080
      # The buyer-facing origin password-reset links are built from (TKT-226). Same
      # variable and same meaning as access's, which already builds ticket-delivery
      # links from it. Commerce NEVER derives this from a request: a link base taken
      # from the Host header lets a caller mail a victim a genuine reset link pointing
      # at the attacker's site. Unset degrades to a WARN at startup and undeliverable
      # reset mail — every other operation still serves.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}

  payments-migrate:
    <<: *migrate-job
    build: { context: ., dockerfile: build/go.Dockerfile, args: { PKG: ticketing/services/payments/cmd/payments } }
    environment:
      DATABASE_URL: postgres://payments:${PAYMENTS_DB_PASSWORD}@postgres:5432/payments

  payments:
    <<: *go-service
    depends_on:
      <<: *go-deps
      payments-migrate:
        condition: service_completed_successfully
    build: { context: ., dockerfile: build/go.Dockerfile, args: { PKG: ticketing/services/payments/cmd/payments } }
    environment:
      <<: *go-env
      DATABASE_URL: postgres://payments:${PAYMENTS_DB_PASSWORD}@postgres:5432/payments
      # Per-service NATS credential (TKT-170, ADR-072). Held by payments alone —
      # deliberately NOT in the shared &go-env anchor. Publishes and subscribes nothing.
      NATS_URL: nats://payments:${NATS_PAYMENTS_PASSWORD:?no default is shipped - run 'make up' once to generate a local credential}@nats:4222
      # Payments authenticates its internal surface on THIS, not on the shared
      # INTERNAL_SERVICE_TOKEN every service holds (ai-review S8). Commerce is the
      # only caller and holds both; nothing else needs the money surface.
      PAYMENTS_INTERNAL_TOKEN: ${PAYMENTS_INTERNAL_TOKEN:?no default is shipped - run 'make up' once to generate a local credential}
      JOURNAL_KEY_ID: local-v1
      # No default, and `make up` generates it (ai-review S5). It shipped as an
      # ACTIVE checked-in default until then, so a stack with no env signed its
      # money journal under a key that is public in this repository — and the
      # binary now refuses that literal forever, the way it refuses the retired
      # bearer token (TKT-83).
      JOURNAL_SIGNING_KEY: ${JOURNAL_SIGNING_KEY:?run `make up` once to generate local signing keys}
      # Retired journal signing keys, "kid=<base64.RawStdEncoding secret>,..." — kept so
      # entries signed before a rotation stay verifiable (ADR-016 §Decision 8). Empty is
      # the single-key configuration this stack has always run. These are SECRETS, not
      # public keys: holding the ring is holding the power to forge under every kid in
      # it. Rotation runbook: docs/development.md §Journal signing key rotation.
      JOURNAL_HISTORICAL_KEYS: ${JOURNAL_HISTORICAL_KEYS:-}
      # Offline by default: the fake PSP. An sk_test_ key selects the Stripe test-mode
      # adapter; sk_live_ is rejected at startup (ADR-032). Never commit a real key.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-fake}
      # Belongs NEXT TO the key above, because the key is what decides the default it
      # overrides: the fake retains idempotency keys forever (retention 0, unbounded),
      # Stripe retains them ~24h. Without an injected bound the status-replay deadline
      # does not exist offline, and every assertion about it is unreachable.
      #
      # It lived in compose.smoke.yaml until TKT-184 follow-up, and that file is about
      # the BUILD METHOD — host-built binaries vs in-Docker — not about the PSP. So the
      # hermetic path, which loads the base file and shared runtime overlays but not
      # compose.smoke.yaml, ran with retention 0 and failed
      # TestStatusReplayWindowExpiryAnswers409 while the fast path passed. A precondition
      # that only one of two stacks loads is a test that only one of two stacks can pass.
      #
      # 24h, not something smaller: it must stay above the testbed's own fresh
      # operations, which have to sit comfortably inside the window. Only ever shortened
      # against a bounded provider — payments refuses startup on a value that would
      # extend one (ADR-032 §Status/replay).
      PAYMENTS_STATUS_REPLAY_RETENTION: ${PAYMENTS_STATUS_REPLAY_RETENTION:-24h}

  access-migrate:
    <<: *migrate-job
    build: { context: ., dockerfile: build/go.Dockerfile, args: { PKG: ticketing/services/access/cmd/access } }
    environment:
      # DDL only, so no lifecycle key material here: migrate cannot sign, and
      # giving it the seed would imply it could.
      DATABASE_URL: postgres://access:${ACCESS_DB_PASSWORD}@postgres:5432/access

  # Adopts pre-0003 lifecycle history into the signed chain (ADR-021 §D9).
  #
  # A second one-shot job rather than part of access-migrate, deliberately.
  # ADR-022 moved migrations out of the startup path but kept ADR-008's 30-second
  # fail-fast deadline, and that deadline now bounds a job the service waits on
  # with service_completed_successfully. This work Ed25519-signs a head per
  # ticket, so its cost scales with history rather than with schema size — held
  # to 30 seconds it would eventually fail the job and stop Access booting at
  # all. It is resumable instead: interrupt it and the next run continues.
  access-lifecycle-backfill:
    build: { context: ., dockerfile: build/go.Dockerfile, args: { PKG: ticketing/services/access/cmd/access } }
    restart: "no"
    command: ["lifecycle-backfill"]
    depends_on:
      postgres:
        condition: service_healthy
      access-migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://access:${ACCESS_DB_PASSWORD}@postgres:5432/access
      ACCESS_LIFECYCLE_PRIVATE_KEY: ${ACCESS_LIFECYCLE_PRIVATE_KEY:?run `make up` once to generate local signing keys}
      ACCESS_LIFECYCLE_KID: ${ACCESS_LIFECYCLE_KID:-access-lifecycle/local-v1}
      ACCESS_LIFECYCLE_PUBLIC_KEYS: ${ACCESS_LIFECYCLE_PUBLIC_KEYS:?run `make up` once to generate local signing keys}

  access:
    <<: *go-service
    depends_on:
      <<: *go-deps
      access-migrate:
        condition: service_completed_successfully
      # Serving from a half-adopted trail would mean verifying chains that do not
      # exist yet, so the gate waits for the baseline.
      access-lifecycle-backfill:
        condition: service_completed_successfully
    build: { context: ., dockerfile: build/go.Dockerfile, args: { PKG: ticketing/services/access/cmd/access } }
    environment:
      <<: *go-env
      DATABASE_URL: postgres://access:${ACCESS_DB_PASSWORD}@postgres:5432/access
      # Per-service NATS publisher/subscriber credential (TKT-170, ADR-072). Held by
      # access alone — deliberately NOT in the shared &go-env anchor.
      NATS_URL: nats://access:${NATS_ACCESS_PASSWORD:?no default is shipped - run 'make up' once to generate a local credential}@nats:4222
      COMMERCE_URL: http://commerce:8080
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      # No default: `make up` mints this pair per clone (ai-review S5). Until
      # then an all-zero Ed25519 seed shipped as an ACTIVE default, so anyone
      # could mint a QR payload that passed ed25519.Verify at the gate — which is
      # what made the unauthenticated scan route (S1) redeem-anything rather than
      # merely open. The PUBLIC keyring carries no default either, and that is not
      # symmetry for its own sake: leaving the matching public key behind would
      # keep the compromised seed a valid signer no matter how fresh the private
      # one is.
      ACCESS_QR_PRIVATE_KEY: ${ACCESS_QR_PRIVATE_KEY:?run `make up` once to generate local signing keys}
      ACCESS_QR_KID: ${ACCESS_QR_KID:-access-qr/local-v1}
      # Signs the short-lived QR IMAGE links the ticket bundle hands out
      # (ai-review S2). Distinct from the QR seed on purpose — it proves a URL is
      # fresh, not that a credential admits at a gate.
      ACCESS_TICKET_LINK_KEY: ${ACCESS_TICKET_LINK_KEY:?no default is shipped - run 'make up' once to generate a local credential}
      ACCESS_FEED_CURSOR_KEY: ${ACCESS_FEED_CURSOR_KEY:?no default is shipped - run 'make up' once to generate a local credential}
      # The back office's ticket-resend credential (TKT-203, ADR-068). Accepted on
      # exactly one operation — POST /internal/orders/{id}/redeliveries — and access
      # refuses to start when it equals INTERNAL_SERVICE_TOKEN, because two
      # credentials with different blast radii are only two credentials if they hold
      # different values.
      ACCESS_STAFF_WRITE_TOKEN: ${ACCESS_STAFF_WRITE_TOKEN:?no default is shipped - run 'make up' once to generate a local credential}
      # Comma-separated access-qr/<kid>=raw-base64-public-key entries.
      ACCESS_QR_PUBLIC_KEYS: ${ACCESS_QR_PUBLIC_KEYS:?run `make up` once to generate local signing keys}
      # Lifecycle trail signing (ADR-021 §D4). Distinct key MATERIAL from the QR
      # keys above, not merely a distinct name: the point is that leaking the
      # credential-signing key must not also authorize rewriting history. The
      # access-lifecycle/ namespace is enforced in code, so these can never be
      # crossed by configuration alone. Development-only seed; deployments inject
      # their own. No defaults since ai-review S5: the 0x01..0x20 counter seed
      # that used to sit here made every "tamper-evident" claim in ADR-021 void
      # against anyone holding this repository, because a forged checkpoint
      # verified clean under `access verify-lifecycle`.
      ACCESS_LIFECYCLE_PRIVATE_KEY: ${ACCESS_LIFECYCLE_PRIVATE_KEY:?run `make up` once to generate local signing keys}
      ACCESS_LIFECYCLE_KID: ${ACCESS_LIFECYCLE_KID:-access-lifecycle/local-v1}
      ACCESS_LIFECYCLE_PUBLIC_KEYS: ${ACCESS_LIFECYCLE_PUBLIC_KEYS:?run `make up` once to generate local signing keys}
      ACCESS_LIFECYCLE_CHECKPOINT_INTERVAL: ${ACCESS_LIFECYCLE_CHECKPOINT_INTERVAL:-60s}
      ACCESS_LIFECYCLE_FAILURE_THRESHOLD: ${ACCESS_LIFECYCLE_FAILURE_THRESHOLD:-3}
      ACCESS_LIFECYCLE_FAILURE_WINDOW: ${ACCESS_LIFECYCLE_FAILURE_WINDOW:-60s}
      # Access refuses to BOOT without this durable (ADR-021 §D6: "an unmonitored
      # deployment must not run this scheme in fail-open"). Boot-time, not
      # readiness: /readyz is what the container healthcheck probes, so gating it
      # on NATS would let a broker blip close every turnstile — the
      # customer-denying failure §D6 chose fail-open to avoid. Attaching this
      # durable to a pager is the deployment's job; this only guarantees an
      # operator inbox exists to attach.
      ACCESS_LIFECYCLE_ALARM_STREAM: ${ACCESS_LIFECYCLE_ALARM_STREAM:-PLATFORM}
      ACCESS_LIFECYCLE_ALARM_DURABLE: ${ACCESS_LIFECYCLE_ALARM_DURABLE:-access-lifecycle-integrity-operator}
      ACCESS_ADMISSION_CONFLICT_DURABLE: ${ACCESS_ADMISSION_CONFLICT_DURABLE:-access-admission-conflict-operator}
      ACCESS_POLICY_CONFLICT_DURABLE: ${ACCESS_POLICY_CONFLICT_DURABLE:-access-policy-conflict-operator}
      ACCESS_EVENT_RETRY_BACKOFF: ${ACCESS_EVENT_RETRY_BACKOFF:-}

  storefront:
    # Astro 7 SSR shell (ADR-006). Root build context: the pnpm workspace
    # lockfile lives at the repo root (scanner pattern).
    build: { context: ., dockerfile: web/storefront/Dockerfile }
    restart: unless-stopped
    environment:
      # SSR reads go through the gateway: the storefront consumes the public
      # contract (ADR-002). No startup deadlock: both healthchecks are self-only.
      GATEWAY_URL: http://gateway:8080
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  scanner:
    build: { context: ., dockerfile: web/scanner/Dockerfile }
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  backoffice:
    # Astro 7 SSR back-office shell (ADR-006 / US-018). Root build context: the
    # pnpm workspace lockfile lives at the repo root (scanner pattern). SSR
    # reads go through the gateway (public contract, ADR-002); healthchecks are
    # self-only so there is no startup deadlock with the gateway.
    build: { context: ., dockerfile: web/backoffice/Dockerfile }
    restart: unless-stopped
    environment:
      GATEWAY_URL: http://gateway:8080
      # Catalog writes (TKT-191). Catalog-only, and deliberately NOT the shared
      # INTERNAL_SERVICE_TOKEN in the &go-env anchor: that one value opens every
      # service's internal surface, and this is a public-facing SSR process.
      CATALOG_STAFF_WRITE_TOKEN: ${CATALOG_STAFF_WRITE_TOKEN:?no default is shipped - run 'make up' once to generate a local credential}
      # The staff refund (TKT-194). Commerce's refund lives under /internal/,
      # which the gateway edge-denies by construction (ADR-002) — so the back
      # office reaches it DIRECTLY, in-network, exactly as access already reaches
      # commerce's delivery-email read. Routing it through the gateway would mean
      # publishing a money-moving endpoint to the internet to reach a service
      # this process can already open a socket to.
      COMMERCE_URL: http://commerce:8080
      COMMERCE_STAFF_WRITE_TOKEN: ${COMMERCE_STAFF_WRITE_TOKEN:?no default is shipped - run 'make up' once to generate a local credential}
      # The operator channel read (TKT-236). Direct to catalog, in-network, for
      # the same reason the refund above goes direct to commerce: only
      # /internal/channels returns DISABLED channels, and the gateway edge-denies
      # every /api/<svc>/internal/ route by construction (ADR-002). Publishing an
      # exception would put operator configuration on the internet to reach a
      # service this process can already open a socket to.
      #
      # NO NEW CREDENTIAL. It authenticates with CATALOG_STAFF_WRITE_TOKEN above,
      # which catalog accepts on that ONE method+path (ADR-053) because that
      # token already opens createChannel and updateChannel — so a holder can
      # already learn which channels exist. Still deliberately NOT
      # INTERNAL_SERVICE_TOKEN: that one value opens every service's internal
      # surface, and this is a public-facing SSR process.
      CATALOG_URL: http://catalog:8080
      # The channel-allocation editor (TKT-244). Direct to inventory, in-network, for
      # the same reason the refund goes direct to commerce and the channel read direct
      # to catalog: both operations live under /internal/, which the gateway
      # edge-denies by construction (ADR-002). Publishing an exception would put
      # capacity configuration on the internet to reach a service this process can
      # already open a socket to.
      #
      # A NEW CREDENTIAL, unlike the catalog read above (ADR-053). That one reused
      # CATALOG_STAFF_WRITE_TOKEN because the token could already create and update
      # the very channels it was then allowed to list — the allowance added no new
      # capability class. The back office holds NOTHING for inventory, so reusing a
      # catalog credential here would grant power across a service boundary and make a
      # catalog-token compromise an inventory-write compromise. Still deliberately NOT
      # INTERNAL_SERVICE_TOKEN: that one value opens every service's internal surface,
      # and this is a public-facing SSR process.
      INVENTORY_URL: http://inventory:8080
      INVENTORY_STAFF_WRITE_TOKEN: ${INVENTORY_STAFF_WRITE_TOKEN:?no default is shipped - run 'make up' once to generate a local credential}
      # The ticket resend (TKT-203). Direct to access, in-network, for the same reason
      # as the three above: the operation lives under /internal/, which the gateway
      # edge-denies by construction (ADR-002). Note the back office ALSO reads access
      # through the gateway (the ticket bundle, TKT-193) — that one is a public route,
      # this one is not, and the split is deliberate rather than an inconsistency.
      #
      # A NEW CREDENTIAL, on ADR-057's reasoning rather than ADR-053's: the back office
      # holds NOTHING for access, so reusing its commerce or catalog token would grant
      # power across a service boundary and turn one of those compromises into the
      # ability to re-emit ticket capabilities. Access accepts it on exactly ONE
      # operation (ADR-068), enforced by a route table in the guard itself. Still
      # deliberately NOT INTERNAL_SERVICE_TOKEN: that one value opens every service's
      # internal surface, and this is a public-facing SSR process.
      ACCESS_URL: http://access:8080
      ACCESS_STAFF_WRITE_TOKEN: ${ACCESS_STAFF_WRITE_TOKEN:?no default is shipped - run 'make up' once to generate a local credential}
    healthcheck:
      # base:'/admin' means Astro serves healthz at /admin/healthz; the probe
      # hits the container directly (pre-gateway), so it targets the base path.
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/admin/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway:
    build: { context: ., dockerfile: build/go.Dockerfile, args: { PKG: ticketing/gateway/cmd/gateway } }
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
      CATALOG_URL: http://catalog:8080
      INVENTORY_URL: http://inventory:8080
      COMMERCE_URL: http://commerce:8080
      PAYMENTS_URL: http://payments:8080
      ACCESS_URL: http://access:8080
      STOREFRONT_URL: http://storefront:8080
      SCANNER_URL: http://scanner:8080
      BACKOFFICE_URL: http://backoffice:8080
      HTTP_READ_HEADER_TIMEOUT: ${HTTP_READ_HEADER_TIMEOUT:-5s}
      HTTP_READ_TIMEOUT: ${HTTP_READ_TIMEOUT:-15s}
      HTTP_WRITE_TIMEOUT: ${HTTP_WRITE_TIMEOUT:-30s}
      HTTP_IDLE_TIMEOUT: ${HTTP_IDLE_TIMEOUT:-60s}
    depends_on:
      catalog: { condition: service_healthy }
      inventory: { condition: service_healthy }
      commerce: { condition: service_healthy }
      payments: { condition: service_healthy }
      access: { condition: service_healthy }
      storefront: { condition: service_healthy }
      scanner: { condition: service_healthy }
      backoffice: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "/app", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  pgdata:
  natsdata:
