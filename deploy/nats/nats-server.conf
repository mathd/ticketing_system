# NATS server authorization configuration (ADR-072).
#
# This configuration defines per-user permissions on the default $G account.
# Named accounts are not used because named accounts isolate JetStream namespaces
# and would hide the existing PLATFORM stream (ADR-007).
#
# Passwords reference environment variables. This file contains no secret values.

authorization {
  users = [
    {
      # platform-admin: full rights across all subjects and JetStream APIs.
      # Used by nats-init and the smoke test process.
      user: "platform-admin"
      password: $NATS_ADMIN_PASSWORD
      permissions: {
        publish: [">"]
        subscribe: [">"]
      }
    },
    {
      # catalog: publishes five catalog domain event subjects.
      # Subscribes only to reply inboxes, which is where JetStream returns the publish ack.
      #
      # There is deliberately NO $JS.API.STREAM.MSG.> grant. That subject is stream
      # READ/DELETE authority (STREAM.MSG.GET, STREAM.MSG.DELETE), not part of the publish
      # ack path, and granting it let a publisher read and erase another service's events
      # (ai-review F1, executed). A PURE publisher needs no $JS.API grant at all: js.Publish
      # sends to the domain subject and the ack returns on _INBOX.>, verified by publishing
      # successfully with the domain subject as the only publish permission (ai-review pass 2
      # corrected an earlier comment here that credited $JS.API.STREAM.INFO with resolving the
      # stream — that is not on this path). access and inventory keep STREAM.INFO because they
      # open the stream explicitly to bind their consumers.
      user: "catalog"
      password: $NATS_CATALOG_PASSWORD
      permissions: {
        publish: [
          "platform.catalog.performance.published",
          "platform.catalog.performance.archived",
          "platform.catalog.performance.closed",
          "platform.catalog.performance.reopened",
          "platform.catalog.seat_map.published"
        ]
        subscribe: ["_INBOX.>"]
      }
    },
    {
      # commerce: publishes two order domain event subjects.
      # Subscribes only to reply inboxes. No $JS.API.STREAM.MSG.> — see the catalog note.
      user: "commerce"
      password: $NATS_COMMERCE_PASSWORD
      permissions: {
        publish: [
          "platform.commerce.order.completed",
          "platform.commerce.order.exchanged"
        ]
        subscribe: ["_INBOX.>"]
      }
    },
    {
      # access: publishes ticket failure and integrity alarms.
      # Subscribes to order and performance events and its own alarms.
      #
      # RESIDUAL, and it is not closed by scoping (ai-review pass 2, executed): a durable that
      # uses PLURAL FilterSubjects has NO filter token in its create subject, so the filter comes
      # from the request BODY and NATS cannot constrain it by subject. A compromised principal can
      # therefore re-create ITS OWN durable with a widened filter and read another service's
      # events. Demonstrated: a principal holding only these inventory grants re-created
      # inventory-catalog-offering filtered on platform.commerce.order.completed and read the
      # payload back. So the subscribe list below bounds the HONEST client, not a compromised one.
      # Closing it means removing body-controlled CREATE — pre-provisioning both plural-filter
      # durables in nats-init and dropping the services' CreateOrUpdateConsumer calls. That is a
      # code change to the consumer startup path, out of scope here; tracked in TKT-327.
      # access-slot-policy is NOT affected: it uses a single FilterSubject, so its create subject
      # encodes the filter and the grant below pins it to the one legitimate value.
      #
      # Consumer APIs are scoped to the durables access actually owns, never PLATFORM.>.
      # A `>` wildcard here let one service drive ANOTHER service's durable: inventory
      # deleted access-slot-policy in a live probe, and access's reconnect loop recreated
      # it, so the deletion was invisible except in the durable's creation timestamp
      # (ai-review F2, executed). A CREATE.> grant is the worse half — a principal that can
      # create a consumer with an ARBITRARY FILTER can read any subject, which would make
      # the subscribe list below decorative rather than a boundary.
      #
      # CONSUMER.INFO is a read-only wildcard on purpose. The three alarm durable names are
      # environment-overridable (ACCESS_LIFECYCLE_ALARM_DURABLE, ACCESS_ADMISSION_CONFLICT_DURABLE,
      # ACCESS_POLICY_CONFLICT_DURABLE, compose.yaml), and access fails closed at boot if it cannot
      # read them (RequireAlarmRoute, services/access/internal/lifecyclejob/publisher.go:78-103), so
      # literal INFO names would make a supported override stop the service. INFO cannot delete,
      # drive or fetch from a durable — those are separate API subjects — so the wildcard concedes
      # metadata reads and no mutation.
      #
      # CREATE is split by FILTER FORM, which is a NATS rule rather than a style choice.
      # access-slot-policy declares a SINGLE FilterSubject (policy.go:192), so its filter appears as
      # a suffix token on the create subject and the grant below pins it to the one legitimate
      # value. access-ticket-issuer declares PLURAL FilterSubjects (consumer.go:442), whose create
      # subject carries NO filter token at all — see the residual note above.
      user: "access"
      password: $NATS_ACCESS_PASSWORD
      permissions: {
        publish: [
          "platform.access.ticket-issuance.failed",
          "platform.access.lifecycle-integrity.alarm",
          "platform.access.admission-conflict.alarm",
          "platform.access.admission-policy-conflict.alarm",
          "$JS.API.STREAM.INFO.PLATFORM",
          "$JS.API.CONSUMER.CREATE.PLATFORM.access-ticket-issuer",
          "$JS.API.CONSUMER.CREATE.PLATFORM.access-ticket-issuer.>",
          "$JS.API.CONSUMER.CREATE.PLATFORM.access-slot-policy.platform.catalog.performance.published",
          "$JS.API.CONSUMER.INFO.PLATFORM.*",
          "$JS.API.CONSUMER.MSG.NEXT.PLATFORM.access-ticket-issuer",
          "$JS.API.CONSUMER.MSG.NEXT.PLATFORM.access-slot-policy",
          "$JS.ACK.PLATFORM.access-ticket-issuer.>",
          "$JS.ACK.PLATFORM.access-slot-policy.>"
        ]
        subscribe: [
          "platform.commerce.order.completed",
          "platform.commerce.order.exchanged",
          "platform.catalog.performance.published",
          "platform.access.lifecycle-integrity.alarm",
          "platform.access.admission-conflict.alarm",
          "platform.access.admission-policy-conflict.alarm",
          "_INBOX.>"
        ]
      }
    },
    {
      # inventory: long-running service.
      # NO publish permissions on any platform.* subject.
      # Consumer APIs are scoped to inventory-catalog-offering, the only durable it owns.
      # CONSUMER.DELETE is granted for inventory-performance-provisioner ALONE — the one
      # legacy durable services/inventory/internal/consumer/consumer.go:666 removes at
      # startup. It is deliberately not DELETE.PLATFORM.>, which let inventory delete
      # access's durables (ai-review F2).
      user: "inventory"
      password: $NATS_INVENTORY_PASSWORD
      permissions: {
        publish: [
          "$JS.API.STREAM.INFO.PLATFORM",
          "$JS.API.CONSUMER.CREATE.PLATFORM.inventory-catalog-offering",
          "$JS.API.CONSUMER.CREATE.PLATFORM.inventory-catalog-offering.>",
          "$JS.API.CONSUMER.INFO.PLATFORM.inventory-catalog-offering",
          "$JS.API.CONSUMER.MSG.NEXT.PLATFORM.inventory-catalog-offering",
          "$JS.API.CONSUMER.DELETE.PLATFORM.inventory-performance-provisioner",
          "$JS.ACK.PLATFORM.inventory-catalog-offering.>"
        ]
        subscribe: [
          "platform.catalog.performance.published",
          "platform.catalog.performance.archived",
          "platform.catalog.performance.closed",
          "platform.catalog.performance.reopened",
          "_INBOX.>"
        ]
      }
    },
    {
      # inventory-reprocess: operator identity for inventory reprocess-quarantine only.
      # WHY a separate identity: services/inventory/cmd/inventory/reprocess.go:101
      # republishes quarantined catalog events onto catalog's prefix. If the long-running
      # inventory server held that right, a compromised inventory could forge catalog events
      # continuously.
      user: "inventory-reprocess"
      password: $NATS_INVENTORY_REPROCESS_PASSWORD
      permissions: {
        publish: [
          "platform.catalog.performance.published",
          "platform.catalog.performance.archived",
          "platform.catalog.performance.closed",
          "platform.catalog.performance.reopened"
        ]
        subscribe: ["_INBOX.>"]
      }
    },
    {
      # payments: connects only to back a healthcheck (services/payments/cmd/payments/main.go:387,401-404).
      # Publishes and subscribes nothing. A user with publish: {deny: [">"]} and subscribe: {deny: [">"]}
      # still connects and nc.IsConnected() returns true.
      user: "payments"
      password: $NATS_PAYMENTS_PASSWORD
      permissions: {
        publish: {
          deny: [">"]
        }
        subscribe: {
          deny: [">"]
        }
      }
    }
  ]
}
