# Hermetic smoke: the full in-Docker build path (compose.yaml only, no
# host-built artifacts). Per-PR `make check` uses the fast host-built path
# (TKT-42), so this workflow keeps the hermetic builds honest: weekly on
# main, and on any PR that touches the build files themselves.
name: hermetic-smoke

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  pull_request:
    paths:
      - build/go.Dockerfile
      - compose.yaml
      - compose.smoke.yaml
      - .dockerignore
      - go.work
      - go.work.sum
      - "**/go.mod"
      - "**/go.sum"
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - web/scanner/package.json
      - web/scanner/Dockerfile
      - web/storefront/Dockerfile
      - .github/workflows/hermetic.yaml

concurrency:
  group: hermetic-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hermetic-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.5"
          cache-dependency-path: "**/go.sum"
      - run: make smoke-hermetic
