# Hermetic smoke: the full in-Docker build path (compose.yaml only, no
# host-built artifacts). Per-PR `make check` uses the fast host-built path
# (TKT-42), so this workflow keeps the hermetic builds honest: weekly on
# main, and on any PR that touches the build files themselves.
name: hermetic-smoke

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  pull_request:
    paths:
      - build/go.Dockerfile
      - compose.yaml
      - compose.smoke.yaml
      - compose.onsale-load.yaml
      - .dockerignore
      - go.work
      - go.work.sum
      - "**/go.mod"
      - "**/go.sum"
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - web/scanner/package.json
      - web/scanner/Dockerfile
      - web/storefront/Dockerfile
      - .github/workflows/hermetic.yaml

concurrency:
  # github.event_name is part of the group so a manual dispatch or a build-file PR cannot
  # cancel an in-flight scheduled run — the run whose failure is the only one anybody is
  # told about.
  group: hermetic-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  # PR runs still cancel their own predecessors; scheduled runs never do. A cancelled run
  # notifies nothing (correctly — it never finished), so letting one scheduled run cancel
  # another would drop an outage silently, which is this ticket's whole subject.
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  hermetic-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache-dependency-path: "**/go.sum"
      - run: make smoke-hermetic

  # --- Scheduled-failure notification (TKT-213) ----------------------------------
  #
  # A weekly workflow nobody watches reports nothing. This one was red on main for 9 days,
  # and the only reason anyone found out was an unrelated PR tripping its path filter.
  # These two jobs make a scheduled failure open a GitHub issue and a later scheduled
  # success close it.
  #
  # DELIBERATELY inlined rather than a shared script under scripts/. The notifier is the
  # thing that must not fail silently, and actions/checkout would run it FROM THE COMMIT
  # UNDER TEST — so a bad main would break the alarm whose job is to report that main is
  # bad. Inlined, it depends on nothing but `gh` and the API, and needs no checkout at all.
  # The cost is a near-duplicate of this block in security.yaml: change one, change both.
  #
  # `permissions:` at job level REPLACES the workflow default rather than merging with it,
  # and this repo's default_workflow_permissions is `read`
  # (gh api repos/:owner/:repo/actions/permissions/workflow). Omitting issues:write here
  # is a silent 403 — the notifier "runs" and tells nobody, which is the very failure this
  # ticket exists to close.
  scheduled-failure-notice:
    name: Notify - scheduled hermetic failure
    if: ${{ failure() && !cancelled() && github.event_name == 'schedule' }}
    needs: [hermetic-smoke]
    permissions:
      issues: write
    runs-on: ubuntu-latest
    steps:
      - name: Open or update the outage issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Keyed on the workflow FILE, not github.workflow: the display name lives in a
          # `name:` field a human can rename, and a rename would orphan every open issue
          # and silently open a fresh one.
          MARKER: "<!-- scheduled-workflow-failure: .github/workflows/hermetic.yaml -->"
          LABEL: scheduled-workflow-failure
        run: |
          set -Eeuo pipefail
          gh label list --limit 200 --json name --jq "any(.[]; .name==\"$LABEL\")" | grep -qx true ||
            gh label create "$LABEL" --color D73A4A \
              --description "A scheduled GitHub Actions workflow is failing"
          existing=$(gh issue list --state open --label "$LABEL" --limit 100 --json number,body \
            --jq "map(select(.body|contains(\"$MARKER\")))|.[0].number // empty")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still failing: $RUN_URL"
            exit 0
          fi
          body=$(cat <<EOF
          $MARKER

          The scheduled **hermetic-smoke** workflow failed.

          Failed run: $RUN_URL
          Commit: \`$GITHUB_SHA\`

          This workflow runs the full in-Docker build path, which per-PR \`make check\` does
          not exercise — it is what keeps the fast host-built path honest. A failure here
          means the two paths have diverged.

          This issue closes itself when a later scheduled run succeeds.
          EOF
          )
          gh issue create --label "$LABEL" \
            --title "Scheduled workflow failure: hermetic-smoke" \
            --body "$(printf '%s' "$body" | sed 's/^          //')"

  # A no-op on almost every run, by design: the workflow is usually green, and there is no
  # way to know whether an outage issue is open without looking. Kept cheap — no checkout,
  # and it exits immediately when there is nothing to close.
  scheduled-recovery-notice:
    name: Close - scheduled hermetic recovery (usually a no-op)
    if: ${{ success() && !cancelled() && github.event_name == 'schedule' }}
    needs: [hermetic-smoke]
    permissions:
      issues: write
      # actions:read is what lets `gh run view` read this run's own job conclusions below.
      actions: read
    runs-on: ubuntu-latest
    steps:
      - name: Close the outage issue if this run really was clean
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MARKER: "<!-- scheduled-workflow-failure: .github/workflows/hermetic.yaml -->"
          LABEL: scheduled-workflow-failure
        run: |
          set -Eeuo pipefail
          existing=$(gh issue list --state open --label "$LABEL" --limit 100 --json number,body \
            --jq "map(select(.body|contains(\"$MARKER\")))|.[0].number // empty")
          if [ -z "$existing" ]; then
            echo "no open outage issue for this workflow; nothing to close"
            exit 0
          fi
          # Do not infer success from `needs:` alone. A job added to this workflow but not
          # to the needs: list above would let a real failure sit outside this job's view,
          # and this job would then CLOSE a genuine outage. Ask the run what every job
          # actually concluded — evidence, not inference.
          # FAIL CLOSED on an ALLOWLIST, and filter on no job names at all.
          #
          # Two earlier versions of this guard were wrong in opposite ways. Excluding the
          # notifier jobs by display-name prefix tied it to a `name:` field anyone can edit
          # (a new job called "Notify - ..." would have been filtered out and its failure
          # ignored). Counting only failure/cancelled/timed_out then failed OPEN: `skipped`,
          # `action_required`, `stale` and — worst — a `null` conclusion all passed, so a
          # top-level job omitted from `needs:` that was still RUNNING would let this job
          # close a genuine outage before that job went red (ai-review pass 2).
          #
          # So: an ALLOWLIST of conclusions that are compatible with "this run was clean",
          # and anything else — including a value GitHub adds after this was written —
          # blocks the close.
          #
          # `null` and `skipped` are both on it, and both need justifying rather than
          # waving through. `null` is this job itself: it is necessarily still running when
          # it asks, so its own conclusion is not yet decided. `skipped` is the sibling
          # notifier job, which is skipped on every run where the other one fires — and on
          # a PR run both are. Neither can be tightened by counting: "exactly one null" is
          # wrong the moment a second job is legitimately in flight.
          #
          # What this DOES catch, and the previous version did not: failure, cancelled,
          # timed_out, action_required and stale, on ANY job — including a top-level job
          # omitted from `needs:` above, which is the whole reason this guard exists.
          verdict=$(gh run view "$GITHUB_RUN_ID" --json jobs --jq '
            [.jobs[].conclusion]
            | map(select(. != null and . != "success" and . != "neutral" and . != "skipped"))
            | length == 0')
          if [ "$verdict" != "true" ]; then
            gh issue comment "$existing" --body "A scheduled run reached the recovery step, but not every job in it finished cleanly (see the run for which), so this stays open. Run: $RUN_URL"
            exit 0
          fi
          gh issue comment "$existing" --body "Recovered: $RUN_URL"
          gh issue close "$existing" --reason completed
