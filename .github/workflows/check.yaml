# CI = exactly the local gate (`make check`), plus the gate self-test.
# Triggers are scoped to main + PRs; sdlc-state commits never reach CI.
name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: "**/go.sum"
      - uses: pnpm/action-setup@v4   # version comes from packageManager
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
      - run: make check

  gate-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: "**/go.sum"
      - uses: pnpm/action-setup@v4   # version comes from packageManager
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
      - run: make deps
      - run: ./scripts/gate-selftest.sh
