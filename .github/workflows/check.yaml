# CI = the local gate (`make check`), plus the gate self-test.
# Per-PR smoke runs against host-built artifacts (compose.smoke.yaml);
# the hermetic in-Docker build path is covered by hermetic.yaml
# (scheduled + triggered on PRs touching the build files).
# Triggers are scoped to main + PRs; sdlc-state commits never reach CI.
#
# Docs-only changes skip the whole workflow: `make check` builds and tests Go +
# TS, none of which a prose diff can break, and this repo ships ADR-only tickets
# often enough (TKT-62, TKT-64) for ~5min a PR to be worth skipping. paths-ignore
# fires only when *every* changed file matches, so a docs + code PR still runs.
#
# ⚠ This is safe only while no required status check names `check`. A skipped
# workflow reports nothing, and a *required* check that never reports blocks the
# PR forever. GitHub branch protection is unavailable on this repo's plan today
# (the API 403s), so nothing is enforced — but AGENTS.md claims required checks
# are in place. If that ever becomes true, replace paths-ignore with a
# step-level `if:` guard so the job still reports success. See TKT-62 retro.
name: check

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]

# Cancel a still-running check when a newer commit lands on the same PR or
# branch — superseded runs are pure wasted Actions minutes.
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.5"
          cache-dependency-path: "**/go.sum"
      # pnpm via corepack (version from packageManager, like the scanner
      # Dockerfile) — pnpm/action-setup v6 is broken both in default and
      # standalone mode (pnpm/action-setup#276)
      - run: corepack enable pnpm && corepack install
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          cache: pnpm
      # golangci-lint analysis cache, keyed on the Makefile's pinned version
      - id: golangci-version
        run: echo "v=$(sed -n 's/^GOLANGCI_VERSION := //p' Makefile)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/golangci-lint
          key: golangci-${{ steps.golangci-version.outputs.v }}-${{ runner.os }}-${{ hashFiles('**/go.sum', 'go.work.sum') }}
          restore-keys: golangci-${{ steps.golangci-version.outputs.v }}-${{ runner.os }}-
      - run: make check

  gate-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.5"
          cache-dependency-path: "**/go.sum"
      # pnpm via corepack (version from packageManager, like the scanner
      # Dockerfile) — pnpm/action-setup v6 is broken both in default and
      # standalone mode (pnpm/action-setup#276)
      - run: corepack enable pnpm && corepack install
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          cache: pnpm
      - run: make deps
      - run: ./scripts/gate-selftest.sh
