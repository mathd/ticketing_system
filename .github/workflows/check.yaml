# CI = the local gate (`make check`), plus the gate self-test.
# Per-PR smoke runs against host-built artifacts (compose.smoke.yaml);
# the hermetic in-Docker build path is covered by hermetic.yaml
# (scheduled + triggered on PRs touching the build files).
# Triggers are scoped to main + PRs; sdlc-state commits never reach CI.
name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.5"
          cache-dependency-path: "**/go.sum"
      # pnpm via corepack (version from packageManager, like the scanner
      # Dockerfile) — pnpm/action-setup v6 is broken both in default and
      # standalone mode (pnpm/action-setup#276)
      - run: corepack enable pnpm && corepack install
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.18.0"
          cache: pnpm
      # golangci-lint analysis cache, keyed on the Makefile's pinned version
      - id: golangci-version
        run: echo "v=$(sed -n 's/^GOLANGCI_VERSION := //p' Makefile)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/golangci-lint
          key: golangci-${{ steps.golangci-version.outputs.v }}-${{ runner.os }}-${{ hashFiles('**/go.sum', 'go.work.sum') }}
          restore-keys: golangci-${{ steps.golangci-version.outputs.v }}-${{ runner.os }}-
      - run: make check

  gate-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.5"
          cache-dependency-path: "**/go.sum"
      # pnpm via corepack (version from packageManager, like the scanner
      # Dockerfile) — pnpm/action-setup v6 is broken both in default and
      # standalone mode (pnpm/action-setup#276)
      - run: corepack enable pnpm && corepack install
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.18.0"
          cache: pnpm
      - run: make deps
      - run: ./scripts/gate-selftest.sh
