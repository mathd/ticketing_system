# Advisory and repository scanning complements, but does not replace, make check.
name: security

# The weekly scheduled run is the full safety net — it re-scans every dep
# even when nothing changed, catching newly-disclosed CVEs. The per-PR run
# is therefore scoped to PRs that actually change dependencies or build
# inputs (go.mod/go.sum, lockfiles, Dockerfiles, workflow); code/doc-only
# PRs skip all 10 jobs. Trigger security manually on any PR via the
# workflow_dispatch button when a targeted scan is wanted.
on:
  pull_request:
    paths:
      - "**/go.mod"
      - "**/go.sum"
      - go.work
      - go.work.sum
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - "web/*/package.json"
      - "**/Dockerfile"
      - build/**
      - .github/workflows/security.yaml
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded in-flight security runs on the same PR/branch.
concurrency:
  # github.event_name is part of the group so a manual dispatch cannot cancel an in-flight
  # scheduled run, and cancel-in-progress is off for scheduled runs entirely: a cancelled
  # run notifies nothing, so one scheduled run cancelling another would drop an outage
  # silently (TKT-213). Same reasoning as hermetic.yaml.
  group: security-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: shared/go
            tags: ""
          - module: gateway
            tags: ""
          - module: services/access
            tags: ""
          - module: services/catalog
            tags: ""
          - module: services/commerce
            tags: ""
          - module: services/inventory
            tags: ""
          - module: services/payments
            tags: ""
          - module: smoke
            tags: smoke
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          # Some workspace modules intentionally have no go.sum. Use the
          # repository lockfile set so every matrix leg gets a stable key.
          cache-dependency-path: "**/go.sum"
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 -test -tags "${{ matrix.tags }}" -C "${{ matrix.module }}" ./...

  pnpm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: corepack enable pnpm && corepack install
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high

  repository-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.72.0
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table

  # --- Scheduled-failure notification (TKT-213) ----------------------------------
  #
  # The near-duplicate of hermetic.yaml's pair of jobs; the reasoning for inlining rather
  # than sharing a script lives there in full. Change one, change both.
  #
  # TWO THINGS DIFFER HERE and both matter.
  #
  # 1. `needs:` names the three TOP-LEVEL jobs, so this runs ONCE per run. govulncheck is
  #    an 8-leg matrix; depending on the legs individually would open eight issues for one
  #    bad Monday, which trains people to ignore the channel.
  # 2. This workflow sets a workflow-level `permissions: contents: read`, and a job-level
  #    block REPLACES it rather than merging. These jobs need no repository contents (no
  #    checkout), so they declare only what they use — but anyone adding a checkout step
  #    here must add `contents: read` back or it will fail.
  scheduled-failure-notice:
    name: Notify - scheduled security failure
    if: ${{ failure() && !cancelled() && github.event_name == 'schedule' }}
    needs: [govulncheck, pnpm-audit, repository-scan]
    permissions:
      issues: write
    runs-on: ubuntu-latest
    steps:
      - name: Open or update the outage issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MARKER: "<!-- scheduled-workflow-failure: .github/workflows/security.yaml -->"
          LABEL: scheduled-workflow-failure
        run: |
          set -Eeuo pipefail
          gh label list --limit 200 --json name --jq "any(.[]; .name==\"$LABEL\")" | grep -qx true ||
            gh label create "$LABEL" --color D73A4A \
              --description "A scheduled GitHub Actions workflow is failing"
          existing=$(gh issue list --state open --label "$LABEL" --limit 100 --json number,body \
            --jq "map(select(.body|contains(\"$MARKER\")))|.[0].number // empty")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still failing: $RUN_URL"
            exit 0
          fi
          body=$(cat <<EOF
          $MARKER

          The scheduled **security** workflow failed.

          Failed run: $RUN_URL
          Commit: \`$GITHUB_SHA\`

          The weekly run re-scans every dependency even when nothing changed, so it is what
          catches a newly-disclosed CVE in code that has not been touched. A per-PR run only
          fires when dependency or build files change, which means a failure here can sit
          unnoticed indefinitely — open the run to see which of govulncheck, pnpm-audit or
          the repository scan is red.

          This issue closes itself when a later scheduled run succeeds.
          EOF
          )
          gh issue create --label "$LABEL" \
            --title "Scheduled workflow failure: security" \
            --body "$(printf '%s' "$body" | sed 's/^          //')"

  # A no-op on almost every run, by design. See hermetic.yaml.
  scheduled-recovery-notice:
    name: Close - scheduled security recovery (usually a no-op)
    if: ${{ success() && !cancelled() && github.event_name == 'schedule' }}
    needs: [govulncheck, pnpm-audit, repository-scan]
    permissions:
      issues: write
      actions: read
    runs-on: ubuntu-latest
    steps:
      - name: Close the outage issue if this run really was clean
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MARKER: "<!-- scheduled-workflow-failure: .github/workflows/security.yaml -->"
          LABEL: scheduled-workflow-failure
        run: |
          set -Eeuo pipefail
          existing=$(gh issue list --state open --label "$LABEL" --limit 100 --json number,body \
            --jq "map(select(.body|contains(\"$MARKER\")))|.[0].number // empty")
          if [ -z "$existing" ]; then
            echo "no open outage issue for this workflow; nothing to close"
            exit 0
          fi
          # Evidence, not inference: a job added to this workflow but missing from the
          # needs: list above would be invisible here, and this job would close a genuine
          # outage. Ask the run what every job actually concluded. This matters more here
          # than in hermetic.yaml — security.yaml has three top-level jobs and a matrix,
          # so it is the one likely to grow a fourth.
          # FAIL CLOSED on an ALLOWLIST, and filter on no job names at all.
          #
          # Two earlier versions of this guard were wrong in opposite ways. Excluding the
          # notifier jobs by display-name prefix tied it to a `name:` field anyone can edit
          # (a new job called "Notify - ..." would have been filtered out and its failure
          # ignored). Counting only failure/cancelled/timed_out then failed OPEN: `skipped`,
          # `action_required`, `stale` and — worst — a `null` conclusion all passed, so a
          # top-level job omitted from `needs:` that was still RUNNING would let this job
          # close a genuine outage before that job went red (ai-review pass 2).
          #
          # So: an ALLOWLIST of conclusions that are compatible with "this run was clean",
          # and anything else — including a value GitHub adds after this was written —
          # blocks the close.
          #
          # `null` and `skipped` are both on it, and both need justifying rather than
          # waving through. `null` is this job itself: it is necessarily still running when
          # it asks, so its own conclusion is not yet decided. `skipped` is the sibling
          # notifier job, which is skipped on every run where the other one fires — and on
          # a PR run both are. Neither can be tightened by counting: "exactly one null" is
          # wrong the moment a second job is legitimately in flight.
          #
          # What this DOES catch, and the previous version did not: failure, cancelled,
          # timed_out, action_required and stale, on ANY job — including a top-level job
          # omitted from `needs:` above, which is the whole reason this guard exists.
          verdict=$(gh run view "$GITHUB_RUN_ID" --json jobs --jq '
            [.jobs[].conclusion]
            | map(select(. != null and . != "success" and . != "neutral" and . != "skipped"))
            | length == 0')
          if [ "$verdict" != "true" ]; then
            gh issue comment "$existing" --body "A scheduled run reached the recovery step, but not every job in it finished cleanly (see the run for which), so this stays open. Run: $RUN_URL"
            exit 0
          fi
          gh issue comment "$existing" --body "Recovered: $RUN_URL"
          gh issue close "$existing" --reason completed
