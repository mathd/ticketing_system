# Advisory and repository scanning complements, but does not replace, make check.
name: security

# The weekly scheduled run is the full safety net — it re-scans every dep
# even when nothing changed, catching newly-disclosed CVEs. The per-PR run
# is therefore scoped to PRs that actually change dependencies or build
# inputs (go.mod/go.sum, lockfiles, Dockerfiles, workflow); code/doc-only
# PRs skip all 10 jobs. Trigger security manually on any PR via the
# workflow_dispatch button when a targeted scan is wanted.
on:
  pull_request:
    paths:
      - "**/go.mod"
      - "**/go.sum"
      - go.work
      - go.work.sum
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - "web/*/package.json"
      - "**/Dockerfile"
      - build/**
      - .github/workflows/security.yaml
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded in-flight security runs on the same PR/branch.
concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: shared/go
            tags: ""
          - module: gateway
            tags: ""
          - module: services/access
            tags: ""
          - module: services/catalog
            tags: ""
          - module: services/commerce
            tags: ""
          - module: services/inventory
            tags: ""
          - module: services/payments
            tags: ""
          - module: smoke
            tags: smoke
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.5"
          # Some workspace modules intentionally have no go.sum. Use the
          # repository lockfile set so every matrix leg gets a stable key.
          cache-dependency-path: "**/go.sum"
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 -test -tags "${{ matrix.tags }}" -C "${{ matrix.module }}" ./...

  pnpm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: corepack enable pnpm && corepack install
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high

  repository-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.72.0
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table
