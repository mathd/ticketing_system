server {
    listen 8080;
    listen [::]:8080;
    root /usr/share/nginx/html;
    client_body_temp_path /tmp/nginx/client_temp;
    proxy_temp_path /tmp/nginx/proxy_temp;
    fastcgi_temp_path /tmp/nginx/fastcgi_temp;
    uwsgi_temp_path /tmp/nginx/uwsgi_temp;
    scgi_temp_path /tmp/nginx/scgi_temp;

    # Defence in depth (ai-review S6). The gateway sets the same three defaults for
    # every public answer, and it only fills in what a response does not already
    # carry — so these travel unchanged through it and still apply when this
    # container is reached directly, which its published port allows today.
    # `always` so a 404 from try_files carries them too.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    location = /healthz {
        default_type application/json;
        return 200 '{"status":"ok","service":"scanner"}';
    }

    # Assets are built with base /scanner/ (gateway route)
    location /scanner/ {
        try_files $uri /scanner/index.html;
    }

    location / {
        return 302 /scanner/;
    }
}
