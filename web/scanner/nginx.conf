server {
    listen 8080;
    listen [::]:8080;
    root /usr/share/nginx/html;

    location = /healthz {
        default_type application/json;
        return 200 '{"status":"ok","service":"scanner"}';
    }

    # Assets are built with base /scanner/ (gateway route)
    location /scanner/ {
        try_files $uri /scanner/index.html;
    }

    location / {
        return 302 /scanner/;
    }
}
