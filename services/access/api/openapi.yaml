openapi: 3.0.3
info: {title: Access API, version: 1.0.0}
paths:
  /scans:
    post:
      operationId: scanTicket
      # Requires an enrolled device (ai-review S1): X-Scanner-Token, issued by
      # `access enrol-scanner` and held by ONE gate device. The scanner is a
      # static SPA, so a credential shared by every phone would ship inside a
      # public JavaScript bundle — and a lost phone has to be revocable on its
      # own, not by rotating a secret every door depends on.
      security: [{ScannerDeviceToken: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ScanRequest'}}}}
      responses:
        # A 200 may also be ADR-021 §D6's degraded admission: a ticket whose
        # integrity chain did not verify is admitted once and alarmed, because a
        # verification failure is likelier our own bug than an attacker and
        # denying a real customer at a live turnstile is the worse failure. The
        # scanner cannot tell the two apart, deliberately.
        '200': {description: Accepted, content: {application/json: {schema: {$ref: '#/components/schemas/ScanAccepted'}}}}
        # reason: already_redeemed | integrity_quarantined (a ticket that already
        # took its one degraded admission) | integrity_operator_controlled (an
        # organizer a human has flipped to deny).
        '409': {description: 'Rejected: already redeemed, or refused by the integrity degraded mode', content: {application/json: {schema: {$ref: '#/components/schemas/ScanRejected'}}}}
        '401':
          description: >
            The scanner device is not enrolled, or its enrolment was revoked
            (ai-review S1). Deliberately a DIFFERENT status from the 422 an
            invalid ticket credential gets: a gate app has to tell "this phone is
            not paired" from "turn this person away", and collapsing them sends an
            operator to the wrong problem at the worst possible moment.

            Unenrolled and revoked are one answer, though — that difference is for
            an operator reading a log, not for whoever is holding the phone.
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '422': {description: Invalid credential, content: {application/json: {schema: {$ref: '#/components/schemas/ScanRejected'}}}}
        '500': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /scans/reconciliations:
    post:
      # Offline occurrences syncing after reconnect (ADR-025 §D6). Recording,
      # not deciding: never a live admit/deny, always a per-occurrence result —
      # one bad occurrence never fails the batch.
      operationId: reconcileScans
      # Same enrolment requirement as /scans, and this route needed it more: it
      # rewrites a night's admission history in bulk (ai-review S1).
      security: [{ScannerDeviceToken: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReconcileRequest'}}}}
      responses:
        '200': {description: Per-occurrence reconciliation results, content: {application/json: {schema: {$ref: '#/components/schemas/ReconcileResponse'}}}}
        '401':
          description: >
            The scanner device is not enrolled, or its enrolment was revoked
            (ai-review S1). Deliberately a DIFFERENT status from the 422 an
            invalid ticket credential gets: a gate app has to tell "this phone is
            not paired" from "turn this person away", and collapsing them sends an
            operator to the wrong problem at the worst possible moment.

            Unenrolled and revoked are one answer, though — that difference is for
            an operator reading a log, not for whoever is holding the phone.
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '422': {description: Malformed envelope, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '500': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /internal/orders/{id}/refunds:
    post:
      operationId: refundTickets
      summary: Void a refund's share of an order's tickets (internal; commerce only)
      # TKT-157 / ADR-038. Selection is the lowest unrefunded ticket ids ascending,
      # made stable across a replay by the refund-derived lifecycle event id.
      # 503 means "not yet": issuance is asynchronous, so a refund can outrun it, and
      # the caller must keep the obligation rather than read it as "nothing to void".
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TicketRefundCreate'}}}}
      responses:
        '200': {description: Tickets voided (or replay), content: {application/json: {schema: {$ref: '#/components/schemas/TicketRefund'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /internal/orders/{id}/redeliveries:
    post:
      operationId: redeliverOrderTickets
      summary: Re-send a completed order's tickets to the address on file (internal; back office only)
      # TKT-203 / ADR-068. A staff member re-sends a completed order's tickets when the
      # original mail was lost or spam-filed.
      #
      # THE DESTINATION IS NOT IN THIS OPERATION, and its absence is the security
      # property rather than an omission. Access resolves the address from each ticket's
      # buyer through commerce's internal delivery-email read, at send time. There is no
      # recipient field to validate because a validated recipient field is still a
      # recipient field: an operator-typed address would turn the back office into a
      # relay emitting ticket capabilities to arbitrary recipients, and refusing that is
      # the owner's decision this operation implements (2026-08-26).
      #
      # Keyed on the ORDER id, never on guest_order_ref. That reference is a live
      # bearer capability (ADR-012) and the request logger runs before the router, so a
      # capability in the path is a capability in the log whatever the route does.
      #
      # Auth is INLINE, not a `security:` stanza (ADR-043): a declared scheme guards a
      # service's public contract, an inline check guards its internal surface, and the
      # refusal is 404 so it is indistinguishable from the gateway's own edge deny on
      # the same path (ADR-002). Accepts X-Access-Staff-Write-Token, and the shared
      # X-Internal-Token that every service-to-service caller already holds.
      parameters:
        - {$ref: '#/components/parameters/Id'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TicketRedeliveryCreate'}
      responses:
        '200': {description: Tickets re-sent (or replay of an earlier request), content: {application/json: {schema: {$ref: '#/components/schemas/TicketRedelivery'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        # The order has reached its per-order redelivery bound (ADR-068). Declared
        # because ADR-028's response validation is fail-closed: an undeclared status is
        # rewritten to 500, which would report a deliberate refusal as an outage.
        '429': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
        # Issuance is asynchronous, so a resend can outrun it: "this order has no
        # tickets" is usually "not yet", never "no such order". Same reasoning, same
        # status, as the refund route above.
        '503': {$ref: '#/components/responses/Error'}
  /scans/voided-tickets:
    get:
      # The revocation feed an offline scanner pulls so it can refuse a voided
      # ticket without a network round-trip (ADR-066). TKT-157 refuses one at a
      # LIVE gate and TKT-269 makes an offline admit visible after the fact;
      # neither stops it, because the scanner has no way to learn the ticket was
      # voided. This is distribution only — the scanner owns local storage,
      # freshness and the admission decision (TKT-271).
      operationId: listVoidedTickets
      description: >
        Voided ticket ids — refunded AND exchanged — for the authenticated
        device's organizer. Both are refused at a live gate for the same class of
        reason, and an exchanged ticket is the sharper offline case: its
        replacement is live elsewhere, so admitting the original admits the
        exchange twice.

        The organizer is taken from the enrolled device token and NEVER from the
        request. There is no organizer parameter, which is what stops a caller
        choosing whose revocations to read.
      security: [{ScannerDeviceToken: []}]
      parameters:
        - name: cursor
          in: query
          required: false
          description: >
            The opaque cursor from the previous page. Absent means the first
            page. A cursor is bound to the organizer it was issued for: one
            presented by a different organizer is a 400, never a silently
            shifted or empty page.
          schema: {type: string, minLength: 1, maxLength: 400}
        - name: limit
          in: query
          required: false
          # 100 matches this service's existing batch bound (ReconcileRequest
          # maxItems), rather than inventing a second number for one API.
          schema: {type: integer, minimum: 1, maximum: 100, default: 100}
      responses:
        '200': {description: One page of voided ticket ids, content: {application/json: {schema: {$ref: '#/components/schemas/VoidedTicketFeed'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401':
          description: >
            The scanner device is not enrolled, or its enrolment was revoked —
            the same answer, and the same reasoning, as the scan routes.
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '500': {$ref: '#/components/responses/Error'}
        # Deliberately no 503: this handler has no service-unavailable branch,
        # and declaring a status it cannot answer is drift in the other
        # direction (ADR-028).
  /orders/{ref}/tickets:
    get:
      operationId: getTickets
      parameters: [{$ref: '#/components/parameters/Ref'}]
      responses:
        '200': {description: Ticket bundle, content: {application/json: {schema: {$ref: '#/components/schemas/TicketBundle'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /orders/{ref}/tickets/{ticket}/qr.png:
    get:
      operationId: getTicketQR
      description: >
        Requires a live signature minted by GET /orders/{ref}/tickets (ai-review
        S2). The bundle hands out a fresh, short-lived URL per ticket on every
        load; a link that outlives its page answers 404, and so does a forged one.
        The two are deliberately indistinguishable — a distinct status would tell
        someone holding a dead link that the ticket behind it exists.

        The order ref itself remains the bundle's bearer credential. Forwarding
        "here are your tickets" is a feature; what this bounds is the IMAGE URL,
        which is what ends up in a screenshot, a referrer header or a proxy log.
      parameters:
        - {$ref: '#/components/parameters/Ref'}
        - {name: ticket, in: path, required: true, schema: {type: string, format: uuid}}
        - name: exp
          in: query
          required: true
          description: Signature expiry, as Unix seconds.
          schema: {type: string}
        - name: sig
          in: query
          required: true
          description: base64url HMAC over the order ref, the ticket id and the expiry.
          schema: {type: string}
      responses:
        '200': {description: PNG QR artwork, content: {image/png: {schema: {type: string, format: binary}}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    # Declared so the contract says what the handlers enforce; the CHECK itself is
    # inline in the handler rather than in a validator AuthenticationFunc, because
    # it is a database lookup against enrolled devices rather than a comparison
    # with a configured value (contrast catalog's staff-write scheme, ADR-043).
    ScannerDeviceToken:
      type: apiKey
      in: header
      name: X-Scanner-Token
      description: >
        One enrolled gate device's token. Issued once by `access enrol-scanner`,
        stored hashed, and revocable per device — because the thing that goes
        wrong is a phone walking out of the venue, not a secret expiring.
  parameters:
    Ref: {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
    Id: {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    # Spelled exactly as commerce spells it (services/commerce/api/openapi.yaml), so
    # one header does not acquire two shapes across the estate.
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 200}}
  responses:
    Error: {description: Error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  schemas:
    Error: {type: object, additionalProperties: false, required: [error], properties: {error: {type: string}}}
    TicketRedeliveryCreate:
      type: object
      additionalProperties: false
      required: [organizer_id]
      properties:
        # The SCOPE, not the authority: the credential proves the caller is the back
        # office, and the organizer narrows which order it may reach. The back office
        # supplies it from its authenticated session, never from browser input — the
        # same shape, and the same residual, as commerce's staff order read (ADR-042).
        organizer_id: {type: string, format: uuid}
    TicketRedelivery:
      type: object
      additionalProperties: false
      required: [order_id, ticket_count, replay]
      properties:
        order_id: {type: string, format: uuid}
        # A count, not the tickets. The caller already renders the order's ticket
        # bundle from its own read; what it must never receive from this operation is
        # the buyer's address or a capability link, so neither is representable here.
        ticket_count: {type: integer, minimum: 1, maximum: 50}
        replay: {type: boolean}
    TicketRefundCreate:
      type: object
      additionalProperties: false
      required: [organizer_id, refund_id, quantity]
      properties:
        organizer_id: {type: string, format: uuid}
        # The commerce refund's own identity. It is what makes a replay identifiable:
        # the lifecycle event id is derived from it, so an event under that id can only
        # have been written by this refund.
        refund_id: {type: string, format: uuid}
        quantity: {type: integer, minimum: 1, maximum: 50}
    TicketRefund:
      type: object
      additionalProperties: false
      required: [ticket_ids, replay]
      properties:
        ticket_ids: {type: array, items: {type: string, format: uuid}}
        replay: {type: boolean}
    # occurrence_id/occurred_at are the ADR-025 §D3 occurrence protocol, expand
    # phase (§D10): optional so old scanners keep today's semantics; occurred_at
    # is required iff occurrence_id is present — a pairing the schema cannot
    # express. Both are validated server-side (reason: invalid_occurrence) —
    # deliberately not format uuid/date-time here, so the scanner gets the
    # distinguishable invalid_occurrence answer instead of a generic contract
    # 422, and lowercase RFC 3339 t/z (legal date-time) is accepted.
    ScanRequest:
      type: object
      additionalProperties: false
      required: [qr_payload]
      # direction (TKT-87, expand phase of §D10): optional, omitted means
      # entry, so an old scanner's request is byte-identical in meaning. exit
      # is meaningful only for pass (multi/count_limited) slots — on single or
      # unknown policy it earns reason: exit_not_applicable. Pass scans
      # without occurrence fields earn reason: occurrence_required. Pass
      # policy denials: entry_limit_reached | exit_required | not_inside.
      properties:
        qr_payload: {type: string, minLength: 1}
        occurrence_id: {type: string, minLength: 1}
        occurred_at: {type: string, minLength: 1}
        direction: {type: string, enum: [entry, exit]}
    ScanAccepted:
      type: object
      additionalProperties: false
      required: [decision, scanned_at]
      # replay is present-and-true only on an occurrence-matched retry — never a
      # bare accepted (ADR-025 §D3); absent on every first-time result, so old
      # scanners parse new responses unchanged.
      properties: {decision: {type: string, enum: [accepted]}, scanned_at: {type: string, format: date-time}, replay: {type: boolean}}
    ReconcileRequest:
      type: object
      additionalProperties: false
      required: [occurrences]
      properties:
        occurrences:
          type: array
          minItems: 1
          maxItems: 100
          items: {$ref: '#/components/schemas/ReconcileOccurrence'}
    ReconcileOccurrence:
      type: object
      additionalProperties: false
      required: [qr_payload, occurrence_id, occurred_at]
      # Deliberately plain strings with no minLength: batch entries are
      # validated per occurrence server-side so ONE malformed entry — even an
      # empty field — gets its own rejected result instead of 422-ing the
      # whole sync. A gate syncing a night's queue must never be blocked by
      # one bad row.
      # event_type (TKT-87): the factual direction the device recorded.
      # Omitted means entry — an old scanner's queue keeps today's semantics.
      # Deliberately a plain string, same reason as the other fields: an
      # unknown value gets its own per-item rejected result, never a batch 422.
      properties:
        qr_payload: {type: string}
        occurrence_id: {type: string}
        occurred_at: {type: string}
        event_type: {type: string}
    ReconcileResponse:
      type: object
      additionalProperties: false
      required: [results]
      properties:
        results: {type: array, items: {$ref: '#/components/schemas/ReconcileResult'}}
    ReconcileResult:
      type: object
      additionalProperties: false
      required: [occurrence_id, result]
      # skew_flagged marks a device time outside the reconciliation bound —
      # recorded and flagged, never rejected (ADR-025 §D5).
      # occurrence_id is echoed VERBATIM from the request — plain string, not
      # format uuid — so the sender can correlate a rejected entry back to its
      # queue even when the id it sent was malformed.
      properties:
        occurrence_id: {type: string}
        result: {type: string, enum: [recorded, conflict, synced, rejected]}
        occurred_at: {type: string, format: date-time}
        skew_flagged: {type: boolean}
    VoidedTicketFeed:
      type: object
      additionalProperties: false
      # next_cursor is required AND nullable on purpose: an absent field and an
      # explicit null read the same to a careless client, and the difference
      # between "more pages" and "you are done" is the whole point of the field.
      required: [ticket_ids, next_cursor]
      properties:
        ticket_ids:
          type: array
          items: {type: string, format: uuid}
        next_cursor: {type: string, nullable: true}
    ScanRejected:
      type: object
      additionalProperties: false
      required: [decision, reason]
      properties:
        decision: {type: string, enum: [rejected]}
        reason: {type: string}
        original_scan_at: {type: string, format: date-time}
    LifecycleEvent:
      type: object
      additionalProperties: false
      required: [id, type, occurred_at]
      # sequence is the integrity chain's authoritative order (ADR-025 §D5);
      # optional only for legacy rows the backfill has not adopted yet. Its
      # upper bound keeps the value exact when a JavaScript client parses it.
      # Access emits Go time.Time values and the storefront uses browser Date;
      # neither can represent a leap second, so seconds are limited to 00..59.
      properties: {id: {type: string, format: uuid}, type: {type: string}, sequence: {type: integer, format: int64, minimum: 1, maximum: 9007199254740991}, occurred_at: {type: string, format: date-time, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}[Tt][0-9]{2}:[0-9]{2}:[0-5][0-9]([.][0-9]+)?([Zz]|[+-][0-9]{2}:[0-9]{2})$'}}
    Ticket:
      type: object
      additionalProperties: false
      required: [ticket_id, qr_payload, issued_at, history, qr_url]
      properties:
        ticket_id: {type: string, format: uuid}
        qr_payload: {type: string}
        issued_at: {type: string, format: date-time, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}[Tt][0-9]{2}:[0-9]{2}:[0-5][0-9]([.][0-9]+)?([Zz]|[+-][0-9]{2}:[0-9]{2})$'}
        history: {type: array, items: {$ref: '#/components/schemas/LifecycleEvent'}}
        qr_url: {type: string}
    TicketBundle:
      type: object
      additionalProperties: false
      required: [order_ref, tickets]
      properties:
        order_ref: {type: string, format: uuid}
        tickets: {type: array, items: {$ref: '#/components/schemas/Ticket'}}
