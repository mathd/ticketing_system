openapi: 3.0.3
info: {title: Access API, version: 1.0.0}
paths:
  /scans:
    post:
      operationId: scanTicket
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ScanRequest'}}}}
      responses:
        # A 200 may also be ADR-021 §D6's degraded admission: a ticket whose
        # integrity chain did not verify is admitted once and alarmed, because a
        # verification failure is likelier our own bug than an attacker and
        # denying a real customer at a live turnstile is the worse failure. The
        # scanner cannot tell the two apart, deliberately.
        '200': {description: Accepted, content: {application/json: {schema: {$ref: '#/components/schemas/ScanAccepted'}}}}
        # reason: already_redeemed | integrity_quarantined (a ticket that already
        # took its one degraded admission) | integrity_operator_controlled (an
        # organizer a human has flipped to deny).
        '409': {description: 'Rejected: already redeemed, or refused by the integrity degraded mode', content: {application/json: {schema: {$ref: '#/components/schemas/ScanRejected'}}}}
        '422': {description: Invalid credential, content: {application/json: {schema: {$ref: '#/components/schemas/ScanRejected'}}}}
        '500': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /orders/{ref}/tickets:
    get:
      operationId: getTickets
      parameters: [{$ref: '#/components/parameters/Ref'}]
      responses:
        '200': {description: Ticket bundle, content: {application/json: {schema: {$ref: '#/components/schemas/TicketBundle'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /orders/{ref}/tickets/{ticket}/qr.png:
    get:
      operationId: getTicketQR
      parameters:
        - {$ref: '#/components/parameters/Ref'}
        - {name: ticket, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: PNG QR artwork, content: {image/png: {schema: {type: string, format: binary}}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
components:
  parameters:
    Ref: {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
  responses:
    Error: {description: Error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  schemas:
    Error: {type: object, additionalProperties: false, required: [error], properties: {error: {type: string}}}
    ScanRequest: {type: object, additionalProperties: false, required: [qr_payload], properties: {qr_payload: {type: string, minLength: 1}}}
    ScanAccepted:
      type: object
      additionalProperties: false
      required: [decision, scanned_at]
      properties: {decision: {type: string, enum: [accepted]}, scanned_at: {type: string, format: date-time}}
    ScanRejected:
      type: object
      additionalProperties: false
      required: [decision, reason]
      properties:
        decision: {type: string, enum: [rejected]}
        reason: {type: string}
        original_scan_at: {type: string, format: date-time}
    LifecycleEvent:
      type: object
      additionalProperties: false
      required: [id, type, occurred_at]
      # sequence is the integrity chain's authoritative order (ADR-025 §D5);
      # optional only for legacy rows the backfill has not adopted yet.
      properties: {id: {type: string, format: uuid}, type: {type: string}, sequence: {type: integer, format: int64, minimum: 1}, occurred_at: {type: string, format: date-time}}
    Ticket:
      type: object
      additionalProperties: false
      required: [ticket_id, qr_payload, issued_at, history, qr_url]
      properties:
        ticket_id: {type: string, format: uuid}
        qr_payload: {type: string}
        issued_at: {type: string, format: date-time}
        history: {type: array, items: {$ref: '#/components/schemas/LifecycleEvent'}}
        qr_url: {type: string}
    TicketBundle:
      type: object
      additionalProperties: false
      required: [order_ref, tickets]
      properties:
        order_ref: {type: string, format: uuid}
        tickets: {type: array, items: {$ref: '#/components/schemas/Ticket'}}
