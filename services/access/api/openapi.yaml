openapi: 3.0.3
info: {title: Access API, version: 1.0.0}
paths:
  /scans:
    post:
      operationId: scanTicket
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ScanRequest'}}}}
      responses:
        # A 200 may also be ADR-021 §D6's degraded admission: a ticket whose
        # integrity chain did not verify is admitted once and alarmed, because a
        # verification failure is likelier our own bug than an attacker and
        # denying a real customer at a live turnstile is the worse failure. The
        # scanner cannot tell the two apart, deliberately.
        '200': {description: Accepted, content: {application/json: {schema: {$ref: '#/components/schemas/ScanAccepted'}}}}
        # reason: already_redeemed | integrity_quarantined (a ticket that already
        # took its one degraded admission) | integrity_operator_controlled (an
        # organizer a human has flipped to deny).
        '409': {description: 'Rejected: already redeemed, or refused by the integrity degraded mode', content: {application/json: {schema: {$ref: '#/components/schemas/ScanRejected'}}}}
        '422': {description: Invalid credential, content: {application/json: {schema: {$ref: '#/components/schemas/ScanRejected'}}}}
        '500': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /scans/reconciliations:
    post:
      # Offline occurrences syncing after reconnect (ADR-025 §D6). Recording,
      # not deciding: never a live admit/deny, always a per-occurrence result —
      # one bad occurrence never fails the batch.
      operationId: reconcileScans
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReconcileRequest'}}}}
      responses:
        '200': {description: Per-occurrence reconciliation results, content: {application/json: {schema: {$ref: '#/components/schemas/ReconcileResponse'}}}}
        '422': {description: Malformed envelope, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '500': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /orders/{ref}/tickets:
    get:
      operationId: getTickets
      parameters: [{$ref: '#/components/parameters/Ref'}]
      responses:
        '200': {description: Ticket bundle, content: {application/json: {schema: {$ref: '#/components/schemas/TicketBundle'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /orders/{ref}/tickets/{ticket}/qr.png:
    get:
      operationId: getTicketQR
      parameters:
        - {$ref: '#/components/parameters/Ref'}
        - {name: ticket, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: PNG QR artwork, content: {image/png: {schema: {type: string, format: binary}}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
components:
  parameters:
    Ref: {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
  responses:
    Error: {description: Error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  schemas:
    Error: {type: object, additionalProperties: false, required: [error], properties: {error: {type: string}}}
    # occurrence_id/occurred_at are the ADR-025 §D3 occurrence protocol, expand
    # phase (§D10): optional so old scanners keep today's semantics; occurred_at
    # is required iff occurrence_id is present — a pairing the schema cannot
    # express, enforced server-side (reason: invalid_occurrence).
    ScanRequest:
      type: object
      additionalProperties: false
      required: [qr_payload]
      properties:
        qr_payload: {type: string, minLength: 1}
        occurrence_id: {type: string, format: uuid}
        occurred_at: {type: string, format: date-time}
    ScanAccepted:
      type: object
      additionalProperties: false
      required: [decision, scanned_at]
      # replay is present-and-true only on an occurrence-matched retry — never a
      # bare accepted (ADR-025 §D3); absent on every first-time result, so old
      # scanners parse new responses unchanged.
      properties: {decision: {type: string, enum: [accepted]}, scanned_at: {type: string, format: date-time}, replay: {type: boolean}}
    ReconcileRequest:
      type: object
      additionalProperties: false
      required: [occurrences]
      properties:
        occurrences:
          type: array
          minItems: 1
          maxItems: 100
          items: {$ref: '#/components/schemas/ReconcileOccurrence'}
    ReconcileOccurrence:
      type: object
      additionalProperties: false
      required: [qr_payload, occurrence_id, occurred_at]
      # Deliberately plain strings, not format uuid/date-time: batch entries
      # are validated per occurrence server-side so ONE malformed entry gets
      # its own rejected result instead of 422-ing the whole sync — a gate
      # syncing a night's queue must never be blocked by one bad row.
      properties:
        qr_payload: {type: string, minLength: 1}
        occurrence_id: {type: string, minLength: 1}
        occurred_at: {type: string, minLength: 1}
    ReconcileResponse:
      type: object
      additionalProperties: false
      required: [results]
      properties:
        results: {type: array, items: {$ref: '#/components/schemas/ReconcileResult'}}
    ReconcileResult:
      type: object
      additionalProperties: false
      required: [occurrence_id, result]
      # skew_flagged marks a device time outside the reconciliation bound —
      # recorded and flagged, never rejected (ADR-025 §D5).
      # occurrence_id is echoed VERBATIM from the request — plain string, not
      # format uuid — so the sender can correlate a rejected entry back to its
      # queue even when the id it sent was malformed.
      properties:
        occurrence_id: {type: string}
        result: {type: string, enum: [recorded, conflict, synced, rejected]}
        occurred_at: {type: string, format: date-time}
        skew_flagged: {type: boolean}
    ScanRejected:
      type: object
      additionalProperties: false
      required: [decision, reason]
      properties:
        decision: {type: string, enum: [rejected]}
        reason: {type: string}
        original_scan_at: {type: string, format: date-time}
    LifecycleEvent:
      type: object
      additionalProperties: false
      required: [id, type, occurred_at]
      # sequence is the integrity chain's authoritative order (ADR-025 §D5);
      # optional only for legacy rows the backfill has not adopted yet.
      properties: {id: {type: string, format: uuid}, type: {type: string}, sequence: {type: integer, format: int64, minimum: 1}, occurred_at: {type: string, format: date-time}}
    Ticket:
      type: object
      additionalProperties: false
      required: [ticket_id, qr_payload, issued_at, history, qr_url]
      properties:
        ticket_id: {type: string, format: uuid}
        qr_payload: {type: string}
        issued_at: {type: string, format: date-time}
        history: {type: array, items: {$ref: '#/components/schemas/LifecycleEvent'}}
        qr_url: {type: string}
    TicketBundle:
      type: object
      additionalProperties: false
      required: [order_ref, tickets]
      properties:
        order_ref: {type: string, format: uuid}
        tickets: {type: array, items: {$ref: '#/components/schemas/Ticket'}}
