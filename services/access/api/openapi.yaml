openapi: 3.0.3
info: {title: Access API, version: 1.0.0}
paths:
  /scans:
    post:
      summary: Validate and atomically redeem one signed ticket credential
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [qr_payload]
              properties:
                qr_payload: {type: string, minLength: 1}
      responses:
        '200': {description: Ticket accepted and redemption appended to its lifecycle trace}
        '409': {description: Ticket was already redeemed; response includes original_scan_at}
        '422': {description: Malformed, forged, unknown, or mismatched ticket credential}
  /orders/{orderRef}/tickets:
    get:
      summary: Retrieve the guest ticket bundle and pseudonymous lifecycle history
      parameters: [{name: orderRef, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Ticket bundle}, '404': {description: Unknown guest reference}}
  /orders/{orderRef}/tickets/{ticketId}/qr.png:
    get:
      summary: Render a signed ticket QR code for a guest ticket bundle
      parameters:
        - {name: orderRef, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: ticketId, in: path, required: true, schema: {type: string, format: uuid}}
      responses: {'200': {description: PNG QR artwork, content: {image/png: {}}}, '404': {description: Unknown ticket}}
