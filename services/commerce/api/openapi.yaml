openapi: 3.0.3
info: {title: Commerce API, version: 1.0.0}
paths:
  /reservations:
    post:
      operationId: createReservation
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReservationCreate'}}}}
      responses:
        '201': {description: Reserved, content: {application/json: {schema: {$ref: '#/components/schemas/Reservation'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}
  /orders:
    post:
      operationId: checkout
      # X-Customer-Assertion is OPTIONAL and its absence means GUEST — the default
      # this system was built around. A header rather than a body field because
      # `Checkout` is additionalProperties:false and adding a property there would
      # change the guest request shape (TKT-221).
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/CustomerAssertion'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Checkout'}}}}
      responses:
        '200': {description: Completed, content: {application/json: {schema: {$ref: '#/components/schemas/OrderResult'}}}}
        '202': {description: Recovery pending, content: {application/json: {schema: {$ref: '#/components/schemas/OrderPending'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {description: 'The assertion is absent-but-malformed, forged or expired. NOT downgraded to a guest order: silently dropping a failed attribution would hide it from the buyer, who would then not find the purchase in their account.', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '402': {description: Declined, content: {application/json: {schema: {$ref: '#/components/schemas/OrderFailure'}}}}
        '408': {description: No-side-effect timeout, content: {application/json: {schema: {$ref: '#/components/schemas/OrderFailure'}}}}
        '409': {description: Checkout conflict or payment in progress, content: {application/json: {schema: {$ref: '#/components/schemas/OrderConflict'}}}}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /orders/{id}:
    get:
      operationId: getOrder
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '200': {description: Order state, content: {application/json: {schema: {$ref: '#/components/schemas/OrderState'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /customers:
    post:
      operationId: registerCustomer
      summary: Create an optional customer account (TKT-220)
      description: >
        Registers a buyer account. Commerce owns orders and buyer_pii, so the
        buyer principal lives here rather than in catalog, on the stateless
        gateway, or in a sixth service — ADR-049 records the decision and why
        ADR-042's reasoning for putting STAFF in catalog does not transplant to a
        customer, who administers nothing.

        This operation is PUBLIC and carries no credential. Registration is open
        to anyone by definition, and the storefront that renders the form holds no
        service token at all — giving it one to reach an /internal/ endpoint would
        put a credential inside a process that serves anonymous internet traffic.
        ADR-043's rule is what places it here: declared contract operations are the
        service's public surface, inline X-Internal-Token checks guard /internal/.

        An address that is already registered answers 409. That deliberately
        discloses whether an address holds an account — an unauthenticated,
        unrate-limited membership oracle over the whole customer base. The
        alternative (answer 201 and mail the owner) is not available: this repo has
        no mail path, so it would be a lie told to a legitimate buyer rather than a
        protection. Rate limiting is TKT-224 and is the control that addresses it.

        buyer_pii is NOT touched. It is keyed per reservation and rewritten on
        every checkout — an order-time snapshot, not an identity. Attaching an
        order to an account is TKT-221.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CustomerRegistration'}}}}
      responses:
        '201': {description: Registered, content: {application/json: {schema: {$ref: '#/components/schemas/CustomerPrincipal'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {description: The address already holds an account, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/Error'}
  /customers/{id}/orders:
    get:
      operationId: listCustomerOrders
      summary: The signed-in customer's completed purchases, newest first (TKT-222)
      description: >
        The wallet read. Returns the COMPLETED orders belonging to the customer the
        `X-Customer-Assertion` header authenticates as, newest first, keyset-paged.

        **The path id is a selector, not authority.** The handler compares it with
        the customer the assertion resolves to and refuses when they differ — the
        assertion is the only identity commerce has (ADR-049 § TKT-221). A mismatch
        answers **404** rather than 403, because a 403 would confirm that the named
        customer exists. Commerce already answers 404 rather than 401 on its
        internal surface for the same non-disclosure reason (ADR-043).

        The 404 is a MISMATCH answer and NOT an existence check: there is no lookup
        against `customer_accounts`, so a valid assertion naming an id with no
        account answers 200 with an empty page. That is unreachable in practice —
        an assertion is only minted for an account that authenticated, and there is
        no delete path — and defending it would put a database round trip on every
        wallet read.

        The `after` cursor is bound to the customer it was issued for and a foreign
        one is refused. It could never read another customer's rows (the query
        filters on the assertion regardless), but applied to the wrong customer it
        silently suppresses their own.

        Paged on `(created_at, id)` DESC, NOT `updated_at`: that column is
        rewritten by checkout retries, the payment_unknown and confirmation_pending
        transitions, recovery and the cancellation-refund runner, and a keyset
        cursor on a mutable key makes rows jump pages. `created_at` also means the
        thing a buyer expects a purchase list to be sorted by.

        Each row carries `guest_order_ref`, which is a BEARER credential for the
        ticket bundle (ADR-012) — it is here because the wallet's job is to link to
        the existing ticket page rather than render tickets a second time. The
        response is `no-store` and the reference must not reach a log.

        Naming the adversary (ADR-021): this stops an HTTP caller from reading
        another customer's purchases. It says nothing about anyone who can read the
        commerce database.
      parameters:
        - {$ref: '#/components/parameters/Id'}
        - {$ref: '#/components/parameters/CustomerAssertion'}
        - {$ref: '#/components/parameters/Locale'}
        - name: after
          in: query
          required: false
          description: The opaque cursor from the previous page. Absent means the first page.
          schema: {type: string, minLength: 1, maxLength: 200}
      responses:
        '200': {description: One page of the wallet, content: {application/json: {schema: {$ref: '#/components/schemas/CustomerOrderPage'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {description: 'The assertion is absent, forged or expired.', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '404': {description: 'No such customer — or the assertion names a different one. Deliberately the same answer.', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '500': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /orders/claim:
    post:
      operationId: claimGuestOrder
      summary: Attach a past guest order to the signed-in customer (TKT-223)
      description: >
        Claims a completed guest order by its reference, attributing it to the
        customer the `X-Customer-Assertion` header authenticates as. It closes
        TKT-21's first COS: creating an account later must not cost a buyer their
        history.

        **What proves ownership is the reference, and nothing else.** That is a
        deliberate choice with a real cost, recorded in ADR-049 § TKT-223. The
        alternative — also requiring the address to match `buyer_pii` — refuses a
        buyer who signed up with a different address, which is common and which
        they cannot fix. Reference-only admits anyone holding a leaked reference.

        Be precise about what that grants, because it is more than it looks:
        holding the reference already returns the tickets themselves (ADR-012), so
        reading is unchanged. What is new is that a claim is **destructive,
        exclusive, permanent and unrecoverable** — the first claimant takes the
        order away from its buyer, and there is no un-claim path.

        **Nonexistent, not completed, and already claimed by somebody else are one
        answer: 404.** Telling them apart would hand a caller probing references an
        oracle for which are real, complete and unclaimed. The cost is that a buyer
        who mistypes gets no help.

        **Idempotent by predicate**, not by replay detection: the same customer
        claiming twice takes the same branch and gets the same answer, so a browser
        retry is safe. No `Idempotency-Key`.

        No order status changes. `orders.status` keeps ADR-016's vocabulary and
        `updated_at` is not touched — it means "when did this order's checkout last
        move", and a claim months later is not checkout activity.
      parameters:
        - {$ref: '#/components/parameters/CustomerAssertion'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/OrderClaim'}}}}
      responses:
        '200': {description: 'Claimed, or already claimed by this same customer', content: {application/json: {schema: {$ref: '#/components/schemas/OrderClaimResult'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {description: 'The assertion is absent, forged or expired.', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '404': {description: 'No such order, not completed, or claimed by somebody else. Deliberately one answer.', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /customers/authenticate:
    post:
      operationId: authenticateCustomer
      summary: Verify customer credentials and return the principal (TKT-220)
      description: >
        Verifies an email/password pair and returns the principal — customer id
        and the address in its original spelling. Never any password material.

        An unknown address and a wrong password are the SAME answer: the same 401,
        the same body. They also cost the same, because the unknown-address path
        still performs one bcrypt comparison against a fixed dummy hash of the
        production cost. A response that is byte-identical but an order of
        magnitude faster is still an enumeration oracle.

        Public for the same reason as registerCustomer: the sign-in form in front
        of it is anonymous by construction.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CustomerCredentials'}}}}
      responses:
        '200': {description: Authenticated, content: {application/json: {schema: {$ref: '#/components/schemas/CustomerPrincipal'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {description: Invalid credentials, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/Error'}
  /customers/password-reset:
    post:
      operationId: requestPasswordReset
      summary: Ask for a password-reset link (TKT-226)
      description: >
        Mints a single-use time-bounded token for the address and enqueues the
        message that carries it. Public and unauthenticated, for the same reason
        registerCustomer is: the form in front of it belongs to someone who cannot
        sign in, so no credential is available by construction.

        THE ANSWER IS 202 WHETHER OR NOT THE ADDRESS HOLDS AN ACCOUNT, and that is
        the point of the operation's shape. Telling a caller that an address is
        unknown would rebuild the membership oracle ADR-049 §2 already regrets on
        registration. There is no 404 here and adding one would be a security
        regression, not a usability fix.

        The response is identical in STATUS and BYTES. It is not identical in COST
        — a known address commits two rows and an unknown address commits none.
        That defends against a caller reading responses, not one timing them, and
        ADR-050 records it rather than implying otherwise. Volume is what makes
        timing measurable, which is TKT-224.

        Sending is ENQUEUED, never inline. That is what makes the two answers the
        same: neither has attempted delivery when the response is written, so a
        provider failure cannot become an existence oracle. See ADR-050 §3.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PasswordResetRequest'}}}}
      responses:
        '202': {description: Accepted; a message is enqueued if and only if the address holds an account, content: {application/json: {schema: {$ref: '#/components/schemas/Accepted'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/Error'}
  /customers/password-reset/complete:
    post:
      operationId: completePasswordReset
      summary: Redeem a reset token and set a new password (TKT-226)
      description: >
        Redeems the token from the mailed link and replaces the credential. The
        token arrives in the BODY, never in the path — the request logger records
        r.URL.Path on every service and the gateway, so a token in a path segment
        would be written to a log the way TKT-202 records guest_order_ref being
        written today.

        Single-use and time-bounded, enforced by one conditional UPDATE rather than
        a SELECT then an UPDATE: a read-then-write is a race two redemptions both
        win, and the loser would silently overwrite the winner's new password.

        Unknown, expired and already-redeemed are ONE answer (400), for the reason
        authenticateCustomer has one answer: distinguishing them tells a prober
        which tokens were ever real.

        The response carries customer_id so the caller can destroy that customer's
        sessions. Commerce cannot do it — sessions live in the storefront process
        (ADR-049 §4) — so a reset completed by calling commerce directly signs
        nobody out. ADR-050 names that as an open gap rather than implying the
        criterion is fully met.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PasswordResetCompletion'}}}}
      responses:
        '200': {description: The password was replaced, content: {application/json: {schema: {$ref: '#/components/schemas/PasswordResetResult'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/Error'}
  # The partner (reseller) surface (TKT-240 / ADR-056). READ-ONLY in this slice.
  #
  # A partner WRITE (holding stock) is deliberately absent, and its absence is the
  # honest position rather than an unfinished one. A hold would have to consume the
  # credential's channel allocation to mean anything, and inventory does not yet
  # enforce that: the channel stops at catalog's fee resolution and never reaches
  # the claim path. Exposing the write before TKT-246 lands would ship an operation
  # whose stated security property -- a partner is confined to its own channel --
  # is simply false, and a caller would consume public stock while believing
  # otherwise. TKT-246 adds the write with the enforcement.
  #
  # Unlike /internal/, these ARE reachable from the edge: the gateway 404s /api/commerce/internal/* by
  # construction, and a reseller is an external caller. What guards them is the
  # declared `security:` below, enforced by the OpenAPI validator rather than by a
  # header comparison inside a handler — ADR-043's line for a contract operation.
  #
  # Every one of these declares `security: [PartnerCredential: []]` explicitly.
  # There is no document-level default in this spec, deliberately: adding one
  # would silently place a requirement on the twenty existing operations, and the
  # customer surface's guard is an assertion header, not this credential.
  /partners/availability:
    get:
      operationId: getPartnerAvailability
      summary: Availability for the partner's own channel on one slot.
      description: >
        The organizer and channel are NOT parameters — they are read from the
        credential (ADR-056). A partner asks "what is available to me on this
        slot", and cannot phrase a question about anybody else's channel.
      security: [{PartnerCredential: []}]
      parameters:
        - {name: slot_id, in: query, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Availability for the credential's channel, content: {application/json: {schema: {$ref: '#/components/schemas/PartnerAvailability'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}
  /partners/reservations:
    post:
      operationId: createPartnerReservation
      summary: Hold stock against the partner's own channel allocation.
      description: >
        The reserve a reseller makes on its own channel (TKT-246). Like the
        availability read above, the channel and the reseller identity are NOT
        parameters — they are read from the credential (ADR-056) and forwarded to
        inventory, which judges them against the allocation's `sold_by` under the
        pool row lock. A partner cannot phrase a request that consumes anybody
        else's allocation.


        `organizer_id` IS in the body, because the shared reserve path needs it, and
        the handler COMPARES it against the credential's rather than trusting it — a
        mismatch is 403, never a silent rewrite.


        GA only: `quantity`, no `seat_identities`. Seated pools do not consult channel
        allocations at all (TKT-176 owns that seam), so a seated partner sale would
        claim an authorization this contract cannot deliver.


        409 is inventory's refusal, and it is deliberately uniform across "sold out",
        "not your allocation" and "no allocation configured". A distinguishing code
        would tell a caller which channels exist and who owns them — the enumeration
        oracle `presale_code_invalid` was made uniform to prevent.
      security: [{PartnerCredential: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PartnerReservationCreate'}
      responses:
        '201': {description: Reserved, content: {application/json: {schema: {$ref: '#/components/schemas/Reservation'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}
  /internal/operational-holds/{id}/convert:
    post:
      operationId: convertOperationalHold
      summary: Staff conversion of an operational hold into a purchasable reservation
      parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/OperationalConversionCreate'}}}}
      responses:
        '200': {description: Replayed conversion, content: {application/json: {schema: {$ref: '#/components/schemas/OperationalConversion'}}}}
        '201': {description: Converted, content: {application/json: {schema: {$ref: '#/components/schemas/OperationalConversion'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}
  /internal/group-reservations/{id}/draw-down:
    post:
      operationId: drawDownGroupReservation
      summary: Staff draw-down of a group/agency reservation into a purchasable reservation
      parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/OperationalConversionCreate'}}}}
      responses:
        '200': {description: Replayed draw-down, content: {application/json: {schema: {$ref: '#/components/schemas/OperationalConversion'}}}}
        '201': {description: Drawn down, content: {application/json: {schema: {$ref: '#/components/schemas/OperationalConversion'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}
  /internal/orders/{id}/refunds:
    post:
      operationId: refundOrder
      summary: Staff refund of all or part of a completed order (money leg only)
      # Post-purchase refund (TKT-156, ADR-037). The order's checkout status stays
      # `completed` — a refunded purchase is still a purchase that happened, and
      # `orders.status='refunded'` already means something else (a compensated FAILED
      # checkout, ADR-016). Refund state is reported on its own dimension.
      # Returning the inventory capacity and voiding the tickets is TKT-157.
      parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RefundCreate'}}}}
      responses:
        '200': {description: Refunded (or replay of a completed refund), content: {application/json: {schema: {$ref: '#/components/schemas/Refund'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /internal/orders/{id}/voids:
    post:
      operationId: voidOrder
      summary: Staff reversal of a COMPED (zero-price) completed order — tickets and capacity, no money
      # TKT-171. A comped order has no money leg, so it cannot be refunded:
      # BindOrderRefund refuses unit <= 0 because no provider issues a zero-amount
      # refund and pretending one happened would fabricate a money fact (ADR-003).
      # Before this it therefore got no reversal AT ALL — a cancelled event's comped
      # orders kept admitting and kept their seats.
      #
      # A distinct operation rather than a mode of the refund, per the owner's
      # decision. Visible in the shapes: the request carries NO quantity, amount or
      # currency (the quantity is whole-order, read from the reservation under the
      # order row lock), and the response reports no money. A caller cannot instruct
      # a zero-amount refund here because there is nothing on the wire to instruct
      # it with.
      #
      # The two downstream obligations are the same two a refund has, discharged by
      # the same ordered driver: tickets are voided BEFORE capacity is returned
      # (ADR-038 Section 1 — freeing the seat while the ticket still admits is the
      # one sequence that can oversell). They are reported independently because an
      # outstanding obligation is a real state a replay retries.
      parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/VoidCreate'}}}}
      responses:
        '200': {description: Voided (or replay), content: {application/json: {schema: {$ref: '#/components/schemas/OrderVoid'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        # Includes the routing answer: an order WITH captured money is refused here
        # and must go through the refund instead.
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /internal/orders/{id}/exchanges:
    post:
      operationId: exchangeOrder
      summary: Staff exchange of a completed order for a different ticket type (settlement only)
      # TKT-158 / ADR-039. Settles exactly the DIFFERENCE — one net provider movement, not
      # a refund of the old gross plus a charge of the new — and journals both gross legs.
      # Ends in `switch_pending`: the replacement is confirmed and the buyer still holds
      # VALID OLD TICKETS. Switching the entitlement is TKT-166.
      #
      # Every refusal (seated source, currency mismatch, unavailable target) happens
      # BEFORE any money moves, because an exchange has no safe partial state.
      parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ExchangeCreate'}}}}
      responses:
        '200': {description: Settled (or replay), content: {application/json: {schema: {$ref: '#/components/schemas/Exchange'}}}}
        # The money moved and the target claim did not confirm (TKT-167). A REAL,
        # retryable state, and the whole reason the basis is persisted before the
        # provider is called: replaying the same key resumes from that basis and
        # finishes, with no second provider movement.
        #
        # It was undeclared until TKT-167, which made it a 500 under the response
        # validator (ADR-028) — an outage-shaped answer to the one state that is
        # recoverable by retrying. The handler has written it since TKT-158; only the
        # contract was missing, so nothing but the declaration changes here.
        '202': {description: 'Charged; confirmation pending — replay the same key to resume', content: {application/json: {schema: {$ref: '#/components/schemas/ExchangePending'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /internal/orders/{id}/unclaim:
    post:
      operationId: unclaimOrder
      summary: Detach a completed order from the customer account it was claimed by
      # TKT-225 / ADR-052. The undo for TKT-223's claim, which ADR-049 describes as
      # "destructive, exclusive, permanent and unrecoverable" — until this operation, the
      # only remedy was a manual UPDATE against the commerce database.
      #
      # Restores attribution to NULL and NOTHING ELSE. It never repoints the order at a
      # different customer: that is a transfer (TKT-9/TKT-160), which has a different
      # adversary and needs its own argument. Order status, money, tickets and updated_at
      # are all untouched.
      #
      # `actor` and `reason` are REQUIRED and recorded. An un-claim that leaves no trace
      # turns a support tool into a way to move purchases quietly. Note what the record is
      # worth (ADR-021): the row lives in the database it describes, so it is accountability
      # against a careless operator, not tamper evidence against one with database access.
      # `actor` is an operator-supplied LABEL — this operation's guard is the shared internal
      # token, which carries no individual identity.
      #
      # A detached order becomes immediately re-claimable, deliberately (ADR-052): the most
      # likely detach is support fixing a mistake, and blocking re-claim would block the
      # rightful buyer. The claim path is rate limited by ADR-051.
      #
      # Idempotency-Key is REQUIRED, and it is not ceremony (ai-review [high]). Because a
      # detached order is immediately re-claimable, a lost response plus a retry would
      # otherwise detach whoever claimed it in between — a customer the operator never
      # reviewed, recorded under the original reason. The key makes a replay return the
      # first result without touching the order again.
      parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/OrderUnclaim'}}}}
      responses:
        '200': {description: Detached, content: {application/json: {schema: {$ref: '#/components/schemas/OrderUnclaimed'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /internal/exchanges/{id}/tickets-switched:
    post:
      operationId: exchangeTicketsSwitched
      summary: Access reports that an exchange's entitlement switch has committed
      # TKT-166 / ADR-038 §1, ADR-039 §6. Access calls this AFTER its switch transaction
      # commits. Commerce records `tickets_exchanged_at` and only THEN returns the old
      # capacity to inventory: freeing capacity while the old tickets still admit is the
      # one ordering that can oversell, and this call is the evidence it was honoured.
      #
      # Idempotent — a lost response is retried by an unacknowledged JetStream message,
      # and both the marker and inventory's receipt absorb the repeat.
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ExchangeSwitched'}}}}
      responses:
        '200': {description: Switch recorded and old capacity returned, content: {application/json: {schema: {$ref: '#/components/schemas/ExchangeSwitchResult'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}
  /internal/slots/{id}/cancellation-refunds:
    post:
      operationId: createCancellationRefundRun
      summary: Refund a cancelled event's whole order book, with a per-order outcome
      # TKT-159 / ADR-040. Starts a DURABLE run over one slot's completed order book and
      # returns immediately; a commerce background runner does the work in bounded
      # batches. The run is the unit of resumability — nothing here holds a transaction
      # or a lock across the book.
      #
      # `id` is the SLOT. No catalog lookup and no cancelled-state precondition: this
      # refunds an order book ON DEMAND, and coupling it to the slot transition would
      # pull in TKT-2/ADR-018, which is out of scope. A slot with no orders is a valid
      # run that completes with zero outcomes.
      #
      # `cutoff_at` bounds the RESERVATION set the run pages through, which is what makes
      # the book finite and the run resumable. It does not bound order completion: an order
      # not yet completed when its page is read belongs to a later run — see
      # `incomplete_at_enumeration` on the report, which is how that stops being silent.
      parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CancellationRefundCreate'}}}}
      responses:
        '201': {description: Run created, content: {application/json: {schema: {$ref: '#/components/schemas/CancellationRefundRun'}}}}
        '200': {description: Replay of an identical run request, content: {application/json: {schema: {$ref: '#/components/schemas/CancellationRefundRun'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /internal/cancellation-refunds/{id}:
    get:
      operationId: getCancellationRefundReport
      summary: Per-order outcomes of a cancellation refund run
      # TKT-159 / ADR-040. Per-order rows are served only once the run is COMPLETE: a
      # paginating reader must not have the membership grow underneath it. While the run
      # is still going this answers 202 with the run plus the counts so far, so progress
      # is visible without pretending the report is final.
      parameters:
        - {$ref: '#/components/parameters/Id'}
        - {$ref: '#/components/parameters/OrganizerIdQuery'}
        - {$ref: '#/components/parameters/ReportLimit'}
        - {$ref: '#/components/parameters/AfterOrderId'}
      responses:
        '200': {description: Completed report page, content: {application/json: {schema: {$ref: '#/components/schemas/CancellationRefundReport'}}}}
        '202': {description: Run still enumerating or processing, content: {application/json: {schema: {$ref: '#/components/schemas/CancellationRefundReport'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /internal/buyers/{id}/delivery-email:
    get:
      operationId: getDeliveryEmail
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '200': {description: Delivery address, content: {application/json: {schema: {$ref: '#/components/schemas/DeliveryEmail'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    PartnerCredential:
      description: >
        A reseller's API credential (TKT-240, ADR-056) — the platform's THIRD
        machine identity class, beside staff sessions (ADR-042), the shared
        internal service token (ADR-043) and customer sessions (ADR-049).

        Deliberately NOT the shared INTERNAL_SERVICE_TOKEN: that one value opens
        every service's internal surface, and this one opens one reseller's sales
        on one organizer's one channel. It is also not a static configured secret
        at all — it is a per-reseller database row, issued once, stored as a hash
        and revocable on the next request.

        The credential CARRIES ITS SCOPE. Organizer and channel are read from the
        row, never from the request, which is what keeps a partner inside its own
        tenant; ADR-053 records what the other arrangement costs.
      type: apiKey
      in: header
      name: X-Partner-Credential
  parameters:
    Id: {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 200}}
    CustomerAssertion: {name: X-Customer-Assertion, in: header, required: false, schema: {type: string, minLength: 1, maxLength: 512}}
    Locale: {name: locale, in: query, required: true, description: 'BCP-47 primary subtag; the supported set is data, not schema (TKT-36)', schema: {type: string, minLength: 2, maxLength: 8}}
    OrganizerIdQuery: {name: organizer_id, in: query, required: true, schema: {type: string, format: uuid}}
    ReportLimit: {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 200}}
    AfterOrderId: {name: after_order_id, in: query, required: false, schema: {type: string, format: uuid}}
  responses:
    Error: {description: Error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    # TKT-240. Declared because ADR-028's response validation is fail-closed: an
    # undeclared status is rewritten to 500, which would turn every refused
    # partner credential into an apparent commerce outage.
    #
    # The description is uniform on purpose. A refused credential says nothing
    # about WHY — unknown, revoked, malformed and absent are one answer, because a
    # partner integration that can tell them apart can enumerate.
    Unauthorized:
      description: >
        The partner credential is absent, unknown, malformed or revoked. These are
        deliberately indistinguishable.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    # TKT-224 / ADR-051. Declared on every operation the limiter guards, and ONLY
    # those — an undeclared status is rewritten to 500 by the response validator,
    # which is how this was found: the limiter worked and the buyer saw an outage.
    # The description is deliberately uniform; a 429 says nothing about whether the
    # subject exists, because the limiter refuses before commerce looks it up.
    TooManyRequests:
      description: >
        Rate limited (ADR-051). Discloses nothing about the submitted address,
        order reference or token: the budget is spent before any lookup, so the
        answer is identical for a subject that exists and one that does not.
      headers:
        Retry-After: {description: Seconds to wait before retrying, schema: {type: string}}
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: {type: string}
        code: {type: string, enum: [seat_taken, orphaned_seats, seated_pool_unsupported], description: 'Machine-readable refusal reason. `seat_taken`: a seated reservation lost seats to a competing claimant (TKT-173). `orphaned_seats`: the selection would strand free seats with no free neighbour (ADR-041, TKT-182). `seated_pool_unsupported`: a quantity claim was made against a SEATED pool, which sells seat by seat and can never satisfy it (TKT-240). Distinguished from a generic conflict because a caller retrying it would wait forever; TKT-176 owns the seated channel seam.'}
        seat_identities:
          type: array
          description: >
            With `seat_taken`: the requested seats another buyer already holds,
            sorted — a SUBSET of the request, forwarded verbatim from the inventory
            transaction that arbitrated. With `orphaned_seats`: the FREE seats the
            selection would strand — seats the buyer did NOT request, so the subset
            rule deliberately does not apply to them and a picker must keep them
            selectable, since adding one is the repair. Never synthesised by
            commerce: a refusal without a usable identity list is a 502, not a guess.
          items: {type: string, minLength: 1, maxLength: 200}
    # The partner request bodies (TKT-240). Note what is ABSENT from all three:
    # there is no `channel_code` field anywhere. The channel is the credential's,
    # and a field a partner could fill would be a field the handler might trust.
    PartnerAvailability:
      type: object
      additionalProperties: false
      description: >
        What the partner's own channel has left on this slot. `channel_code` is
        echoed so an integration can assert it is talking about the channel it
        believes it holds — it is an answer, never a question.
      required: [slot_id, channel_code, available]
      properties:
        slot_id: {type: string, format: uuid}
        channel_code: {type: string, minLength: 1, maxLength: 100}
        available: {type: integer, minimum: 0, description: 'Units the credential''s channel may still sell on this slot.'}
    PartnerReservationCreate:
      type: object
      additionalProperties: false
      description: >
        A partner GA reserve (TKT-246). Deliberately NOT a variant of
        ReservationCreate: it omits `channel_code` and has no `reseller_id`, so the
        two fields inventory authorizes on cannot be named by the caller at all.
        `additionalProperties: false` makes that a 400 at the edge rather than a
        field the handler has to remember to ignore — the guard is the absence of
        the field, not a check.


        No `seat_identities`, so no XOR to express and none of ReservationCreate's
        minProperties/maxProperties/not machinery: GA is the only shape.
      required: [organizer_id, ticket_type_id, quantity]
      properties:
        organizer_id:
          type: string
          format: uuid
          description: >
            Must equal the credential's organizer; a mismatch is 403. Present
            because the shared reserve path needs it, not because the caller is
            trusted with it.
        ticket_type_id: {type: string, format: uuid}
        quantity: {type: integer, minimum: 1, maximum: 50}
    ReservationCreate:
      type: object
      additionalProperties: false
      description: >
        Exactly one of `quantity` (general admission) or `seat_identities`
        (reserved seating, TKT-173) — never both, never neither. That XOR is
        expressed by the property counts rather than a top-level `oneOf`: with
        two required properties, two optional ones and no additional properties
        allowed, `minProperties: 3` / `maxProperties: 3` admits exactly one of
        the alternatives. `oneOf` would be the obvious spelling and is avoided
        deliberately — the generator turns a top-level union into a
        json.RawMessage with As…/From… accessors instead of a usable request
        struct, which is a worse contract bought with a worse API. The handler
        enforces the same XOR independently; a caller invoking it directly must
        not be able to slip past the schema.
      required: [organizer_id, ticket_type_id]
      minProperties: 3
      # Back to 3 with channel_code removed (TKT-248): two required properties plus
      # exactly one of the two alternatives. It was 4 while channel_code was an
      # optional fourth.
      maxProperties: 3
      # maxProperties alone STOPS expressing the XOR once a fifth property
      # exists (TKT-215): {organizer_id, ticket_type_id, quantity,
      # seat_identities} is four properties and would be admitted. `not` restores
      # it explicitly. It is invisible to the code generator -- which is what
      # ruled out a top-level oneOf -- so the request struct is unchanged.
      #
      # KEPT even though maxProperties: 3 now excludes that shape on its own. The
      # count is a coincidence of today's field list -- it was 4 yesterday and a
      # future optional property makes it 4 again -- while `not` says the XOR
      # directly and stays true either way (TKT-248).
      not:
        required: [quantity, seat_identities]
      properties:
        organizer_id: {type: string, format: uuid}
        ticket_type_id: {type: string, format: uuid}
        # NO `channel_code` (TKT-248, ADR-060). It was here until this operation's
        # channel became an ENTITLEMENT question rather than a routing one.
        #
        # This operation is unauthenticated, and catalog resolves BOTH fee rules
        # (ADR-046 §4) and -- since TKT-237 -- PRICE rules on the channel. So a
        # body-supplied channel let a public caller choose their own price basis,
        # and an `absorbed` fee rule made that a SMALLER charge with the organizer
        # bearing the difference: a revenue leak, not a reporting artifact.
        #
        # Removing the property rather than validating it is the guard, exactly as
        # PartnerReservationCreate already does: with `additionalProperties: false`
        # the field is UNSUBMITTABLE, so there is no value to check and no check to
        # get wrong. The handler refuses it too, for the day this contract is
        # edited; that is a second line, not the mechanism.
        #
        # A partner's channel comes from its ADR-056 credential and nowhere else.
        # The channels REGISTRY is untouched by this: it remains a lookup and not a
        # sale constraint (ADR-024), and an unregistered or retired code still sells
        # verbatim for an authenticated partner.
        quantity: {type: integer, minimum: 1, maximum: 50, description: 'General admission: how many. Mutually exclusive with seat_identities.'}
        seat_identities:
          type: array
          minItems: 1
          maxItems: 50
          description: >
            Reserved seating: exactly which seats, as stable "section/row/seat"
            identities read from the seat map. Mutually exclusive with quantity.
            The set is canonicalised (sorted, de-duplicated) by inventory, so
            [A,B] and [B,A] are the same request under one idempotency key — and
            the reservation's money follows the CLAIMED seat count, not the
            length of this array.
          items: {type: string, minLength: 1, maxLength: 200}
    Reservation:
      type: object
      additionalProperties: false
      required: [reservation_id, hold_id, buyer_id, amount, currency, expires_at, server_time]
      properties:
        reservation_id: {type: string, format: uuid}
        hold_id: {type: string, format: uuid}
        buyer_id: {type: string, format: uuid}
        amount: {type: integer, format: int64}
        currency: {type: string}
        expires_at: {type: string, format: date-time}
        server_time: {type: string, format: date-time}
        seats:
          type: array
          description: >
            The seats actually claimed, sorted and de-duplicated — inventory's
            canonical set, never the request's array (TKT-173). Present on a
            seated reservation and OMITTED on a general-admission one: absence is
            the reservation-kind signal, and an empty array would read as a seated
            claim that holds nothing. It cannot be required, because every
            existing GA and staff-created reservation response lacks it and the
            response validator fails closed (ADR-028) — requiring it would turn
            those valid responses into runtime 500s.
          items: {type: string, minLength: 1, maxLength: 200}
        face_value:
          description: >
            The rule-resolved price times quantity, before any fee (TKT-215).
            `amount` minus `face_value` is exactly the passed-on fee total.

            OPTIONAL, like `seats` and for the same reason: every reservation
            created before this field existed lacks it, and the response
            validator fails closed (ADR-028), so requiring it would turn those
            valid responses into runtime 500s. It is absent on a reservation with
            no fee snapshot -- a pre-TKT-215 row or a staff-created one -- and
            absence means "this sale had no fee concept", which is a different
            fact from "its fees totalled nothing".
          type: integer
          format: int64
          minimum: 0
        passed_on_fees:
          description: >
            The part of `amount` that is fees the buyer pays. Absorbed fees are
            NOT here and never reach `amount`: they are borne by the organizer out
            of the face value, and charging them to the buyer would be charging
            for the organizer's cost. They are recorded in the persisted snapshot
            because TKT-217 still owes them to a payee.
          type: integer
          format: int64
          minimum: 0
        fee_breakdown:
          description: >
            One entry per fee code that applied, INCLUDING any whose computed
            amount is zero (ADR-046 §2) -- a code that vanished as a function of
            price would leave settlement with a payee that is sometimes owed
            nothing and sometimes absent. A fee code that was considered but had
            no live rule produces no entry at all.
          type: array
          items:
            type: object
            required: [fee_code, basis, incidence, amount, currency]
            properties:
              fee_code: {type: string, minLength: 1, maxLength: 64}
              basis:
                type: string
                enum: [per_ticket_fixed, per_order_fixed, percentage_bps]
              incidence:
                type: string
                enum: [passed_on, absorbed]
              amount: {type: integer, format: int64, minimum: 0}
              currency: {type: string, pattern: '^[A-Z]{3}$'}
    OperationalConversionCreate:
      type: object
      additionalProperties: false
      required: [organizer_id, ticket_type_id, quantity, actor, reason]
      properties:
        organizer_id: {type: string, format: uuid}
        ticket_type_id: {type: string, format: uuid}
        quantity: {type: integer, minimum: 1, maximum: 50}
        actor: {type: string, minLength: 1, maxLength: 200}
        reason: {type: string, minLength: 1, maxLength: 500}
    OperationalConversion:
      type: object
      additionalProperties: false
      required: [reservation_id, hold_id, buyer_id, amount, currency, expires_at, server_time, source_remaining]
      properties:
        reservation_id: {type: string, format: uuid}
        hold_id: {type: string, format: uuid}
        buyer_id: {type: string, format: uuid}
        amount: {type: integer, format: int64}
        currency: {type: string}
        expires_at: {type: string, format: date-time}
        server_time: {type: string, format: date-time}
        source_remaining: {type: integer}
    CustomerRegistration:
      description: >
        A customer registration attempt (TKT-220). maxLength on both fields bounds
        the work an unauthenticated caller can ask for. 72 on the password is
        bcrypt's hard input limit, past which it silently ignores the tail — so a
        longer password and its 72-byte prefix would authenticate each other.

        Note the limit is not fully expressible here: OpenAPI counts CHARACTERS
        and bcrypt counts BYTES, so 72 multibyte characters clear this schema and
        are three times over bcrypt's bound. The store refuses those before it
        touches the database, uniformly, so the refusal leaks nothing.
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email: {type: string, minLength: 3, maxLength: 320}
        password: {type: string, minLength: 8, maxLength: 72}
    CustomerCredentials:
      description: A customer sign-in attempt (TKT-220). Bounded for the same reason as CustomerRegistration.
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email: {type: string, minLength: 1, maxLength: 320}
        # minLength 1, not 8: raising the floor here would refuse a short password
        # BEFORE the credential check and answer differently from a wrong one,
        # which is a distinction an enumerator can read. Registration is where the
        # policy is enforced; sign-in only verifies.
        password: {type: string, minLength: 1, maxLength: 72}
    PasswordResetRequest:
      description: >
        An address to send a reset link to (TKT-226). minLength 1, deliberately —
        not 3 as on registration. A floor that refuses a short address BEFORE the
        lookup would answer differently from one that reaches it, which is the same
        oracle CustomerCredentials avoids by using 1 instead of 8 on the password.
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email: {type: string, minLength: 1, maxLength: 320}
    PasswordResetCompletion:
      description: >
        A redemption (TKT-226). The token is 32 random bytes in base64url, so 43
        characters; the bound is loose rather than exact because a token of the
        wrong length must be refused by the LOOKUP, identically to one that is
        simply unknown, and not by the validator with a different status.

        The password floor is 8 here and not 1, unlike sign-in. Sign-in verifies an
        existing credential and must not refuse a short one differently from a wrong
        one; this operation SETS a credential, so it is where the policy belongs —
        the same place registration puts it.
      type: object
      required: [token, password]
      additionalProperties: false
      properties:
        token: {type: string, minLength: 1, maxLength: 200}
        password: {type: string, minLength: 8, maxLength: 72}
    PasswordResetResult:
      description: >
        The customer whose password was replaced. Returned so the caller can destroy
        that customer's storefront sessions; it is not a principal and carries no
        assertion — completing a reset is not signing in.
      type: object
      required: [customer_id]
      additionalProperties: false
      properties:
        customer_id: {type: string, format: uuid}
    Accepted:
      description: >
        A deliberately contentless acknowledgement. It says nothing about whether
        anything was enqueued, because saying so is the disclosure the operation
        exists to avoid.
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status: {type: string}
    OrderClaim:
      type: object
      additionalProperties: false
      required: [guest_order_ref]
      properties:
        guest_order_ref: {type: string, format: uuid}
    OrderClaimResult:
      type: object
      additionalProperties: false
      required: [order_id, guest_order_ref, customer_id]
      description: >
        Returns the attribution itself rather than a word like "claimed". There is
        no order status called claimed — `orders.status` is a vocabulary ADR-016
        owns and this operation adds nothing to it — and a `status` field here
        would send the next reader looking for a state that does not exist. The
        customer id lets the caller confirm the outcome instead of trusting an
        adjective.
      properties:
        order_id: {type: string, format: uuid}
        guest_order_ref: {type: string, format: uuid}
        customer_id: {type: string, format: uuid}
    CustomerOrderPage:
      type: object
      additionalProperties: false
      required: [orders, next_cursor]
      properties:
        orders: {type: array, items: {$ref: '#/components/schemas/CustomerOrderSummary'}}
        next_cursor:
          type: string
          nullable: true
          description: >
            The cursor for the next page, or null when this page is the last.
            REQUIRED and nullable rather than optional: an absent field and an
            explicit null read the same to a careless client, and "there is no more"
            is a different fact from "we did not say".
    CustomerOrderSummary:
      type: object
      additionalProperties: false
      required: [order_id, guest_order_ref, purchased_at, quantity, total_amount, currency, event_name, starts_at]
      properties:
        order_id: {type: string, format: uuid}
        guest_order_ref:
          type: string
          format: uuid
          description: 'A bearer credential for the ticket bundle (ADR-012). Present so the wallet can LINK to the existing ticket page; never log it.'
        purchased_at: {type: string, format: date-time}
        quantity: {type: integer, minimum: 1}
        total_amount: {type: integer, description: 'Integer minor units (ADR-001). Never a float, never divided here.'}
        currency: {type: string, minLength: 3, maxLength: 3}
        event_name:
          type: string
          nullable: true
          description: >
            Resolved from catalog in one call per page. Null when catalog cannot
            name the performance — a row the buyer can still open beats a wallet
            that will not load.
        starts_at: {type: string, format: date-time, nullable: true}
    CustomerPrincipal:
      description: >
        A signed-in buyer. `email` is the address in the spelling the buyer
        registered with, for display; every lookup goes through the normalized
        form, which is never exposed.
      type: object
      required: [customer_id, email, customer_assertion]
      additionalProperties: false
      properties:
        customer_id: {type: string, format: uuid}
        email: {type: string}
        customer_assertion:
          type: string
          description: >
            A commerce-signed, expiring proof that the holder authenticated as
            this customer, presented on checkout in `X-Customer-Assertion`
            (TKT-221, ADR-049).

            This is a BEARER CREDENTIAL: anyone holding it can attribute a
            checkout to this customer until it expires. It is returned only to a
            caller who has just proven the password, and the storefront keeps it
            server-side inside its in-process session — never in a cookie, a
            rendered prop, or a log. Its lifetime is deliberately equal to that
            session's, so "the session is alive" and "the assertion is valid"
            cannot disagree and strand a buyer at the payment button.
    Checkout:
      type: object
      additionalProperties: false
      required: [reservation_id, name, email, payment_token]
      properties:
        reservation_id: {type: string, format: uuid}
        name: {type: string, minLength: 1}
        email: {type: string, minLength: 3}
        payment_token: {type: string, minLength: 1}
    OrderResult:
      type: object
      additionalProperties: false
      required: [order_id, guest_order_ref, status]
      properties:
        order_id: {type: string, format: uuid}
        guest_order_ref: {type: string, format: uuid}
        status: {type: string, enum: [completed]}
    OrderPending:
      type: object
      additionalProperties: false
      required: [order_id, status]
      properties:
        order_id: {type: string, format: uuid}
        status: {type: string}
    OrderFailure:
      type: object
      additionalProperties: true
      required: [order_id, status]
      properties:
        order_id: {type: string, format: uuid}
        status: {type: string}
        replay: {type: boolean}
    OrderConflict:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: {type: string}
        order_id: {type: string, format: uuid}
        status: {type: string}
    OrderState:
      type: object
      additionalProperties: false
      required: [order_id, status]
      properties:
        order_id: {type: string, format: uuid}
        status: {type: string}
      description: >
        The public order read. It answers for ANY order id and carries no
        credential, so it says as little as an order can say.

        customer_id was here until the security review (ai-review S3, TKT-221
        added it). It carried the account an order belongs to — and because
        order ids are DERIVED (uuid.NewSHA1 over organizer + idempotency key),
        anyone who watched a buyer's own checkout can recompute the id and read
        the field back, which makes it an account-existence oracle over a value
        the caller already had. It was informational and nothing consumed it, so
        it is gone rather than caveated. TKT-222 still owns the real fix for the
        rest of this endpoint: an authenticated, ownership-scoped read that 404s
        on mismatch, the way listCustomerOrders already does.
    VoidCreate:
      type: object
      # additionalProperties: false is load-bearing here, not boilerplate. It is what
      # makes a quantity, amount, unit_amount or currency on this request a 400 from
      # the validator rather than a field the handler has to remember to ignore
      # (TKT-171). The quantity is whole-order and comes from the reservation under
      # the order row lock; a client that cannot state one cannot forge one.
      additionalProperties: false
      required: [organizer_id, actor, reason]
      properties:
        organizer_id: {type: string, format: uuid}
        # Staff attribution, as on RefundCreate: an operation that stops a ticket
        # admitting cannot be less attributable than one that moves money.
        actor: {type: string, minLength: 1, maxLength: 200}
        reason: {type: string, minLength: 1, maxLength: 500}
    OrderVoid:
      type: object
      additionalProperties: false
      # No amount, no currency, no refund_status, no payment fact — a void moves
      # tickets and capacity and never money, and there is deliberately nowhere here
      # to report otherwise.
      required: [void_id, order_id, quantity, tickets_voided, capacity_returned, replay]
      properties:
        void_id: {type: string, format: uuid}
        order_id: {type: string, format: uuid}
        quantity: {type: integer, minimum: 1}
        # Reported independently, and honestly: a void whose tickets are void but
        # whose seat has not come back is a real state that a replay retries.
        tickets_voided: {type: boolean}
        capacity_returned: {type: boolean}
        replay: {type: boolean}
    RefundCreate:
      type: object
      additionalProperties: false
      required: [organizer_id, quantity, actor, reason]
      properties:
        organizer_id: {type: string, format: uuid}
        quantity: {type: integer, minimum: 1, maximum: 50}
        # Staff attribution, mirroring OperationalConversionCreate: an operation that
        # moves money cannot be less attributable than one that moves a seat.
        actor: {type: string, minLength: 1, maxLength: 200}
        reason: {type: string, minLength: 1, maxLength: 500}
    Refund:
      type: object
      additionalProperties: false
      required: [refund_id, order_id, quantity, amount, currency, refund_status, refunded_quantity, refunded_amount, replay, tickets_voided, capacity_returned]
      properties:
        refund_id: {type: string, format: uuid}
        order_id: {type: string, format: uuid}
        quantity: {type: integer}
        amount: {type: integer, format: int64}
        currency: {type: string}
        refund_status: {type: string, enum: [none, partial, full]}
        refunded_quantity: {type: integer}
        refunded_amount: {type: integer, format: int64}
        replay: {type: boolean}
        # False means the tickets are still valid at the gate — the money moved but
        # the reversal is outstanding. Required, not optional: a caller that cannot
        # tell "voided" from "we did not get to it" will assume the first (TKT-157).
        tickets_voided: {type: boolean}
        # False means the seat is still counted as sold. Required for the same reason as
        # tickets_voided: a caller that cannot tell "returned" from "we did not get to it"
        # will assume the first. A partial refund of a SEATED order stays false forever —
        # no subset of seats can be identified (TKT-164).
        capacity_returned: {type: boolean}
    OrderUnclaim:
      type: object
      additionalProperties: false
      # actor and reason bounded exactly as the exchange's are (TKT-158): the same
      # operator-supplied audit fields, so the same limits.
      required: [actor, reason]
      properties:
        actor: {type: string, minLength: 1, maxLength: 200}
        reason: {type: string, minLength: 1, maxLength: 500}
    OrderUnclaimed:
      type: object
      additionalProperties: false
      # The account the order was detached FROM. Returned so an operator who
      # detached the wrong order can tell support who to hand it back to — the
      # value is gone from `orders` the moment this succeeds.
      required: [order_id, detached_customer_id]
      properties:
        order_id: {type: string, format: uuid}
        detached_customer_id: {type: string, format: uuid}
    ExchangeCreate:
      type: object
      additionalProperties: false
      required: [organizer_id, target_ticket_type_id, actor, reason]
      properties:
        organizer_id: {type: string, format: uuid}
        target_ticket_type_id: {type: string, format: uuid}
        actor: {type: string, minLength: 1, maxLength: 200}
        reason: {type: string, minLength: 1, maxLength: 500}
    Exchange:
      type: object
      additionalProperties: false
      required: [exchange_id, source_order_id, replacement_order_id, quantity, source_total, target_total, delta_amount, currency, status, tickets_exchanged, capacity_returned, replay]
      properties:
        exchange_id: {type: string, format: uuid}
        source_order_id: {type: string, format: uuid}
        replacement_order_id: {type: string, format: uuid}
        quantity: {type: integer}
        source_total: {type: integer, format: int64}
        target_total: {type: integer, format: int64}
        # SIGNED: positive is an upgrade the buyer paid, negative a downgrade refunded to
        # them, zero settles nothing. Exactly one provider movement, or none.
        delta_amount: {type: integer, format: int64}
        currency: {type: string}
        # switch_pending means the money is settled and the buyer still holds valid OLD
        # tickets. It is a real, safe, durable state — not an error (TKT-166 closes it).
        # capacity_pending is switched-but-under-selling: the old tickets have stopped
        # admitting and the old capacity has not come back yet. It is a real, retryable
        # substate, and reporting it as `completed` hid an under-selling exchange (TKT-166).
        status: {type: string, enum: [switch_pending, capacity_pending, completed]}
        tickets_exchanged: {type: boolean}
        capacity_returned: {type: boolean}
        replay: {type: boolean}
    ExchangePending:
      type: object
      additionalProperties: false
      required: [exchange_id, status]
      properties:
        exchange_id: {type: string, format: uuid}
        # One value, deliberately: this schema answers exactly one situation, and an
        # open string would let a future branch answer 202 with a state nobody
        # declared — which is the drift the response validator exists to catch.
        status: {type: string, enum: [confirmation_pending]}
    ExchangeSwitched:
      type: object
      additionalProperties: false
      required: [organizer_id]
      properties: {organizer_id: {type: string, format: uuid}}
    ExchangeSwitchResult:
      type: object
      additionalProperties: false
      required: [exchange_id, tickets_exchanged, capacity_returned]
      properties:
        exchange_id: {type: string, format: uuid}
        tickets_exchanged: {type: boolean}
        # False only if the capacity return did not land — which is a retryable substate,
        # not a failure of the switch. The switch is committed either way, and it is the
        # half that had to happen first.
        capacity_returned: {type: boolean}
    DeliveryEmail:
      type: object
      additionalProperties: false
      required: [email]
      properties: {email: {type: string}}
    CancellationRefundCreate:
      type: object
      additionalProperties: false
      required: [organizer_id, actor, reason]
      properties:
        organizer_id: {type: string, format: uuid}
        # The OPERATOR's attribution, recorded on the run. It is deliberately NOT the
        # attribution the individual refunds bind under: those use fixed constants so a
        # second run replays the first attempt instead of colliding on the request
        # fingerprint, which covers actor and reason (ADR-040 §3).
        actor: {type: string, minLength: 1, maxLength: 200}
        reason: {type: string, minLength: 1, maxLength: 500}
    CancellationRefundRun:
      type: object
      additionalProperties: false
      required: [run_id, organizer_id, slot_id, status, cutoff_at, created_at, replay]
      properties:
        run_id: {type: string, format: uuid}
        organizer_id: {type: string, format: uuid}
        slot_id: {type: string, format: uuid}
        status: {type: string, enum: [pending, running, completed]}
        # The book is the set of orders completed at or before this instant. Recorded in
        # the same transaction as the run row, so it is durable before any work starts.
        cutoff_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
        completed_at: {type: string, format: date-time}
        replay: {type: boolean}
    CancellationRefundCounts:
      type: object
      additionalProperties: false
      required: [total, refunded, already_refunded, failed, pending]
      properties:
        total: {type: integer}
        refunded: {type: integer}
        already_refunded: {type: integer}
        failed: {type: integer}
        # Rows with no terminal outcome yet. Zero on a completed run, by construction —
        # a run completes only once every row is terminal.
        pending: {type: integer}
    CancellationRefundOutcome:
      type: object
      additionalProperties: false
      required: [order_id, outcome, refunded_quantity, refunded_amount, currency, money_refunded, tickets_voided, capacity_returned]
      properties:
        order_id: {type: string, format: uuid}
        # `refunded` and `already_refunded` BOTH mean every obligation is discharged —
        # money returned, tickets voided, capacity back. An order whose money came back
        # but whose reversal is outstanding is `failed`, with the booleans below telling
        # the truth about which half is missing. Rounding it up to `refunded` is exactly
        # what ADR-039 exists to prevent.
        outcome: {type: string, enum: [refunded, already_refunded, failed]}
        refund_id: {type: string, format: uuid}
        # A SNAPSHOT at outcome time, not a live projection: the report has to stay
        # readable after a later refund of the same order moves the order's own numbers.
        refunded_quantity: {type: integer}
        refunded_amount: {type: integer, format: int64}
        currency: {type: string}
        money_refunded: {type: boolean}
        tickets_voided: {type: boolean}
        capacity_returned: {type: boolean}
        failure: {$ref: '#/components/schemas/CancellationRefundFailure'}
    CancellationRefundFailure:
      type: object
      additionalProperties: false
      required: [code, reason]
      properties:
        # A bounded vocabulary, never a raw downstream body: `no_captured_money` is a
        # zero-price (comped) order, which has no money leg to refund and therefore gets
        # no reversal at all — a real gap, made visible here rather than silently skipped.
        # Must list EVERY code the ledger can store: an undeclared one fails the response
        # validator and turns a perfectly readable report into a 500 (ADR-028).
        # `ceiling_moved` = a staff refund moved the order's ceiling under the run.
        code: {type: string, enum: [no_captured_money, not_refundable, refund_refused, ceiling_moved, reversal_outstanding, unavailable, internal]}
        reason: {type: string, maxLength: 500}
    CancellationRefundReport:
      type: object
      additionalProperties: false
      required: [run, counts, incomplete_at_enumeration, orders]
      properties:
        run: {$ref: '#/components/schemas/CancellationRefundRun'}
        counts: {$ref: '#/components/schemas/CancellationRefundCounts'}
        # Orders on the slot that were NOT completed when their page was enumerated, so this
        # run could not refund them. Named for enumeration, not the cutoff: the cutoff bounds
        # the RESERVATION set, while completion is necessarily sampled when the page is read.
        # Non-zero means a later run may owe somebody money — one COUNT is what keeps a
        # silent under-refund from being invisible (ADR-040 §2).
        incomplete_at_enumeration: {type: integer}
        # Empty until the run completes — see the 202 on the operation.
        orders: {type: array, items: {$ref: '#/components/schemas/CancellationRefundOutcome'}}
        next_after_order_id: {type: string, format: uuid}
