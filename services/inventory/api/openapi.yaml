openapi: 3.0.3
info: {title: Inventory API, version: 1.0.0}
paths:
  /holds:
    post:
      operationId: createHold
      summary: Atomically hold dated-slot capacity
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/HoldCreate'}}}}
      responses:
        '200': {$ref: '#/components/responses/Hold'}
        '201': {$ref: '#/components/responses/Hold'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /holds/seats:
    post:
      operationId: createSeatHold
      summary: Atomically hold a specific set of seats on a seated slot (TKT-80)
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SeatHoldCreate'}}}}
      responses:
        '200': {$ref: '#/components/responses/SeatHold'}
        '201': {$ref: '#/components/responses/SeatHold'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /slots/{id}/availability:
    get:
      operationId: getAvailability
      parameters:
        - {$ref: '#/components/parameters/Id'}
        - {$ref: '#/components/parameters/OrganizerId'}
        - {name: channel, in: query, required: false, schema: {type: string, minLength: 1, maxLength: 100}, description: 'Scope `available` to this sales channel; omitted means the default/public channel'}
      responses:
        '200':
          description: Availability
          headers:
            Cache-Control: {$ref: '#/components/headers/AvailabilityCacheControl'}
            Age: {$ref: '#/components/headers/AvailabilityAge'}
          content: {application/json: {schema: {$ref: '#/components/schemas/Availability'}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /slots/{id}/seat-occupancy:
    get:
      operationId: getSeatOccupancy
      summary: Which seats a seated slot cannot currently sell (TKT-172)
      description: >
        The seat identities a buyer cannot claim on this slot right now — the read a
        seat picker renders occupancy from (TKT-35). Liveness is the claim path's own
        notion, not raw claim status: a seat counts as unavailable while it is held
        (and unexpired), finalizing, or confirmed, and stops counting once its
        claim_seats row is released. Both halves of that conjunction are load-bearing
        — status alone strands a fully refunded seat (the claim stays `confirmed`),
        and the released flag alone reports a due-but-unswept hold as occupied
        (expiry is swept lazily, ADR-031). Seconds tier, like the availability read
        it sits beside: a stale "free" is resolved by the atomic claim, a stale
        "taken" must decay fast. Seated slots only — a GA slot is a 409.
      parameters:
        - {$ref: '#/components/parameters/Id'}
        - {$ref: '#/components/parameters/OrganizerId'}
      responses:
        '200':
          description: Seat occupancy
          headers:
            Cache-Control: {$ref: '#/components/headers/SeatOccupancyCacheControl'}
          content: {application/json: {schema: {$ref: '#/components/schemas/SeatOccupancy'}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  # The hold transitions are service-to-service only: commerce drives them, never a
  # public caller. They sit under /internal/ so the gateway refuses them at the edge by
  # the same explicit prefix registration that covers every other internal route, rather
  # than by matching path suffixes (TKT-124).
  /internal/holds/{id}/confirm:
    post:
      operationId: confirmHold
      parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/OrganizerId'}]
      responses: {'200': {$ref: '#/components/responses/Hold'}, '400': {$ref: '#/components/responses/Error'}, '401': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}, '500': {$ref: '#/components/responses/Error'}}
  /internal/holds/{id}/finalize:
    post:
      operationId: finalizeHold
      parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/OrganizerId'}]
      responses: {'200': {$ref: '#/components/responses/Hold'}, '400': {$ref: '#/components/responses/Error'}, '401': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}, '500': {$ref: '#/components/responses/Error'}}
  /internal/holds/{id}/release:
    post:
      operationId: releaseHold
      parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/OrganizerId'}]
      responses: {'200': {$ref: '#/components/responses/Hold'}, '400': {$ref: '#/components/responses/Error'}, '401': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}, '500': {$ref: '#/components/responses/Error'}}
  /internal/holds/{id}/seating:
    get:
      operationId: getHoldSeating
      summary: Whether a claim holds seats (internal)
      # TKT-158. Commerce cannot infer seatedness; inventory owns it. This exists so an
      # exchange can refuse a seated line BEFORE any money moves — an exchange has no
      # safe partial state, unlike a refund (ADR-038 §9 vs ADR-039).
      parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/OrganizerId'}]
      responses:
        '200': {description: Seating, content: {application/json: {schema: {$ref: '#/components/schemas/HoldSeating'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /internal/holds/{id}/refund-capacity:
    post:
      operationId: returnRefundedCapacity
      summary: Return a refunded quantity of a confirmed claim's capacity to the pool (internal)
      # TKT-161 / ADR-038. The second obligation of a refund's reversal, after the tickets
      # are voided — that order is a safety property: freeing capacity while the original
      # ticket still admits is the one ordering that can oversell.
      #
      # 409 `partial seated` is not a transient failure: nothing associates an issued
      # ticket with a seat identity, so a partial return of a seated claim cannot say
      # which seats to free (TKT-164). The refund itself still completes.
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RefundCapacityReturnCreate'}}}}
      responses:
        '200': {description: Capacity returned (or replay), content: {application/json: {schema: {$ref: '#/components/schemas/RefundCapacityReturn'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /internal/operational-holds:
    post:
      operationId: placeOperationalHold
      summary: Place a named operational hold (house/artist/kill) outside public sale
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/OperationalHoldCreate'}}}}
      responses:
        '200': {$ref: '#/components/responses/OperationalHold'}
        '201': {$ref: '#/components/responses/OperationalHold'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /internal/operational-holds/{id}/release:
    post:
      operationId: releaseOperationalHold
      parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/OperationalRelease'}}}}
      responses:
        '200': {$ref: '#/components/responses/OperationalHold'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /internal/operational-holds/{id}/convert:
    post:
      operationId: convertOperationalHold
      summary: Atomically carve quantity out of an operational hold into a buyer hold
      parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/OperationalConvert'}}}}
      responses:
        '200': {description: Replayed conversion, content: {application/json: {schema: {$ref: '#/components/schemas/ConvertResult'}}}}
        '201': {description: Converted, content: {application/json: {schema: {$ref: '#/components/schemas/ConvertResult'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /internal/operational-holds/{id}/history:
    get:
      operationId: getOperationalHoldHistory
      parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/OrganizerId'}]
      responses:
        '200': {description: Claim history, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/HistoryEntry'}}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /internal/group-reservations:
    post:
      operationId: placeGroupReservation
      summary: Place a long-lived group/agency reservation with an explicit expiry (not the cart TTL)
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/GroupReservationCreate'}}}}
      responses:
        '200': {description: Replayed reservation, content: {application/json: {schema: {$ref: '#/components/schemas/GroupReservation'}}}}
        '201': {description: Reservation placed, content: {application/json: {schema: {$ref: '#/components/schemas/GroupReservation'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /internal/group-reservations/{id}/draw-down:
    post:
      operationId: drawDownGroupReservation
      summary: Atomically carve quantity out of a group reservation into a buyer hold (repeatable partial draw-down)
      parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/OperationalConvert'}}}}
      responses:
        '200': {description: Replayed draw-down, content: {application/json: {schema: {$ref: '#/components/schemas/ConvertResult'}}}}
        '201': {description: Drawn down, content: {application/json: {schema: {$ref: '#/components/schemas/ConvertResult'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /internal/group-reservations/{id}/history:
    get:
      operationId: getGroupReservationHistory
      parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/OrganizerId'}]
      responses:
        '200': {description: Claim history, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/HistoryEntry'}}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /internal/slots/{id}/channel-allocations:
    put:
      operationId: replaceChannelAllocations
      summary: Atomically replace a pool's channel allocation set (caps + scheduled release)
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ChannelAllocationSet'}}}}
      responses:
        '200': {description: Committed allocation set, content: {application/json: {schema: {$ref: '#/components/schemas/ChannelAllocations'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /internal/cache-control:
    get:
      operationId: getCacheControl
      summary: Whether this process is serving availability reads from memory, and how many entries it holds (TKT-210)
      responses:
        '200': {description: Current cache state, headers: {Cache-Control: {$ref: '#/components/headers/NeverCacheControl'}}, content: {application/json: {schema: {$ref: '#/components/schemas/CacheControlStatus'}}}}
        '401': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
    put:
      operationId: putCacheControl
      summary: >
        The ADR-004 incident kill-switch. Disabling purges the cache and sends
        every availability read to the store until re-enabled; re-enabling starts
        cold. Idempotent. PROCESS-LOCAL - it says nothing about another replica -
        and NOT durable: a restart comes back enabled.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CacheControlUpdate'}}}}
      responses:
        '200': {description: Resulting cache state, headers: {Cache-Control: {$ref: '#/components/headers/NeverCacheControl'}}, content: {application/json: {schema: {$ref: '#/components/schemas/CacheControlStatus'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /internal/slots/{id}/capacity-adjustments:
    post:
      operationId: adjustCapacity
      summary: Staff capacity adjustment (TKT-76) — raises apply freely; a cut below demand clamps to the invariant floor and blocks new claims until demand drains to the target
      parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CapacityAdjust'}}}}
      responses:
        '200': {description: Replayed adjustment, content: {application/json: {schema: {$ref: '#/components/schemas/CapacityAdjustment'}}}}
        '201': {description: Adjustment applied (or clamped), content: {application/json: {schema: {$ref: '#/components/schemas/CapacityAdjustment'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
    get:
      operationId: getCapacityAdjustments
      summary: Pool capacity-adjustment audit trail (who/when/from→to)
      parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/OrganizerId'}]
      responses:
        '200': {description: Adjustment history, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/HistoryEntry'}}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /internal/slots/{id}/availability:
    get:
      operationId: getStaffAvailability
      parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/OrganizerId'}]
      responses:
        '200': {description: Staff availability breakdown, content: {application/json: {schema: {$ref: '#/components/schemas/StaffAvailability'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
components:
  headers:
    NeverCacheControl:
      description: >
        Always no-store — ADR-004's never tier. An operator control surface is
        never shared-cacheable: it reports the live state of one process, and a
        cached answer about whether a cache is on is exactly the wrong thing to
        hand an operator mid-incident. Single-valued and required so ADR-028's
        response validator turns any other value into a 500.
      required: true
      schema:
        type: string
        enum:
          - 'no-store'
    AvailabilityAge:
      description: >
        Seconds this answer has already spent in inventory's in-memory
        availability cache (TKT-205, ADR-044), rounded up. Required, and 0 on a
        cache miss.

        It exists so the two staleness budgets cannot stack. Cache-Control
        declares this response publicly cacheable for five seconds; without Age,
        an entry already four seconds old inside the service would grant a
        conformant client another full five, so a buyer could observe ten
        seconds of staleness against a tier that promises five. Age is the RFC
        9111 mechanism for exactly that, and it is the only one available here:
        varying Cache-Control by remaining freshness is what the storefront
        middleware does for pages, but AvailabilityCacheControl is a required
        single-valued enum, so ADR-028's validator turns a second value into a
        500.

        Bounded by the tier itself: an entry older than max-age is not served.
      required: true
      schema:
        type: integer
        minimum: 0
        maximum: 5
    AvailabilityCacheControl:
      description: >
        ADR-004 rule 1's seconds tier for the public availability read, declared
        rather than merely emitted (TKT-110, closing the gap that ADR's TKT-128
        amendment recorded). This is the tier where staleness is most load-bearing
        during an on-sale, so a future cache owner has to be able to find it in the
        contract. The single-value enum is deliberate and is enforced at runtime,
        not only by the gate: ADR-028's response validator fails closed, so the
        handler constant (CacheControlPublicAvailability) and this declaration can
        only move together. Required, so a handler that stops emitting the header
        fails the contract instead of silently degrading it to a comment.
      required: true
      schema:
        type: string
        enum: ['public, max-age=5, s-maxage=5']
    SeatOccupancyCacheControl:
      description: >
        The same ADR-004 seconds tier as AvailabilityCacheControl, declared
        separately on purpose (TKT-172). ADR-028's validator fails closed per
        declaration, so one shared header component would couple two operations'
        drift detection: a handler that stopped emitting the tier on one of them
        could be masked by the other still emitting it. Its handler constant is
        CacheControlPublicSeatOccupancy; the two can only move together.
      required: true
      schema:
        type: string
        enum: ['public, max-age=5, s-maxage=5']
  parameters:
    Id: {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    OrganizerId: {name: organizer_id, in: query, required: true, schema: {type: string, format: uuid}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 200}}
  responses:
    Hold: {description: Hold state, content: {application/json: {schema: {$ref: '#/components/schemas/Hold'}}}}
    SeatHold: {description: Seat hold state, content: {application/json: {schema: {$ref: '#/components/schemas/SeatHold'}}}}
    OperationalHold: {description: Operational hold state, content: {application/json: {schema: {$ref: '#/components/schemas/OperationalHold'}}}}
    Error: {description: Error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  schemas:
    CacheControlUpdate:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled: {type: boolean, description: 'false disables the in-memory availability cache on THIS process'}
    CacheControlStatus:
      type: object
      additionalProperties: false
      required: [enabled, entries]
      properties:
        enabled: {type: boolean, description: 'the state the read path itself consults, not a separate flag'}
        entries: {type: integer, minimum: 0, description: 'cached entries held right now. CARDINALITY, not bytes - ADR-044 is explicit that a bounded entry count does not bound memory'}
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: {type: string}
        code: {type: string, enum: [slot_archived, slot_closed, channel_window_closed, presale_code_invalid, seat_taken, seat_unavailable, pin_unavailable, orphaned_seats], description: 'Machine-readable conflict reason; present when a dead slot, a channel outside its sales window, a missing or unusable presale code, an already-held seat, an unmapped seat, or a transient pin failure rejected the request. `channel_window_closed` is distinct from a code-less capacity refusal on purpose (TKT-238): the caller should wait for the window rather than treat the channel as sold out. `presale_code_invalid` (TKT-239) is DELIBERATELY UNIFORM across five causes — absent, unknown, wrong-channel, exhausted and out-of-window codes are indistinguishable, because a distinguishing refusal is an enumeration oracle on presale codes. Prompt for a code; do not report a sellout.'}
        seat_identities:
          type: array
          description: >
            With `seat_taken`: the requested seats another live claim already
            holds, sorted (TKT-173). With `orphaned_seats`: the FREE seats this
            selection would strand with no free neighbour in their row (ADR-041,
            TKT-182) — seats the buyer did NOT request, so a caller must not
            assume these are a subset of what it asked for. Seats the request could have had
            are NOT listed — a caller re-renders exactly what it must give up.
            Knowable only inside the claim transaction that arbitrated: an answer
            computed afterwards, by re-reading occupancy say, describes a different
            moment and can name seats this request never lost.
          items: {type: string, minLength: 1, maxLength: 200}
    HoldSeating:
      type: object
      additionalProperties: false
      required: [hold_id, seated]
      properties:
        hold_id: {type: string, format: uuid}
        seated: {type: boolean}
    RefundCapacityReturnCreate:
      type: object
      additionalProperties: false
      required: [organizer_id, refund_id, quantity]
      properties:
        organizer_id: {type: string, format: uuid}
        # The commerce refund's identity. It is the idempotency key in claim_history, so a
        # replay is a read of the receipt rather than a second decrement.
        refund_id: {type: string, format: uuid}
        quantity: {type: integer, minimum: 1, maximum: 50}
    RefundCapacityReturn:
      type: object
      additionalProperties: false
      required: [hold_id, quantity, unreturned_quantity, replay]
      properties:
        hold_id: {type: string, format: uuid}
        quantity: {type: integer}
        unreturned_quantity: {type: integer}
        replay: {type: boolean}
    HoldCreate:
      type: object
      additionalProperties: false
      required: [organizer_id, slot_id, quantity]
      properties:
        organizer_id: {type: string, format: uuid}
        slot_id: {type: string, format: uuid}
        quantity: {type: integer, minimum: 1, maximum: 50}
        ticket_type_id: {type: string, format: uuid}
        unit_amount: {type: integer, format: int64, minimum: 0}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        channel: {type: string, minLength: 1, maxLength: 100, description: 'Opaque sales channel code; omitted means the default/public channel'}
        presale_code:
          type: string
          minLength: 1
          maxLength: 100
          description: >
            Presale unlock code for a gated channel (TKT-239). EXACT and
            case-sensitive like the channel code — nothing trims or folds it.
            Required only when the channel's allocation sets requires_code;
            ignored (and not recorded) otherwise. A missing or unusable code is
            refused with the uniform `presale_code_invalid`.
        reseller_id:
          type: string
          format: uuid
          description: >
            WHO is selling (TKT-246, amending ADR-024). Compared against the
            allocation's `sold_by` under the pool row lock: an allocation with
            `sold_by` set admits only that reseller, and one without it (every
            allocation predating TKT-246) admits anyone.


            This must be an AUTHENTICATED identity. Commerce takes it from the
            partner credential (ADR-056) and never from a request body; inventory
            trusts its internal caller and cannot verify it itself. Per ADR-021 that
            makes this honest-writer authorization, NOT tamper-evidence — anyone who
            can call `/internal/` or write inventory's database can present any
            reseller they like.


            Omitted means no seller identity was proven, which is what every
            pre-TKT-246 caller sends. It is not a wildcard: an absent identity may
            consume only an unbound allocation.
    Hold:
      type: object
      additionalProperties: false
      required: [hold_id, organizer_id, slot_id, quantity, status, expires_at, server_time]
      properties:
        hold_id: {type: string, format: uuid}
        organizer_id: {type: string, format: uuid}
        slot_id: {type: string, format: uuid}
        quantity: {type: integer}
        ticket_type_id: {type: string, format: uuid}
        unit_amount: {type: integer, format: int64}
        currency: {type: string}
        status: {type: string}
        channel: {type: string}
        expires_at: {type: string, format: date-time}
        server_time: {type: string, format: date-time}
    SeatHoldCreate:
      type: object
      additionalProperties: false
      required: [organizer_id, slot_id, seat_identities, ticket_type_id, unit_amount, currency]
      properties:
        organizer_id: {type: string, format: uuid}
        slot_id: {type: string, format: uuid}
        seat_identities:
          type: array
          minItems: 1
          maxItems: 50
          items: {type: string, minLength: 1, maxLength: 200, description: 'Stable seat identity "section/row/seat"'}
        ticket_type_id: {type: string, format: uuid}
        unit_amount: {type: integer, format: int64, minimum: 0}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
    SeatHold:
      type: object
      additionalProperties: false
      required: [hold_id, organizer_id, slot_id, quantity, status, expires_at, server_time, seats]
      properties:
        hold_id: {type: string, format: uuid}
        organizer_id: {type: string, format: uuid}
        slot_id: {type: string, format: uuid}
        quantity: {type: integer}
        ticket_type_id: {type: string, format: uuid}
        unit_amount: {type: integer, format: int64}
        currency: {type: string}
        status: {type: string}
        channel: {type: string}
        expires_at: {type: string, format: date-time}
        server_time: {type: string, format: date-time}
        seats:
          type: array
          items: {type: string}
    Availability:
      type: object
      additionalProperties: false
      required: [slot_id, capacity, held, confirmed, available, offering_status]
      properties:
        slot_id: {type: string, format: uuid}
        capacity: {type: integer}
        held: {type: integer}
        confirmed: {type: integer}
        available: {type: integer}
        offering_status: {type: string, enum: [open, closed, archived], description: 'Catalog offer state mirrored by inventory (TKT-75): counters stay factual, but available is 0 unless open'}
    SeatOccupancy:
      type: object
      additionalProperties: false
      required: [slot_id, seat_map_id, offering_status, remaining_capacity, unavailable_seat_identities]
      properties:
        slot_id: {type: string, format: uuid}
        seat_map_id: {type: string, format: uuid, description: 'The published seat-map version this slot is seated against, as inventory holds it. Catalog publishes its own view on the performance; the two agreeing is what makes projection skew detectable rather than hidden.'}
        offering_status: {type: string, enum: [open, closed, archived], description: 'Catalog offer state mirrored by inventory (TKT-75). The seat list stays factual whatever this says — it is how a caller tells "these seats are free" from "nothing on this slot is claimable at all"'}
        remaining_capacity: {type: integer, minimum: 0, description: 'The pool''s remaining aggregate headroom under exactly the test the seated claim path applies (target_capacity when a cut is pending, else capacity, minus confirmed and live held), and 0 on a slot that is not open. A CEILING, not a seat count — inventory does not hold the seat universe, that is the seat map in catalog, and a seated pool is provisioned from the venue''s GA snapshot. So it reads high when a small map sits in a large venue, and 0 when a capacity cut has drained a pool whose seats are free. Deliberately NOT the availability read''s `available`, which additionally subtracts unsold channel reservations that the seated claim path never consults. A picker must gate on BOTH this and unavailable_seat_identities; neither is sufficient alone.'}
        unavailable_seat_identities:
          type: array
          description: 'Sorted, and [] rather than null on an empty seated pool — which is a different answer from 404 on an unknown slot'
          items: {type: string, minLength: 1, maxLength: 200}
    OperationalHoldCreate:
      type: object
      additionalProperties: false
      required: [organizer_id, slot_id, quantity, purpose, label, actor, reason]
      properties:
        organizer_id: {type: string, format: uuid}
        slot_id: {type: string, format: uuid}
        quantity: {type: integer, minimum: 1, maximum: 10000}
        purpose: {type: string, enum: [house, artist, kill, other]}
        label: {type: string, minLength: 1, maxLength: 200}
        actor: {type: string, minLength: 1, maxLength: 200}
        reason: {type: string, minLength: 1, maxLength: 500}
    OperationalRelease:
      type: object
      additionalProperties: false
      required: [organizer_id, quantity, actor, reason]
      properties:
        organizer_id: {type: string, format: uuid}
        quantity: {type: integer, minimum: 1, maximum: 10000}
        actor: {type: string, minLength: 1, maxLength: 200}
        reason: {type: string, minLength: 1, maxLength: 500}
    OperationalConvert:
      type: object
      additionalProperties: false
      required: [organizer_id, slot_id, quantity, ticket_type_id, unit_amount, currency, actor, reason]
      properties:
        organizer_id: {type: string, format: uuid}
        slot_id: {type: string, format: uuid, description: 'The slot the caller priced against; verified against the hold''s pool before any write'}
        quantity: {type: integer, minimum: 1, maximum: 50}
        ticket_type_id: {type: string, format: uuid}
        unit_amount: {type: integer, format: int64, minimum: 0}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        actor: {type: string, minLength: 1, maxLength: 200}
        reason: {type: string, minLength: 1, maxLength: 500}
    OperationalHold:
      type: object
      additionalProperties: false
      required: [hold_id, organizer_id, slot_id, quantity, status, server_time]
      properties:
        hold_id: {type: string, format: uuid}
        organizer_id: {type: string, format: uuid}
        slot_id: {type: string, format: uuid}
        quantity: {type: integer}
        purpose: {type: string}
        label: {type: string}
        status: {type: string}
        server_time: {type: string, format: date-time}
    ConvertResult:
      type: object
      additionalProperties: false
      required: [hold, source_id, source_remaining, source_status]
      properties:
        hold: {$ref: '#/components/schemas/Hold'}
        source_id: {type: string, format: uuid}
        source_remaining: {type: integer}
        source_status: {type: string}
    GroupReservationCreate:
      type: object
      additionalProperties: false
      required: [organizer_id, slot_id, quantity, counterparty, expires_at, actor, reason]
      properties:
        organizer_id: {type: string, format: uuid}
        slot_id: {type: string, format: uuid}
        quantity: {type: integer, minimum: 1, maximum: 10000}
        counterparty: {type: string, minLength: 1, maxLength: 200}
        expires_at: {type: string, format: date-time, description: 'Explicit reservation expiry — must be in the future by DB time; never derived from the cart TTL'}
        channel: {type: string, minLength: 1, maxLength: 100, description: 'Optional sales channel; the reservation consumes that allocation and draw-down children inherit it'}
        presale_code:
          type: string
          minLength: 1
          maxLength: 100
          description: >
            Presale unlock code, when the channel is gated (TKT-239). Redeemed
            ONCE, by this placement; draw-down children deliberately do not cite
            it, so drawing down never consumes another redemption.
        actor: {type: string, minLength: 1, maxLength: 200}
        reason: {type: string, minLength: 1, maxLength: 500}
    GroupReservation:
      type: object
      additionalProperties: false
      required: [hold_id, organizer_id, slot_id, quantity, counterparty, status, expires_at, server_time]
      properties:
        hold_id: {type: string, format: uuid}
        organizer_id: {type: string, format: uuid}
        slot_id: {type: string, format: uuid}
        quantity: {type: integer}
        counterparty: {type: string}
        channel: {type: string}
        status: {type: string}
        expires_at: {type: string, format: date-time}
        server_time: {type: string, format: date-time}
    CapacityAdjust:
      type: object
      additionalProperties: false
      required: [organizer_id, capacity, actor, reason]
      properties:
        organizer_id: {type: string, format: uuid}
        capacity: {type: integer, minimum: 1, maximum: 1000000}
        actor: {type: string, minLength: 1, maxLength: 200}
        reason: {type: string, minLength: 1, maxLength: 500}
    CapacityAdjustment:
      type: object
      additionalProperties: false
      required: [slot_id, capacity_before, capacity, status, server_time]
      properties:
        slot_id: {type: string, format: uuid}
        capacity_before: {type: integer}
        capacity: {type: integer, description: 'Applied ceiling after the adjustment; equals live demand while a cut is clamped'}
        target_capacity: {type: integer, description: 'Requested target while a clamped cut drains; absent when the adjustment applied fully'}
        status: {type: string, enum: [applied, clamped]}
        server_time: {type: string, format: date-time}
    ChannelAllocation:
      type: object
      additionalProperties: false
      required: [channel, cap]
      properties:
        channel: {type: string, minLength: 1, maxLength: 100}
        cap: {type: integer, minimum: 1}
        release_at: {type: string, format: date-time, description: 'When the unsold allocation returns to the public channel; omitted means never'}
        opens_at:
          type: string
          format: date-time
          description: 'Start of the sales window, inclusive (TKT-238). Omit for always-open.'
        closes_at:
          type: string
          format: date-time
          description: 'End of the sales window, EXCLUSIVE. Omit for never-closes. A reversed window is refused by the schema constraint.'
        requires_code:
          type: boolean
          default: false
          description: >
            Gate this allocation behind a presale unlock code (TKT-239 /
            ADR-055). Defaults false, so an allocation that omits it sells
            exactly as before. Orthogonal to the window: a window says WHEN the
            channel may sell, this says WHO may, and both must admit a claim.
        sold_by:
          type: string
          format: uuid
          description: >
            Bind this allocation to ONE reseller (TKT-246, amending ADR-024). Only
            that reseller may consume it; omitted means unbound, which is public and
            is every allocation that predates this field.


            A uuid rather than a boolean, deliberately: "this allocation is spoken
            for" would let reseller B consume reseller A's stock — the same class of
            bug one layer in. Judged in inventory under the pool row lock, before
            capacity, so a bound allocation never reads as a sellout to the partner
            it belongs to.


            Honest-writer authorization, not tamper-evidence (ADR-021): it constrains
            a caller arriving through the hold path, and nobody with write access to
            this table.
    ChannelAllocationSet:
      type: object
      additionalProperties: false
      required: [organizer_id, allocations]
      properties:
        organizer_id: {type: string, format: uuid}
        allocations: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/ChannelAllocation'}}
    ChannelAllocations:
      type: object
      additionalProperties: false
      required: [slot_id, allocations]
      properties:
        slot_id: {type: string, format: uuid}
        allocations: {type: array, items: {$ref: '#/components/schemas/ChannelAllocation'}}
    ChannelAvailability:
      type: object
      additionalProperties: false
      required: [channel, cap, released, held, confirmed, available, window_open]
      properties:
        channel: {type: string}
        cap: {type: integer}
        release_at: {type: string, format: date-time}
        released: {type: boolean}
        opens_at:
          type: string
          format: date-time
          description: >
            Start of this channel's sales window (TKT-238), inclusive. Absent
            means always open. Half-open [opens_at, closes_at).
        closes_at:
          type: string
          format: date-time
          description: >
            End of this channel's sales window, EXCLUSIVE. Absent means never
            closes.
        window_open:
          type: boolean
          description: >
            Whether the window admits a claim right now. STAFF ONLY — the public
            availability read reports 0 for a closed channel and says nothing
            about why, because an operator needs to tell "not open yet" from
            "sold out" and a buyer does not.

            Separate from `released`: a released allocation is over, a closed
            window is not its turn yet, and only the second fixes itself.
        held: {type: integer}
        confirmed: {type: integer}
        available: {type: integer}
    StaffAvailability:
      type: object
      additionalProperties: false
      required: [slot_id, capacity, buyer_held, operational_held, reservation_held, confirmed, available, public_available, offering_status, channels]
      properties:
        slot_id: {type: string, format: uuid}
        capacity: {type: integer, description: 'Effective capacity: the clamp floor while a cut drains (TKT-76)'}
        target_capacity: {type: integer, description: 'Requested target while a clamped cut drains; absent otherwise'}
        buyer_held: {type: integer}
        operational_held: {type: integer}
        reservation_held: {type: integer, description: 'Live group/agency reservation quantity (TKT-79)'}
        confirmed: {type: integer}
        available: {type: integer}
        public_available: {type: integer}
        offering_status: {type: string, enum: [open, closed, archived], description: 'Catalog offer state mirrored by inventory (TKT-75): counters stay factual, but claimable availability is 0 unless open'}
        channels: {type: array, items: {$ref: '#/components/schemas/ChannelAvailability'}}
    HistoryEntry:
      type: object
      additionalProperties: false
      required: [action, actor, reason, quantity, quantity_after, status_after, occurred_at]
      properties:
        action: {type: string}
        actor: {type: string}
        reason: {type: string}
        quantity: {type: integer}
        quantity_after: {type: integer}
        status_after: {type: string}
        related_claim_id: {type: string, format: uuid}
        target_capacity: {type: integer, description: 'Capacity-adjustment records only (TKT-76): the requested target while a clamped cut drains'}
        occurred_at: {type: string, format: date-time}
