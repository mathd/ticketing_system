        s-maxage=300.
      parameters:
        - $ref: '#/components/parameters/FestivalId'
        - $ref: '#/components/parameters/Locale'
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '200':
          description: Published festival detail, localized
          headers:
            Cache-Control: { $ref: '#/components/headers/MinutesCacheControl' }
            Age: { $ref: '#/components/headers/PublicReadAge' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicFestivalDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /public/venues:
    get:
      operationId: listPublicVenues
      # Public read: opts out of the document-level staff-write requirement.
      security: []
      summary: Organizer-scoped venue list (hours tier)
      description: >
        The venues owned by an organizer, for the back-office venue list
        (US-018). Venue geometry is long-lived, so this read uses the ADR-004
        hours tier — Cache-Control: public, max-age=3600, s-maxage=3600 —
        distinct from the events minutes tier. Scoped explicitly by
        organizer_id (ADR-002); there is no session to infer it from.
      parameters:
        - $ref: '#/components/parameters/OrganizerId'
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '200':
          description: The organizer's venues
          headers:
            Cache-Control: { $ref: '#/components/headers/HoursCacheControl' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicVenueList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /public/venues/{venueId}/seat-maps:
    get:
      operationId: listVenueSeatMaps
      # Public read: opts out of the document-level staff-write requirement.
      security: []
      summary: A venue's seat-map summaries (status-driven cache tier)
      description: >
        The seat maps authored under a venue — summaries only, no geometry —
        for the back-office venue page (US-019). Cache tier follows the payload's
        statuses (TKT-107): the ADR-004 minutes tier (public, max-age=300,
        s-maxage=300) only when the list is non-empty and every map is published;
        no-store for a draft-bearing, mixed, or empty list. The minutes rather
        than hours tier because what this response caches is list MEMBERSHIP,
        which authoring a seat map changes — unlike a published version, which is
        immutable (TKT-141). Scoped to the venue,
        backed by seat_maps_by_venue (ADR-019).
      parameters:
        - $ref: '#/components/parameters/VenueId'
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '200':
          description: The venue's seat maps
          headers:
            Cache-Control: { $ref: '#/components/headers/SeatMapListCacheControl' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeatMapList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /public/seat-maps/{seatMapId}:
    get:
      operationId: getPublicSeatMapGeometry
      # Public read: opts out of the document-level staff-write requirement.
      security: []
      summary: A seat map's full geometry (status-driven cache tier)
      description: >
        The full nested geometry (sections -> rows -> seats, each ordered by
        position) of one seat map, for the back-office authoring page (US-019).
        Cache tier follows the map's status (TKT-107): a published version is
        immutable (ADR-029) and keeps the ADR-004 hours tier, Cache-Control:
        public, max-age=3600, s-maxage=3600; a draft is mutable and is no-store.
      parameters:
        - $ref: '#/components/parameters/SeatMapId'
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '200':
          description: The seat map geometry
          headers:
            Cache-Control: { $ref: '#/components/headers/SeatMapCacheControl' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeatMapGeometry' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /public/seat-maps/{seatMapId}/versions:
    get:
      operationId: listSeatMapVersions
      # Public read: opts out of the document-level staff-write requirement.
      security: []
      summary: A seat map family's version history (status-driven cache tier, TKT-105)
      description: >
        Every version of the seat-map family that seatMapId belongs to (any
        version resolves the family), newest first, each carrying its
        published_at. current_version is the highest published version — the one
        an edit targets — and is absent for a draft-only family. Cache tier follows
        the payload's statuses (TKT-107): the ADR-004 minutes tier (public,
        max-age=300, s-maxage=300) only when every version listed is published,
        no-store as soon as one is a draft. The minutes rather than hours tier
        because what this response caches is family MEMBERSHIP, which an ADR-029
        edit changes by inserting a published successor — unlike a single
        published version, which is immutable (TKT-141). Catalog-owned; the back office does not
        keep a version store of its own.
      parameters:
        - $ref: '#/components/parameters/SeatMapId'
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '200':
          description: The family's versions, newest first
          headers:
            Cache-Control: { $ref: '#/components/headers/SeatMapListCacheControl' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeatMapVersionHistory' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /channels:
    post:
      operationId: createChannel
      # TKT-245: the organizer comes from the assertion, not the body. BOTH schemes
      # in ONE requirement object -- separate objects would mean OR, i.e. either
      # credential alone suffices. A test pins that.
      security:
        - CatalogStaffWriteCredential: []
          CatalogOrganizerAssertion: []
      summary: Define a sales channel (TKT-235 / epic TKT-17)
      description: >
        Creates an organizer-scoped channel definition: an exact opaque code, a
        display name, a kind and an enabled flag. The registry is a LOOKUP, not a
        constraint — no table that stores a channel_code (inventory's claims and
        channel_allocations, catalog's fee_rules and split_schedules) references
        it, so an unregistered code keeps selling exactly as it does today. That
        is ADR-024's rule: historical attribution must survive a channel being
        retired, which a foreign key would break.

        Codes are exact and case-sensitive (ADR-024, ADR-046 §4): "POS", "pos"
        and " pos " are three different channels. Nothing trims or case-folds
        them, here or anywhere else.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChannelCreate' }
      responses:
        '401': { $ref: '#/components/responses/StaffWriteUnauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
        '201':
          description: Channel created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Channel' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: This organizer already has a channel with that code
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
  /channels/{channelId}:
    put:
      operationId: updateChannel
      # TKT-245: the organizer comes from the assertion, not the body. BOTH schemes
      # in ONE requirement object -- separate objects would mean OR, i.e. either
      # credential alone suffices. A test pins that.
      security:
        - CatalogStaffWriteCredential: []
          CatalogOrganizerAssertion: []
      summary: Update a channel's display name, kind or enabled flag (TKT-235)
      description: >
        The code is IMMUTABLE. It is required in the body and must equal the
        stored code; a different value is refused with 409 rather than renaming
        the row. Renaming would silently orphan the code already recorded on
        live claims, fee rules and split schedules — none of which reference
        this table (ADR-024), so nothing would cascade and nothing would
        complain. A rename is a new channel plus disabling the old one.

        There is no GET beside this PUT. Catalog's contract holds an invariant
        (TKT-191, write_credential_test.go): every unsafe operation requires the
        staff-write credential and every SAFE one opts out with `security: []`.
        The credential is a write credential, so a staff-authenticated read
        cannot be expressed here — the operator read that shows disabled
        channels is a hand-mounted /internal/ route instead, following the same
        convention as catalog's other internal reads.
      parameters:
        - $ref: '#/components/parameters/ChannelId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChannelUpdate' }
      responses:
        '401': { $ref: '#/components/responses/StaffWriteUnauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
        '200':
          description: The updated channel
          headers:
            Cache-Control: { $ref: '#/components/headers/NeverCacheControl' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Channel' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The submitted code differs from the stored one — codes are immutable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /public/channels:
    get:
      operationId: listPublicChannels
      # Public read: opts out of the document-level staff-write requirement.
      security: []
      summary: Enabled sales channels for a storefront selector (minutes tier)
      description: >
        The organizer's ENABLED channels only, as {code, display_name}. A client
        that renders a channel selector needs the opaque code to submit a later
        sale, so the code is returned; it is configuration, not a secret.

        Served straight from the store with no server-side cache, unlike
        catalog's four aggregated storefront reads. That is deliberate: this is
        low-volume configuration, and the repo already classified its two closest
        siblings the same way — public_read_invalidation_test.go records
        CreateFeeRule and CreateSplitSchedule as affecting no cached public
        payload. Cache-Control still declares the ADR-004 minutes tier, so shared
        caches and the storefront behave as they do for the cached reads; no Age
        header, because nothing here ages in memory.
      parameters:
        - $ref: '#/components/parameters/OrganizerId'
      responses:
        '500': { $ref: '#/components/responses/InternalError' }
        '200':
          description: Enabled channels, code and display name
          headers:
            Cache-Control: { $ref: '#/components/headers/MinutesCacheControl' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicChannelList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /openapi.yaml:
    get:
      operationId: getOpenAPISpec
      # Public read: opts out of the document-level staff-write requirement.
      security: []
      summary: This contract, as committed (ADR-009)
      responses:
        '200':
          description: The OpenAPI document, byte-identical to the repo file
          content:
            application/yaml:
              schema:
                type: string
components:
  securitySchemes:
    CatalogStaffWriteCredential:
      description: >
        The back office's credential for catalog writes (TKT-191, ADR-042). It
        authenticates the DEPUTY, not the individual staff member: catalog knows
        the caller is the back office, and the back office is what decides which
        staff member may drive which write. Roles are TKT-197.

        Deliberately NOT the shared INTERNAL_SERVICE_TOKEN — that one value opens
        every service's internal surface, and this one opens catalog writes only.
      type: apiKey
      in: header
      name: X-Catalog-Staff-Write-Token
    CatalogOrganizerAssertion:
      description: >
        WHICH ORGANIZER the write is for (TKT-245, ADR-058), signed by catalog at
        staff sign-in and presented back unchanged. It answers the question
        CatalogStaffWriteCredential cannot: that credential authenticates the
        deputy PROCESS, so before this scheme existed every write took
        organizer_id from the request body and catalog had nothing to check it
        against.

        Required TOGETHER WITH CatalogStaffWriteCredential, never instead of it —
        both keys in ONE requirement object. The two are not alternatives: the
        credential says the back office is calling, the assertion says which
        tenant it is calling for, and a caller needs both.

        Obtained from POST /staff/authenticate (organizer_assertion). It is a
        bearer credential until it expires: hold it server-side, never render it
        into a page.
      type: apiKey
      in: header
      name: X-Catalog-Organizer-Assertion
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >
        Deduplicates a create (TKT-200). A repeat carrying the same key returns
        the resource the first call created instead of making a second one, and
        two concurrent submits of one key create exactly one row — the guarantee
        is a UNIQUE (organizer_id, idempotency_key) index, not application
        logic, so it holds for requests that are in flight together and never
        see each other's result.

        Scoped by organizer (ADR-002), so two tenants may use the same key
        string without colliding. The organizer comes from the verified
        assertion (TKT-245), never the body, which is what makes the scope
        trustworthy.

        Same key with a DIFFERENT request body is a 409, not a silent replay of
        somebody else's resource — the same decision commerce made, for the same
        reason.

        `required: true` is a contract statement, not an enforcement mechanism:
        oapi-codegen generates a Params struct nothing references, so each
        handler checks the header itself, exactly as commerce's eight write
        paths do. A test that mutates this line to prove enforcement would be
        testing a comment.
      schema:
        type: string
        minLength: 1
        maxLength: 200
    Locale:
      name: locale
      in: query
      required: true
      description: BCP-47 primary subtag; supported set is data, not schema (TKT-36)
      schema:
        type: string
        pattern: '^[a-z]{2}$'
    PerformanceId:
      name: performanceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EventId:
      name: eventId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SeriesId:
      name: seriesId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SeasonId:
      name: seasonId
      in: path
      required: true
      schema: { type: string, format: uuid }
    FestivalId:
      name: festivalId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OrganizerId:
      name: organizer_id
      in: query
      required: true
      description: Tenant scope (ADR-002); required — no session to infer from
      schema: { type: string, format: uuid }
    VenueId:
      name: venueId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SeatMapId:
      name: seatMapId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ChannelId:
      name: channelId
      in: path
      required: true
      description: >
        The channel's UUID, not its code. Codes are opaque 1..100-byte strings
        that may legally contain characters requiring percent-encoding, and they
        are immutable — neither property makes them a good path identifier.
      schema: { type: string, format: uuid }
  headers:
    PublicReadAge:
      description: >
        Seconds this answer has already spent in catalog's in-memory public-read
        cache (TKT-206, ADR-045), rounded up. Required, and 0 on a cache miss.

        It exists so two staleness budgets cannot stack. Cache-Control declares
        these responses publicly cacheable for five minutes, and the storefront's
        SSR cache starts every entry it fetches at age zero — so without Age, a
        catalog entry already 299 seconds old would be granted another 300 by
        Astro, giving a buyer ten minutes of staleness against a tier that
        promises five. Age is RFC 9111's mechanism for exactly this, and it is
        the only one available here: varying Cache-Control by remaining freshness
        is what the storefront middleware does for pages, but ADR-028 validates
        this response header against its declaration, so the tier is a fixed
        value.

        Bounded by the tier itself: an entry older than max-age is not served.
      required: true
      schema:
        type: integer
        minimum: 0
        maximum: 300
    SeatMapCacheControl:
      description: >
        ADR-004 volatility tier for the BY-ID seat-map geometry read, driven by
        the payload's status (TKT-107): the hours tier when the map is published,
        otherwise no-store. Draft geometry is mutable, so an hour of shared-cache
        lifetime would make an authoring write look lost; a published version is
        immutable (ADR-029), which is what makes the hours branch correct — and
        that immutability is why this read KEPT the hours tier when TKT-141
        demoted the two list reads to SeatMapListCacheControl. The enum
        is enforced at runtime, not only by the gate: catalog's ADR-028 response
        validator checks response headers and turns a third value into a 500 with
        the payload withheld. That binds the header's first field value; an
        appended second value is not caught (see ADR-004's TKT-209 amendment). no-store closes the shared-cache vector only — it is
        not access control.
      schema:
        type: string
        enum:
          - 'no-store'
          - 'public, max-age=3600, s-maxage=3600'
    SeatMapListCacheControl:
      description: >
        ADR-004 volatility tier for the two seat-map LIST reads (TKT-141): the
        minutes tier when the response is non-empty and every seat map in it is
        published, otherwise no-store. One response carries one header, so a list
        takes its least-cacheable member's tier, and an empty list fails closed.
        Deliberately a SHORTER tier than the by-id read's. The by-id read caches
        an immutable published version (ADR-029), which is an honest hour-long
        claim; a list caches MEMBERSHIP, and membership is not immutable —
        authoring a seat map, or an ADR-029 edit inserting a published successor,
        changes the list a second after it was cached. TKT-107 accepted that
        staleness and recorded it in ADR-004; this component is where it is
        withdrawn. The enum is enforced at runtime, not only by the gate:
        catalog's ADR-028 response validator checks response headers and turns a
        third value into a 500 with the payload withheld. That binds the header's
        first field value; an appended second value is not caught (see ADR-004's
        TKT-209 amendment). no-store closes the shared-cache vector only — it is
        not access control.
      schema:
        type: string
        enum:
          - 'no-store'
          - 'public, max-age=300, s-maxage=300'
    PriceResolutionCacheControl:
      description: >
        Always no-store. A resolved price feeds a money decision (ADR-004's
        "never" tier), and once TKT-152 adds effective windows the response's
        correctness expires at a known instant — caching it past that instant
        would sell at a stale price. Single-valued and required so the ADR-028
        response validator turns any other value into a 500. That binds the
        header's first field value; an appended second value is not caught (see
        ADR-004's TKT-209 amendment).
      required: true
      schema:
        type: string
        enum:
          - 'no-store'
    MinutesCacheControl:
      description: >
        Always the ADR-004 minutes tier. Single-valued and required, so the
        ADR-028 response validator turns any other value into a 500 and the
        cross-service tier audit (shared/go/cachetier) can check the committed
        value rather than take it on trust. That binds the header's first field
        value; an appended second value is not caught (see ADR-004's TKT-209
        amendment).

        Since TKT-209 every catalog public read declares its tier this way.
        The free-form `CacheControl` component this replaced was `type: string`
        with no enum and committed nothing, so the validator had nothing to check
        and TKT-204 had to carry a named allowlist of the operations using it; a
        new read joins this component, or the hours one below.
      required: true
      schema:
        type: string
        enum:
          - 'public, max-age=300, s-maxage=300'
    HoursCacheControl:
      description: >
        Always the ADR-004 hours tier. The sibling of `MinutesCacheControl` for
        the one public read whose data is long-lived: `listPublicVenues`, since
        venue geometry changes on a scale of months (ADR-004 rule 1).

        Single-valued and required for the same reasons: the ADR-028 response
        validator turns any other value — and a missing header — into a 500 with
        the payload withheld, and the cross-service tier audit
        (shared/go/cachetier) can check the committed value rather than take it
        on trust.

        The enforced claim is about the header's FIRST field value. A response
        that emits the declared tier and then appends a second value passes
        validation, because the validator decodes a primitive header from raw[0].
        That gap is not specific to this component — it applies to every
        enum-declared response header in every service — and is pinned open by
        TestPublicReadCacheTierDuplicateHeaderIsNotCaught rather than left to
        inference.

        Distinct from `SeatMapCacheControl`, which also carries this tier but
        conditionally: a seat-map response earns the hours tier only when every
        map in it is published, and takes no-store otherwise (TKT-107). This
        component is unconditional, so the two cannot share a declaration.
      required: true
      schema:
        type: string
        enum:
          - 'public, max-age=3600, s-maxage=3600'
    NeverCacheControl:
      description: >
        Always no-store — ADR-004's "never" tier. An authentication response is
        never shared-cacheable: it is computed from a submitted credential and
        says whether that credential is good. Single-valued and required so the
        ADR-028 response validator turns any other value into a 500. That binds
        the header's first field value; an appended second value is not caught
        (see ADR-004's TKT-209 amendment).
      required: true
      schema:
        type: string
        enum:
          - 'no-store'
  responses:
    StaffWriteUnauthorized:
      description: >-
        The staff-write credential was absent or wrong. Deliberately says which
        of those it was NOT: distinguishing them tells a caller whether a
        credential is configured at all. Identical bytes either way.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NeverCacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalRouteUnauthorized:
      description: >-
        The internal service credential was absent or wrong. Catalog answers 401
        on its internal surface; commerce answers 404 on its own. ADR-043 records
        that split as deliberate-but-not-uniform and declines to churn catalog's
        existing routes, so a NEW catalog internal route follows catalog's
        convention — two refusal codes inside one service would be worse than the
        inconsistency across two.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    IdempotencyConflict:
      description: >-
        The idempotency key has already been used for a DIFFERENT request
        (TKT-200). Replaying the first result here would hand the caller a
        resource it did not ask for, so the reuse is refused instead. Retry with
        a fresh key, or repeat the original request byte-for-byte to get its
        result back.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Referenced entity does not exist (or is not published, on public reads)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: >-
        Internal error. Emit-failure bodies carry an actionable recovery hint
        (e.g. retry the publish); declared so the fail-closed response
        validator (ADR-028) does not mask them as contract drift (TKT-108).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    PerformanceDisplayNames:
      type: object
      additionalProperties: false
      required: [performances]
      properties:
        performances:
          type: array
          description: >
            One entry per id that RESOLVED. An id that names nothing is simply
            absent rather than an error — the caller holds a set and one unknown
            member should not fail the other nineteen, and a wallet with one
            unnameable row is better than a wallet that will not load.
          items: {$ref: '#/components/schemas/PerformanceDisplayName'}
    PerformanceDisplayName:
      type: object
      additionalProperties: false
      required: [performance_id, event_name, starts_at]
      properties:
        performance_id: {type: string, format: uuid}
        event_name: {type: string}
        starts_at:
          type: string
          format: date-time
          nullable: true
          description: >
            Null for a performance that has no single instant — a FESTIVAL DAY has
            an operating date and opening hours instead (ADR-014). Required and
            nullable rather than optional: "this kind of performance has no start
            time" is a different fact from "we did not say".
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    StaffCredentials:
      description: >
        A back-office sign-in attempt (TKT-190). maxLength on both fields bounds
        the work an unauthenticated caller can ask for: 72 bytes is bcrypt's hard
        input limit, past which it silently ignores the tail, so a longer password
        and its 72-byte prefix would authenticate each other.
      type: object
      required: [identifier, password]
      additionalProperties: false
      properties:
        identifier:
          type: string
          minLength: 1
          maxLength: 320
        password:
          type: string
          minLength: 1
          maxLength: 72
    StaffRole:
      description: >
        The staff role vocabulary (TKT-197). This enum is the SINGLE source: it
        generates the Go constants catalog validates against and the TypeScript
        union the back office's route matrix is typed on, so adding a role here
        without deciding its permissions fails the back-office build rather than
        silently defaulting to something permissive.

        Deliberately NOT also a CHECK constraint on staff_accounts.role. That
        would be a second hand-written vocabulary to keep in step, and per
        ADR-021 it constrains nobody who can write the database — they can drop
        the constraint or grant themselves admin. The fail-closed boundary is the
        application: an unrecognised stored role does not authenticate.

        admin reaches everything the back office exposes. box_office is for order
        lookup and post-purchase actions (TKT-193/TKT-194); finance is for
        settlement and reporting (TKT-23). Both reach almost nothing today, and
        that is correct — the surfaces they exist for are not built yet.
      type: string
      enum: [admin, box_office, finance]
    StaffPrincipal:
      description: >
        Who signed in, and in what role. Carries no password material of any kind.

        The role is here because the back office gates on it (TKT-197). TKT-190
        deliberately withheld it while the vocabulary was undecided; TKT-197 is
        the ticket that decided it.

        organizer_assertion (TKT-245, ADR-058) is the signed statement catalog
        will accept back on writes instead of a caller-supplied organizer_id. It
        is a CREDENTIAL: the back office keeps it in its server-side session and
        never renders it into a page or hands it to browser JavaScript.
      type: object
      required: [staff_id, organizer_id, role, organizer_assertion]
      additionalProperties: false
      properties:
        staff_id:
          type: string
          format: uuid
        organizer_id:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/StaffRole'
        organizer_assertion:
          type: string
          description: >
            Opaque to the holder in the sense that matters: it is signed, so any
            field it names can be read but none can be changed. Present the whole
            string unmodified in X-Catalog-Organizer-Assertion.

            Empty only when the server has no signing key configured, which
            startup refuses -- a client receiving an empty value should treat
            sign-in as failed rather than proceeding to writes that will 401.
    LocalizedString:
      description: Locale-keyed text; adding a locale is data, not a schema change (TKT-36)
      type: object
      additionalProperties:
        type: string
    PriceRuleProvenance:
      description: One pricing rule as reported in a resolution's provenance (ADR-036 §5).
      type: object
      # effective_from / effective_until are REQUIRED and nullable, not optional:
      # the point of declaring them in TKT-151 is that TKT-153 persists this shape
      # as a snapshot, and an absent key is a different shape from an explicit
      # null. Optional + omitempty would have shipped the second while claiming
      # the first.
      required: [rule_id, scope_level, scope_id, action_kind, amount, currency,
                 effective_from, effective_until, priority, forced, channel_code]
      properties:
        channel_code:
          description: >
            The rule's own channel; null is channel-agnostic (TKT-237). Required
            and nullable for the reason the window bounds are: TKT-153 persists
            this shape, and an absent key is a different shape from an explicit
            null.

            Reporting it discloses nothing new. Only channel-ELIGIBLE rules ever
            appear in provenance, so this value is either the channel the caller
            already named or null — never another channel's. That is what makes
            it safe on a public read, and it is why the filter runs before the
            window branches rather than after them.
          type: string
          nullable: true
          minLength: 1
          maxLength: 100
        rule_id:
          type: string
          format: uuid
        scope_level:
          type: string
          enum: [ticket_type, slot, series, event, venue]
        scope_id:
          type: string
          format: uuid
        action_kind:
          description: Tagged union with one member today; widening it later is additive (ADR-036 §2).
          type: string
          enum: [absolute]
        amount:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        effective_from:
          description: >
            Inclusive lower bound of the rule's effective window; null means
            unbounded. The interval is HALF-OPEN [effective_from,
            effective_until) — a rule is eligible at an instant equal to
            effective_from and NOT eligible at one equal to effective_until.
            Stated explicitly because an inclusive/exclusive ambiguity at a tier
            boundary is a money bug, not a rounding detail. A reversed window is
            rejected by the database.
          type: string
          format: date-time
          nullable: true
        effective_until:
          description: >
            Exclusive upper bound; null means unbounded. See effective_from for
            the half-open semantics. A rule whose window has closed is inert: it
            can never price anything again, so a misconfiguration in it is
            ignored rather than failing every resolution forever.
          type: string
          format: date-time
          nullable: true
        priority:
          type: integer
          format: int32
        forced:
          description: force_ancestor_override — restricts the competition to forced rules and inverts the scope order.
          type: boolean
    LosingPriceRule:
      description: >
        A candidate that did not win, and why. The reason enum is closed and
        total over the comparator: every way a rule can lose has a value.
      type: object
      required: [rule, reason]
      properties:
        rule:
          $ref: '#/components/schemas/PriceRuleProvenance'
        reason:
          type: string
          enum:
            - less_specific
            - forced_broader_scope
            - excluded_by_forced_rule
            - lower_forced_scope
            # TKT-237. Emitted ONLY for a rule that was channel-ELIGIBLE and lost
            # on specificity — a channel-agnostic rule beaten by an exact-channel
            # one at the same scope (or the reverse under a forced partition). A
            # rule belonging to a DIFFERENT channel never reaches here: it is
            # ineligible and absent from candidates entirely.
            - less_channel_specific
            - lower_priority
            - stable_id_tiebreak
            - outside_window_past
            - outside_window_future
    PriceResolution:
      description: >
        A resolved unit price and the provenance of that answer (ADR-036 §5).
        candidates holds every considered rule EXCEPT the winner — stated
        explicitly because "candidates" and "the losers" pull in opposite
        directions and two implementations of a looser sentence would disagree.
        It is ordered by rule id ascending; the order is representation only and
        carries no precedence.

        INVARIANT, guaranteed by the server: winner and fallback_reason are
        mutually exclusive and jointly exhaustive — exactly one of "winner is
        non-null" and "fallback_reason is present" holds.

        This FLAT schema cannot express that. OpenAPI 3.0 could, as a oneOf of
        two variants — the accurate statement is not "impossible" but "not worth
        it here": a oneOf would turn PriceResolution into a union in the
        generated Go and in both generated TypeScript clients, for a pair no
        consumer branches on. So the contract is deliberately BROADER than the
        runtime: a client may rely on the invariant, and the server side is
        pinned by TestResolveTicketTypePriceWinnerAndFallbackAreExclusive, which
        covers a winner, an empty-candidate fallback, and a fallback WITH
        candidates (every rule window-ineligible) — the three shapes the handler
        can actually produce.
      type: object
      # winner is required and nullable for the same reason: a fallback response
      # must say "winner: null", not omit the key.
      required: [resolver_version, evaluated_at, organizer_id, performance_id,
                 base_price, resolved_price, winner, candidates, channel_code]
      properties:
        channel_code:
          description: >
            The channel this resolution answered for; null is the default/public
            context (TKT-237). Required and nullable, echoed rather than
            inferred: a persisted snapshot (TKT-153) would otherwise be ambiguous
            between "no channel-specific rules existed" and "the sale named no
            channel" — two different facts that produce identical provenance.
          type: string
          nullable: true
          minLength: 1
          maxLength: 100
        organizer_id:
          description: >
            Tenant that owns the ticket type. Present so ONE call answers a
            caller's whole question: commerce needs it to authorize the sale, and
            a second catalog read to fetch it would have to be reconciled against
            this response on every reserve (TKT-153).
          type: string
          format: uuid
        performance_id:
          description: >
            The dated slot the ticket type belongs to — the inventory pool a hold
            is placed against. Present for the same reason as organizer_id.
          type: string
          format: uuid
        resolver_version:
          description: >
            Bumped when the comparator's semantics change. A commitment, not a
            decoration: TKT-153 persists snapshots that must stay interpretable.
          type: integer
          format: int32
          minimum: 1
        evaluated_at:
          description: The server-side instant the rules were evaluated against.
          type: string
          format: date-time
        base_price:
          # The ticket type's own price, before any rule.
          $ref: '#/components/schemas/Money'
        resolved_price:
          # What the winning rule produced, or base_price when none applied.
          $ref: '#/components/schemas/Money'
        winner:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/PriceRuleProvenance'
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/LosingPriceRule'
        fallback_reason:
          description: Present only when no rule applied and base_price is the answer.
          type: string
          enum: [no_eligible_rule]
    FeeRuleProvenance:
      description: One fee rule as reported in a resolution's provenance (ADR-046).
      type: object
      # Every nullable field is REQUIRED-and-nullable rather than optional, for
      # the reason PriceRuleProvenance states: TKT-215 persists this shape as a
      # snapshot, and an absent key is a different document from an explicit null.
      required: [rule_id, scope_level, scope_id, fee_code, basis, amount, rate_bps,
                 currency, incidence, channel_code, effective_from, effective_until,
                 priority, forced]
      properties:
        rule_id: {type: string, format: uuid}
        scope_level:
          type: string
          enum: [ticket_type, slot, series, event, venue]
        scope_id: {type: string, format: uuid}
        fee_code:
          description: >
            The additive stream this rule belongs to. Opaque and case-sensitive;
            there is no registry and no normalization (TKT-17 owns that).
          type: string
          minLength: 1
          maxLength: 64
        basis:
          description: >
            How the number becomes money. Catalog never multiplies — it reports
            the basis and commerce composes the order total (ADR-002, unamended
            by this ticket).
          type: string
          enum: [per_ticket_fixed, per_order_fixed, percentage_bps]
        amount:
          description: Minor units for a fixed basis; null on a percentage rule.
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          nullable: true
        rate_bps:
          description: >
            Basis points for a percentage basis; null on a fixed rule. 0..10000 —
            a rate above 100% is a fee larger than the thing it is a fee on.
          type: integer
          format: int32
          minimum: 0
          maximum: 10000
          nullable: true
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        incidence:
          description: >
            passed_on is added to what the buyer is charged; absorbed is borne by
            the organizer out of the face value. This changes nothing about
            eligibility or precedence — it decides what commerce does with the
            number (TKT-215) and what the settlement ledger must balance
            (TKT-217).
          type: string
          enum: [passed_on, absorbed]
        channel_code:
          description: >
            null means channel-agnostic: eligible in every channel, including the
            default/public one. A non-null code is eligible only on an exact
            string match.
          type: string
          minLength: 1
          maxLength: 100
          nullable: true
        effective_from:
          description: >
            Inclusive lower bound; null is unbounded. The interval is HALF-OPEN
            [effective_from, effective_until) — eligible at an instant equal to
            effective_from, NOT eligible at one equal to effective_until. Stated
            explicitly because an inclusive/exclusive ambiguity at a boundary is a
            money bug. A reversed window is rejected by the database.
          type: string
          format: date-time
          nullable: true
        effective_until:
          description: >
            Exclusive upper bound; null is unbounded. A rule whose window has
            closed is inert: it can never charge anything again, so a
            misconfiguration in it is reported rather than failing every
            resolution forever.
          type: string
          format: date-time
          nullable: true
        priority: {type: integer, format: int32}
        forced:
          description: force_ancestor_override — restricts the competition to forced rules and inverts BOTH specificity axes.
          type: boolean
    LosingFeeRule:
      description: >
        A candidate that did not win its fee code, and why. The reason enum is
        closed and total over the comparator. Note what is NOT here: a rule
        belonging to a different channel is absent entirely rather than reported
        as a loser, because returning it would publish one caller's channel fee
        matrix to every other caller.
      type: object
      required: [rule, reason]
      properties:
        rule:
          $ref: '#/components/schemas/FeeRuleProvenance'
        reason:
          type: string
          enum:
            - less_specific
            - forced_broader_scope
            - excluded_by_forced_rule
            - lower_forced_scope
            - less_channel_specific
            - lower_priority
            - stable_id_tiebreak
            - outside_window_past
            - outside_window_future
    Payee:
      description: >
        Someone a fee is owed to (TKT-216). `kind` is DESCRIPTIVE metadata for
        reporting and must never be read as a routing rule — money goes where the
        share says, not where the kind implies.
      type: object
      required: [payee_id, kind, display_name, external_reference]
      properties:
        payee_id: {type: string, format: uuid}
        kind: {type: string, minLength: 1, maxLength: 40}
        display_name: {type: string, minLength: 1, maxLength: 200}
        external_reference:
          description: The operator's own identifier for this payee in whatever system pays them. Opaque here; payout execution is not in this epic.
          type: string
          minLength: 1
          maxLength: 200
          nullable: true
    SplitPart:
      description: One payee's share of a fee, in basis points. Parts of a schedule always sum to exactly 10000.
      type: object
      required: [payee, share_bps]
      properties:
        payee:
          $ref: '#/components/schemas/Payee'
        share_bps: {type: integer, format: int32, minimum: 0, maximum: 10000}
    SplitScheduleProvenance:
      description: One split schedule as reported in provenance.
      type: object
      required: [schedule_id, scope_level, scope_id, fee_code, channel_code,
                 effective_from, effective_until, priority, forced, parts]
      properties:
        schedule_id: {type: string, format: uuid}
        scope_level:
          type: string
          enum: [ticket_type, slot, series, event, venue]
        scope_id: {type: string, format: uuid}
        fee_code: {type: string, minLength: 1, maxLength: 64}
        channel_code:
          type: string
          minLength: 1
          maxLength: 100
          nullable: true
        effective_from: {type: string, format: date-time, nullable: true}
        effective_until: {type: string, format: date-time, nullable: true}
        priority: {type: integer, format: int32}
        forced: {type: boolean}
        parts:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SplitPart'
    LosingSplitSchedule:
      description: >
        A schedule that did not win its fee code, and why. The reason vocabulary
        is the fee resolver's, reused verbatim — the ranking axes are identical,
        so a parallel vocabulary would be two words for one fact.

        A schedule belonging to another CHANNEL is absent entirely rather than
        reported: returning it would publish the whole channel payout matrix.
      type: object
      required: [schedule, reason]
      properties:
        schedule:
          $ref: '#/components/schemas/SplitScheduleProvenance'
        reason:
          type: string
          enum:
            - less_specific
            - forced_broader_scope
            - excluded_by_forced_rule
            - lower_forced_scope
            - less_channel_specific
            - lower_priority
            - stable_id_tiebreak
            - outside_window_past
            - outside_window_future
    SplitResolution:
      description: >
        Who a fee code is owed to (TKT-216 / ADR-047).

        `mode` is `split` when a schedule won, and `unsplit` when the code was
        CONSIDERED and nothing applies. Those are different facts from each
        other and from an empty part list: `no_schedule` means nobody ever
        authored one, while `outside_window` means somebody did and it stopped
        applying — and only the second is evidence of a configuration that needs
        attention. The losing schedules ship with it, because they are the answer
        to "why is this fee not being split?".
      type: object
      required: [resolver_version, mode, reason, winner, candidates]
      properties:
        resolver_version: {type: integer, format: int32, minimum: 1}
        mode:
          type: string
          enum: [split, unsplit]
        reason:
          description: Empty when mode is `split`; otherwise why nothing applies.
          type: string
          enum: ['', no_schedule, outside_window]
        winner:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/SplitScheduleProvenance'
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/LosingSplitSchedule'
    FeeCodeResolution:
      description: >
        One fee code's outcome. candidates holds every rule that competed for
        this code EXCEPT the winner, ordered by rule id — representation only,
        carrying no precedence.

        `split` says who the fee is owed to. It rides this response rather than a
        second endpoint deliberately: commerce persists this whole document as
        the reservation's snapshot, so carrying the split here captures it AT
        SALE TIME, and a schedule edited afterwards cannot change who gets paid
        for a sale that already happened.
      type: object
      # winner is required and nullable: a considered-but-inapplicable code must
      # say "winner: null", not omit the key.
      required: [fee_code, winner, candidates, split]
      properties:
        fee_code:
          type: string
          minLength: 1
          maxLength: 64
        winner:
          description: >
            null when the code was considered and nothing currently applies —
            every rule for it fell outside its effective window. The candidates
            then ARE the answer to "why is this fee not showing up?". A code no
            rule carries produces no entry at all: considered-and-inapplicable
            and not-present are different states.
          nullable: true
          allOf:
            - $ref: '#/components/schemas/FeeRuleProvenance'
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/LosingFeeRule'
        split:
          $ref: '#/components/schemas/SplitResolution'
    FeeResolution:
      description: >
        Every fee that applies to a ticket type in a channel, with provenance
        (ADR-046). fees is ordered by fee code so the document is stable; the
        order carries no precedence, because codes do not compete with each
        other — they are additive.

        An empty fees array is the correct and complete answer for a ticket type
        with no fee rules, which is every ticket type that existed before this
        operation did.
      type: object
      required: [resolver_version, evaluated_at, organizer_id, performance_id,
                 currency, channel_code, fees]
      properties:
        resolver_version:
          description: >
            Bumped when the comparator's semantics change. A commitment, not a
            decoration: TKT-215 persists snapshots that must stay interpretable.
          type: integer
          format: int32
          minimum: 1
        evaluated_at:
          description: The server-side instant the rules were evaluated against.
          type: string
          format: date-time
        organizer_id: {type: string, format: uuid}
        performance_id:
          description: The dated slot the ticket type belongs to.
          type: string
          format: uuid
        currency:
          description: >
            The ticket type's currency, which every rule here was validated
            against — a fee and the thing it is a fee on must be the same money.
            A mismatched rule fails the resolution rather than being skipped.
          type: string
          pattern: '^[A-Z]{3}$'
        channel_code:
          description: >
            The channel this resolution was requested for; null is the
            default/public context. Echoed back so a stored snapshot records WHICH
            question was asked, not just the answer.
          type: string
          minLength: 1
          maxLength: 100
          nullable: true
        fees:
          type: array
          items:
            $ref: '#/components/schemas/FeeCodeResolution'
    Money:
      description: Integer minor units + ISO-4217 code (ADR-001); no floats, ever
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: integer
          format: int64
          minimum: 0
          # bounded to JavaScript's safe-integer range: every consumer of
          # this contract (storefront included) must represent it exactly
          maximum: 9007199254740991
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
    VenueCreate:
      type: object
      # TKT-245: a submitted organizer_id must be REFUSED, not ignored. The
      # field is gone from the properties above; without this line an extra
      # key is silently dropped, which reads to a client as "accepted".
      additionalProperties: false
      required: [name, ga_capacity]
      properties:
        name:
          type: string
          minLength: 1
        ga_capacity:
          type: integer
          format: int32
          minimum: 1
    Venue:
      type: object
      required: [id, organizer_id, name, ga_capacity, created_at]
      properties:
        id:
          type: string
          format: uuid
        organizer_id:
          type: string
          format: uuid
        name:
          type: string
        ga_capacity:
          type: integer
          format: int32
        created_at:
          type: string
          format: date-time
    SeatMapCreate:
      type: object
      # TKT-245: a submitted organizer_id must be REFUSED, not ignored. The
      # field is gone from the properties above; without this line an extra
      # key is silently dropped, which reads to a client as "accepted".
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        orphan_prevention_enabled:
          type: boolean
          default: false
          description: >
            Refuse a seat selection that would strand a lone free seat in a row
            (ADR-041). Optional and defaulting to false, so a caller that has never
            heard of the rule creates exactly the map it created before. Nothing
            enforces it yet — TKT-181 puts it on the wire, TKT-182 acts on it.
    SeatMap:
      type: object
      required: [id, organizer_id, venue_id, name, version, status, created_at, orphan_prevention_enabled]
      properties:
        id: { type: string, format: uuid }
        organizer_id: { type: string, format: uuid }
        venue_id: { type: string, format: uuid }
        name: { type: string }
        version: { type: integer, format: int32 }
        status:
          type: string
          enum: [draft, published, archived]
        published_at:
          description: Publication instant (TKT-103); absent while draft
          type: string
          format: date-time
        orphan_prevention_enabled:
          type: boolean
          description: >
            Whether slots seated against THIS version refuse a selection that would
            strand a lone free seat (ADR-041). Per version, not per family: a
            published version is immutable and an edit mints a new one (ADR-029), so
            a seated pool's rule cannot change under it. Required on the response —
            every map has a value, and an absent field would read as "unknown" when
            the answer is always known.
        created_at: { type: string, format: date-time }
    SeatMapSectionCreate:
      type: object
      # TKT-245: a submitted organizer_id must be REFUSED, not ignored. The
      # field is gone from the properties above; without this line an extra
      # key is silently dropped, which reads to a client as "accepted".
      additionalProperties: false
      required: [name, position]
      properties:
        # no '/': it is the seat-identity delimiter, so a component carrying one
        # would make distinct seats compose to the same identity.
        name: { type: string, minLength: 1, pattern: '^[^/]+$' }
        position: { type: integer, format: int32, minimum: 1 }
    SeatMapRowCreate:
      type: object
      # TKT-245: a submitted organizer_id must be REFUSED, not ignored. The
      # field is gone from the properties above; without this line an extra
      # key is silently dropped, which reads to a client as "accepted".
      additionalProperties: false
      required: [section_id, label, position]
      properties:
        section_id: { type: string, format: uuid }
        label: { type: string, minLength: 1, pattern: '^[^/]+$' }
        position: { type: integer, format: int32, minimum: 1 }
    SeatMapSeatCreate:
      type: object
      # TKT-245: a submitted organizer_id must be REFUSED, not ignored. The
      # field is gone from the properties above; without this line an extra
      # key is silently dropped, which reads to a client as "accepted".
      additionalProperties: false
      required: [row_id, label, position]
      properties:
        row_id: { type: string, format: uuid }
        label: { type: string, minLength: 1, pattern: '^[^/]+$' }
        position: { type: integer, format: int32, minimum: 1 }
    Seat:
      type: object
      required: [id, seat_identity, label, position]
      properties:
        id: { type: string, format: uuid }
        seat_identity: { type: string }
        label: { type: string }
        position: { type: integer, format: int32 }
    SeatRow:
      type: object
      required: [id, label, position]
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        position: { type: integer, format: int32 }
        # populated only in the geometry read; omitted on the create response
        seats:
          type: array
          items: { $ref: '#/components/schemas/Seat' }
    SeatSection:
      type: object
      required: [id, name, position]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        position: { type: integer, format: int32 }
        # populated only in the geometry read; omitted on the create response
        rows:
          type: array
          items: { $ref: '#/components/schemas/SeatRow' }
    SeatMapGeometry:
      type: object
      required: [map, sections]
      properties:
        map: { $ref: '#/components/schemas/SeatMap' }
        sections:
          type: array
          items: { $ref: '#/components/schemas/SeatSection' }
    SeatMapList:
      type: object
      required: [seat_maps]
      properties:
        seat_maps:
          type: array
          items: { $ref: '#/components/schemas/SeatMap' }
    SeatMapVersionHistory:
      description: A seat-map family's versions (TKT-105), newest first.
      type: object
      required: [versions]
      properties:
        current_version:
          description: >
            Highest published version — the one an edit targets. Absent when the
            family has no published version yet (draft-only).
          type: integer
          format: int32
        versions:
          type: array
          items: { $ref: '#/components/schemas/SeatMap' }
    SeatMapEdit:
      description: >
        Full replacement geometry for a published seat map (TKT-105). Mirrors the
        store's EditSeatMapInput; seat identity is composed server-side from the
        section/row/seat labels, so no component may contain the '/' delimiter.
      type: object
      # TKT-245: a submitted organizer_id must be REFUSED, not ignored. The
      # field is gone from the properties above; without this line an extra
      # key is silently dropped, which reads to a client as "accepted".
      additionalProperties: false
      required: [sections]
      properties:
        orphan_prevention_enabled:
          type: boolean
          description: >
            Omit to INHERIT the edited version's setting; set to apply a new value to
            the newly minted version only (ADR-029: the edited version is immutable
            and is never altered either way). Inheritance is the default because an
            edit is a geometry change — a staffer who says nothing about the rule
            must not silently switch it off.
        sections:
          type: array
          items: { $ref: '#/components/schemas/SeatMapEditSection' }
    SeatMapEditSection:
      type: object
      required: [name, position, rows]
      properties:
        name: { type: string, minLength: 1, pattern: '^[^/]+$' }
        position: { type: integer, format: int32, minimum: 1 }
        rows:
          type: array
          items: { $ref: '#/components/schemas/SeatMapEditRow' }
    SeatMapEditRow:
      type: object
      required: [label, position, seats]
      properties:
        label: { type: string, minLength: 1, pattern: '^[^/]+$' }
        position: { type: integer, format: int32, minimum: 1 }
        seats:
          type: array
          items: { $ref: '#/components/schemas/SeatMapEditSeat' }
    SeatMapEditSeat:
      type: object
      required: [label, position]
      properties:
        label: { type: string, minLength: 1, pattern: '^[^/]+$' }
        position: { type: integer, format: int32, minimum: 1 }
    VenueGaCapacityUpdate:
      type: object
      # TKT-245: a submitted organizer_id must be REFUSED, not ignored. The
      # field is gone from the properties above; without this line an extra
      # key is silently dropped, which reads to a client as "accepted".
      additionalProperties: false
      required: [ga_capacity]
      properties:
        ga_capacity: { type: integer, format: int32, minimum: 1 }
    EventCreate:
      type: object
      # TKT-245: a submitted organizer_id must be REFUSED, not ignored. The
      # field is gone from the properties above; without this line an extra
      # key is silently dropped, which reads to a client as "accepted".
      additionalProperties: false
      required: [name]
      properties:
        name:
          $ref: '#/components/schemas/LocalizedString'
        description:
          $ref: '#/components/schemas/LocalizedString'
    Event:
      type: object
      required: [id, organizer_id, name, created_at]
      properties:
        id:
          type: string
          format: uuid
        organizer_id:
          type: string
          format: uuid
        name:
          $ref: '#/components/schemas/LocalizedString'
        description:
          $ref: '#/components/schemas/LocalizedString'
        created_at:
          type: string
          format: date-time
    SlotKind:
      description: >
        The dated-slot kind (ADR-005 amendment / US-009). 'performance' carries
        starts_at; 'festival_day'/'operating_day' carry the operating window.
      type: string
      enum: [performance, festival_day, operating_day]
    ReEntryPolicy:
      description: >
        How many admissions one entitlement grants on the slot (spike §Case 1).
        'single' is the performance case; 'count_limited' requires max_entries.
      type: object
      required: [mode, requires_exit]
      properties:
        mode:
          type: string
          enum: [single, multi, count_limited]
        max_entries:
          type: integer
          format: int32
          minimum: 1
          nullable: true
        requires_exit:
          type: boolean
    Closure:
      description: >
        Weather-closure state (spike §Case 3), orthogonal to the
        draft/published/archived lifecycle. A closed slot is still published.
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [open, closed]
        closed_at:
          type: string
          format: date-time
          nullable: true
        reason:
          type: string
          nullable: true
    SlotCloseRequest:
      # TKT-251: unsubmittable, not silently dropped (ADR-058 s1). These bodies
      # name the TARGET of the transition; the organizer comes from the verified
      # assertion and can no longer be sent at all.
      additionalProperties: false
      description: Optional operator-supplied reason for the closure
      type: object
      properties:
        reason:
          type: string
          minLength: 1
    PerformanceCreate:
      description: >
        Creates a dated slot in draft. kind defaults to 'performance' (which
        requires starts_at); 'festival_day'/'operating_day' require the
        operating window (operating_date + opens_at + closes_at). re_entry
        defaults to single-entry.
      type: object
      # TKT-245: a submitted organizer_id must be REFUSED, not ignored. The
      # field is gone from the properties above; without this line an extra
      # key is silently dropped, which reads to a client as "accepted".
      additionalProperties: false
      required: [event_id, venue_id, timezone]
      properties:
        event_id:
          type: string
          format: uuid
        venue_id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/SlotKind'
        starts_at:
          description: Instant for kind 'performance'; omit for day kinds
          type: string
          format: date-time
        operating_date:
          description: Local operating date for day kinds
          type: string
          format: date
        opens_at:
          description: Local opening time-of-day (HH:MM) for day kinds
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        closes_at:
          description: Local closing time-of-day (HH:MM); < opens_at spans midnight
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        timezone:
          type: string
          description: IANA zone name, e.g. Europe/Paris
          minLength: 1
        re_entry:
          $ref: '#/components/schemas/ReEntryPolicy'
        seat_map_id:
          description: >
            Published seat-map version to seat this slot against (TKT-103). Omit
            for a GA slot. The referenced map must be published and share the
            slot's organizer and venue; a festival day cannot be seated.
          type: string
          format: uuid
    Performance:
      type: object
      required: [id, organizer_id, event_id, venue_id, kind, timezone, re_entry, closure, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        organizer_id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        venue_id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/SlotKind'
        starts_at:
          description: Present for kind 'performance'; absent for day kinds
          type: string
          format: date-time
        operating_date:
          type: string
          format: date
        opens_at:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        closes_at:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        timezone:
          type: string
        re_entry:
          $ref: '#/components/schemas/ReEntryPolicy'
        closure:
          $ref: '#/components/schemas/Closure'
        status:
          type: string
          enum: [draft, published, archived]
        published_at:
          type: string
          format: date-time
        archived_at:
          type: string
          format: date-time
          nullable: true
        capacity_group_id:
          description: Festival capacity-group id for grouped festival days
          type: string
          format: uuid
        seat_map_id:
          description: >
            Published seat-map version this slot is seated against (TKT-103);
            absent for a GA slot.
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
    TicketTypeCreate:
      type: object
      # TKT-245: a submitted organizer_id must be REFUSED, not ignored. The
      # field is gone from the properties above; without this line an extra
      # key is silently dropped, which reads to a client as "accepted".
      additionalProperties: false
      required: [performance_id, name, price]
      properties:
        performance_id:
          type: string
          format: uuid
        name:
          $ref: '#/components/schemas/LocalizedString'
        price:
          $ref: '#/components/schemas/Money'
    TicketType:
      type: object
      required: [id, organizer_id, performance_id, name, price, created_at]
      properties:
        id:
          type: string
          format: uuid
        organizer_id:
          type: string
          format: uuid
        performance_id:
          type: string
          format: uuid
        name:
          $ref: '#/components/schemas/LocalizedString'
        price:
          $ref: '#/components/schemas/Money'
        created_at:
          type: string
          format: date-time
    SeriesCreate:
      type: object
      # TKT-245: a submitted organizer_id must be REFUSED, not ignored. The
      # field is gone from the properties above; without this line an extra
      # key is silently dropped, which reads to a client as "accepted".
      additionalProperties: false
      required: [event_id, name]
      properties:
        event_id: { type: string, format: uuid }
        name: { $ref: '#/components/schemas/LocalizedString' }
    SeriesPerformanceAttach:
      # TKT-251: unsubmittable, not silently dropped (ADR-058 s1). These bodies
      # name the TARGET of the transition; the organizer comes from the verified
      # assertion and can no longer be sent at all.
      additionalProperties: false
      type: object
      required: [performance_id, position]
      properties:
        performance_id: { type: string, format: uuid }
        position: { type: integer, format: int32, minimum: 1 }
    SeriesMember:
      type: object
      required: [performance_id, position]
      properties:
        performance_id: { type: string, format: uuid }
        position: { type: integer, format: int32, minimum: 1 }
    Series:
      type: object
      required: [id, organizer_id, event_id, name, members, created_at]
      properties:
        id: { type: string, format: uuid }
        organizer_id: { type: string, format: uuid }
        event_id: { type: string, format: uuid }
        name: { $ref: '#/components/schemas/LocalizedString' }
        members:
          type: array
          items: { $ref: '#/components/schemas/SeriesMember' }
        created_at: { type: string, format: date-time }
    SeriesLifecycleResult:
      type: object
      required: [series_id, performances]
      properties:
        series_id: { type: string, format: uuid }
        performances:
          type: array
          items: { $ref: '#/components/schemas/Performance' }
    SeriesTransitionConflict:
      type: object
      required: [error, reason]
      properties:
        error: { type: string }
        reason: { type: string }
        blocking_performance_id: { type: string, format: uuid }
    SeasonCreate:
      type: object
      # TKT-245: a submitted organizer_id must be REFUSED, not ignored. The
      # field is gone from the properties above; without this line an extra
      # key is silently dropped, which reads to a client as "accepted".
      additionalProperties: false
      required: [name]
      properties:
        name: { $ref: '#/components/schemas/LocalizedString' }
    SeasonSeriesAttach:
      # TKT-251: unsubmittable, not silently dropped (ADR-058 s1). These bodies
      # name the TARGET of the transition; the organizer comes from the verified
      # assertion and can no longer be sent at all.
      additionalProperties: false
      type: object
      required: [series_id]
      properties:
        series_id: { type: string, format: uuid }
    SeasonEventAttach:
      # TKT-251: unsubmittable, not silently dropped (ADR-058 s1). These bodies
      # name the TARGET of the transition; the organizer comes from the verified
      # assertion and can no longer be sent at all.
      additionalProperties: false
      type: object
      required: [event_id]
      properties:
        event_id: { type: string, format: uuid }
    Season:
      type: object
      required: [id, organizer_id, name, series_ids, event_ids, created_at]
      properties:
        id: { type: string, format: uuid }
        organizer_id: { type: string, format: uuid }
        name: { $ref: '#/components/schemas/LocalizedString' }
        series_ids:
          type: array
          items: { type: string, format: uuid }
        event_ids:
          type: array
          items: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
    FestivalCreate:
      type: object
      # TKT-245: a submitted organizer_id must be REFUSED, not ignored. The
      # field is gone from the properties above; without this line an extra
      # key is silently dropped, which reads to a client as "accepted".
      additionalProperties: false
      required: [name, shared_capacity]
      properties:
        name: { $ref: '#/components/schemas/LocalizedString' }
        shared_capacity: { type: integer, format: int32, minimum: 1 }
    FestivalDayAttach:
      # TKT-251: unsubmittable, not silently dropped (ADR-058 s1). These bodies
      # name the TARGET of the transition; the organizer comes from the verified
      # assertion and can no longer be sent at all.
      additionalProperties: false
      type: object
      required: [performance_id]
      properties:
        performance_id: { type: string, format: uuid }
    Festival:
      type: object
      required: [id, organizer_id, name, shared_capacity, status, member_ids, created_at]
      properties:
        id: { type: string, format: uuid }
        organizer_id: { type: string, format: uuid }
        name: { $ref: '#/components/schemas/LocalizedString' }
        shared_capacity: { type: integer, format: int32, minimum: 1 }
        status: { type: string, enum: [draft, published, archived] }
        member_ids:
          type: array
          items: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
    FestivalLifecycleResult:
      type: object
      required: [festival_id, performances]
      properties:
        festival_id: { type: string, format: uuid }
        performances:
          type: array
          items: { $ref: '#/components/schemas/Performance' }
    PublicEventList:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/PublicEventSummary'
    PublicVenueList:
      description: >
        The back-office venue list (US-018). Wrapper object (not a bare array)
        matching PublicEventList, so pagination can be added without a breaking
        contract change. Items are the full Venue (ga_capacity + tenancy),
        distinct from the id+name PublicVenue used inside event/festival detail.
      type: object
      required: [venues]
      properties:
        venues:
          type: array
          items:
            $ref: '#/components/schemas/Venue'
    PublicEventSummary:
      type: object
      required: [id, name, performances]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        performances:
          type: array
          items:
            $ref: '#/components/schemas/PublicPerformanceSummary'
    PublicPerformanceSummary:
      type: object
      required: [id, starts_at, timezone, venue_name, from_price]
      properties:
        id:
          type: string
          format: uuid
        starts_at:
          type: string
          format: date-time
        timezone:
          type: string
        venue_name:
          type: string
        from_price:
          $ref: '#/components/schemas/Money'
    PublicEventDetail:
      type: object
      required: [id, organizer_id, name, series, performances]
      properties:
        id:
          type: string
          format: uuid
        organizer_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        series:
          type: array
          items: { $ref: '#/components/schemas/PublicSeriesContext' }
        performances:
          type: array
          items:
            $ref: '#/components/schemas/PublicPerformanceDetail'
    PublicPerformanceDetail:
      type: object
      required: [id, starts_at, timezone, venue, ticket_types]
      properties:
        id:
          type: string
          format: uuid
        starts_at:
          type: string
          format: date-time
        timezone:
          type: string
        venue:
          $ref: '#/components/schemas/PublicVenue'
        seat_map_id:
          type: string
          format: uuid
          description: >
            The published seat-map version this performance is seated against
            (TKT-172). Optional and OMITTED for a GA performance — a storefront
            reads its presence as "this slot is seated, render this map", so a
            null would be a third state nobody wants. It names the exact version
            the performance was bound to at creation, not the family's newest:
            a published version is immutable and an edit mints a new one
            (ADR-029), and re-pointing a live slot is not something a read does.
            A festival day is never seated (the write path refuses it), so a
            grouped day never carries this.
        ticket_types:
          type: array
          items:
            $ref: '#/components/schemas/PublicTicketType'
    PublicSeriesContext:
      type: object
      required: [id, name, performance_ids]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        performance_ids:
          type: array
          items: { type: string, format: uuid }
    PublicSeasonDetail:
      type: object
      required: [id, organizer_id, name, events]
      properties:
        id: { type: string, format: uuid }
        organizer_id: { type: string, format: uuid }
        name: { type: string }
        events:
          type: array
          items: { $ref: '#/components/schemas/PublicEventDetail' }
    PublicFestivalDetail:
      type: object
      required: [id, organizer_id, name, days]
      properties:
        id: { type: string, format: uuid }
        organizer_id: { type: string, format: uuid }
        name: { type: string }
        days:
          type: array
          items: { $ref: '#/components/schemas/PublicPerformanceDetail' }
    PublicVenue:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    PublicTicketType:
      type: object
      required: [id, name, price]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        price:
          $ref: '#/components/schemas/Money'
    ChannelKind:
      type: string
      description: >
        What kind of sales channel this is. A CLOSED enum, deliberately: the four
        values are the ones the PRD names, and adding a fifth is a coordinated
        change to this document, the generated Go and TypeScript types, and the
        SQL CHECK — not a database-only edit. A data-driven vocabulary would be
        more machinery than four fixed values justify.
      enum: [web, pos, presale, reseller]
    ChannelCode:
      type: string
      minLength: 1
      maxLength: 100
      description: >
        An exact, opaque, case-sensitive string. The bound mirrors
        claims.channel_code and channel_allocations.channel_code in inventory
        (ADR-024) and fee_rules.channel_code, split_schedules.channel_code,
        price_rules.channel_code (TKT-237) and channels.code (TKT-235) in
        catalog — all six must agree, or a code legal in one place is unusable
        in another. Nothing normalizes, trims or case-folds it.
    ChannelCreate:
      type: object
      additionalProperties: false
      required: [code, display_name, kind]
      properties:
        code:
          $ref: '#/components/schemas/ChannelCode'
        display_name:
          type: string
          minLength: 1
          maxLength: 200
        kind:
          $ref: '#/components/schemas/ChannelKind'
        enabled:
          type: boolean
          default: true
          description: Omitted means enabled; a channel is created sellable unless said otherwise.
    ChannelUpdate:
      type: object
      additionalProperties: false
      required: [code, display_name, kind, enabled]
      description: >
        A full replacement of the mutable fields. `code` is required and must
        equal the stored code — it is present so an update cannot be written
        against a channel the caller has misidentified, and a mismatch is a 409
        rather than a rename.
      properties:
        code:
          $ref: '#/components/schemas/ChannelCode'
        display_name:
          type: string
          minLength: 1
          maxLength: 200
        kind:
          $ref: '#/components/schemas/ChannelKind'
        enabled:
          type: boolean
    Channel:
      type: object
      additionalProperties: false
      required: [id, organizer_id, code, display_name, kind, enabled, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        organizer_id:
          type: string
          format: uuid
        code:
          $ref: '#/components/schemas/ChannelCode'
        display_name:
          type: string
        kind:
          $ref: '#/components/schemas/ChannelKind'
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ChannelList:
      type: object
      additionalProperties: false
      required: [channels]
      properties:
        channels:
          type: array
          items: { $ref: '#/components/schemas/Channel' }
    PublicChannel:
      type: object
      additionalProperties: false
      required: [code, display_name]
      description: >
        No id, kind or enabled flag: a storefront selector needs a label to show
        and a code to submit, and the rest is operator configuration. Only
        enabled channels ever appear here, so an `enabled` field would be a
        constant.
      properties:
        code:
          $ref: '#/components/schemas/ChannelCode'
        display_name:
          type: string
    PublicChannelList:
      type: object
      additionalProperties: false
      required: [channels]
      properties:
        channels:
          type: array
          items: { $ref: '#/components/schemas/PublicChannel' }
