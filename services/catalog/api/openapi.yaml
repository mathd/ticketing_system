  /internal/ticket-types/{id}/price-resolution:
    get:
      operationId: resolveTicketTypePrice
      # INTERNAL. security: [] opts out of the document-level staff-write
      # requirement; the credential is the /internal/ prefix guard's, not a
      # declared scheme (ADR-043). Same posture as resolveTicketTypeFees.
      security: []
      summary: Resolve a ticket type's unit price through the rule hierarchy, with provenance
      description: >
        Answers "what does this ticket type cost right now, and why" (TKT-151,
        ADR-036).

        INTERNAL since TKT-155. `candidates` reports every CONSIDERED rule,
        including those that lost with outside_window_future — so this response
        carries an organizer's unannounced future prices and the shape of their
        whole rule ladder. That is forward pricing intent, not the current state
        of what is on sale, and publishing it let a competitor, a reseller or a
        buyer waiting for a drop read it before the on-sale. The gateway denies
        /api/<svc>/internal/ at the edge; catalog's prefix guard is what stands
        between it and the container network. Rules attach to one of five scope levels — ticket_type, slot,
        series, event, venue — and the narrowest wins, except that a rule marked
        force_ancestor_override restricts the competition to forced rules and
        inverts the order, so the broadest house rule wins. Ties break on
        priority, then on lowest rule id.

        With no applicable rule the ticket type's own price is returned and
        fallback_reason says so, so a catalog with no rules prices exactly as it
        did before this operation existed.

        The evaluation instant is the server's, NOT a request parameter. Letting
        a caller choose it would let anyone ask a sale-time price endpoint for
        early-bird pricing after the window closed. TKT-152 adds effective
        windows; the instant stays server-side.

        This is catalog's question, not commerce's: ADR-036 §6 amends ADR-002 so
        rule-based unit-price resolution sits with the rule definitions, while
        sale-time composition (price + fees + promos + taxes) stays in commerce.

        Cache-Control: no-store. That is a correctness tier, not a performance
        one: a resolved price feeds a money decision, and with effective windows
        the answer's correctness expires at an exact, known instant. A future
        browse-only endpoint could cache, but its max-age would have to be
        rounded down and capped at the earliest upcoming window boundary — a
        different endpoint and a different contract.
      parameters:
        - name: id
          in: path
          required: true
          description: >
            Named `id` rather than `ticketTypeId` to match the sibling
            /internal/ticket-types/{id} routes it shares a router with; two
            different parameter names at one position is a routing conflict, not
            a style choice.
          schema:
            type: string
            format: uuid
        - name: channel_code
          in: query
          required: false
          description: >
            The sales channel to resolve for (TKT-237). An exact opaque string
            (ADR-024) — matching is case-sensitive and nothing trims. OMITTING it
            is the default/public context, in which only channel-agnostic rules
            are eligible; it is NOT a wildcard, and a channel-specific rule never
            prices a sale that named no channel.

            A rule belonging to a DIFFERENT channel is absent from `candidates`
            entirely rather than reported as a loser. TKT-237 made that a
            disclosure decision on the grounds that this operation was public.
            TKT-155 has since moved it behind the internal credential, so that
            justification has narrowed — the behaviour is DELIBERATELY unchanged
            (see ADR-046 § TKT-155): widening a payload is the wrong direction to
            take on a ticket whose purpose is narrowing an audience.
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        '200':
          description: Resolved price with full provenance
          headers:
            Cache-Control:
              $ref: '#/components/headers/PriceResolutionCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceResolution'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalRouteUnauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /internal/performances/display-names:
    get:
      operationId: resolvePerformanceDisplayNames
      # Opts out of the document-level staff-write requirement, then relies on the
      # inline X-Internal-Token check that guards catalog's whole /internal/
      # surface (ADR-043: declared `security:` guards the PUBLIC contract, an
      # inline check guards the internal one). The staff-write credential would be
      # the wrong one — this is a service-to-service read, not a back-office write,
      # and commerce does not hold it.
      security: []
      summary: Resolve event display names for a set of performances, in one call (TKT-222)
      description: >
        Answers "what are these performances called, in this locale" for a bounded
        set of ids at once. It exists for commerce's wallet read (TKT-222): a
        purchase carries a slot id, and the name a buyer would recognise lives here.

        A GET with the ids in the query string, NOT a POST with a body — and the
        difference is not stylistic. Catalog's contract invariant
        (write_credential_test.go) reads the spec and requires every UNSAFE method
        to demand the staff-write credential; a read shaped as a POST fights that
        rule rather than fitting it. Length is not a problem (twenty uuids is under
        800 characters) and neither is disclosure: the request logger records
        `r.URL.Path` and not the query, and a performance id is not a secret.

        It deliberately does NOT filter on published state. A wallet is mostly PAST
        purchases, so a resolver that only sees on-sale performances goes blank
        exactly where it is needed — the buyer looking up what they bought last
        year. Publication controls what may be SOLD, not what may be named.

        INTERNAL because it takes no organizer scope and answers for any id its
        caller names. Nothing here is a secret — an event name is on the public
        site — but an unscoped bulk read is not something to publish.
      parameters:
        - name: ids
          in: query
          required: true
          # Bounded to one wallet page. An unbounded set is a way to ask one
          # request to do arbitrary work; the caller pages, like everyone else.
          schema: {type: array, minItems: 1, maxItems: 20, items: {type: string, format: uuid}}
          style: form
          explode: false
        - {$ref: '#/components/parameters/Locale'}
      responses:
        '200': {description: Resolved names, content: {application/json: {schema: {$ref: '#/components/schemas/PerformanceDisplayNames'}}}}
        '400': { $ref: '#/components/responses/BadRequest' }
        # Declared because ADR-028 fails CLOSED: an undeclared status is rewritten
        # into a generic 500 and logged as "response violates OpenAPI contract",
        # so a store failure would surface as contract drift rather than as
        # itself. Every status the handler can produce has to be here.
        '500': { $ref: '#/components/responses/InternalError' }
        '404': { $ref: '#/components/responses/NotFound' }
  /internal/ticket-types/{id}/fee-resolution:
    get:
      operationId: resolveTicketTypeFees
      # Opts out of the document-level staff-write requirement, then guards
      # itself with the inline X-Internal-Token check every other catalog
      # /internal/ route uses (ADR-043: declared `security:` guards a service's
      # PUBLIC contract, an inline check guards its internal surface). The
      # staff-write credential would be the wrong one here anyway — this is a
      # service-to-service read, not a back-office write.
      security: []
      summary: Resolve which fees apply to a ticket type, in a channel, with provenance
      description: >
        Answers "which fees apply to this ticket type, in this channel, right
        now, and why" (TKT-214, ADR-046). Rules attach to the same five scope
        levels as price rules — ticket_type, slot, series, event, venue — and the
        narrowest wins, except that a rule marked force_ancestor_override
        restricts the competition to forced rules and inverts the order.

        THE STRUCTURAL DIFFERENCE FROM price-resolution: fees are ADDITIVE. A
        price resolution has exactly one winner; this one has one winner PER
        FEE CODE, and a sale can carry a service fee and a facility fee at once.
        Rules never stack within a code.

        Precedence within a code, in order: scope level, then channel
        specificity, then priority, then the lowest rule id. Under a forced
        partition BOTH specificity axes invert, so the broadest house rule —
        including the channel-agnostic one — is the one that binds.

        This operation is INTERNAL and deliberately so. Its response carries
        `absorbed` fees, which are the organizer's cost structure rather than
        anything the buyer pays: publishing them would disclose what the platform
        and the venue take out of a face price. The gateway registers
        /api/<svc>/internal/ to a deny handler, so the route is unreachable from
        the edge by construction; the inline credential check is what guards it
        on the container network. Compare TKT-155, which records the equivalent
        exposure on the PUBLIC price-resolution route as a defect.

        The evaluation instant is the server's, NOT a request parameter — the
        same reason resolveTicketTypePrice refuses one: letting a caller choose
        it would let anyone ask a sale-time endpoint for a fee schedule that has
        expired or has not opened.

        A ticket type with no fee rules resolves to an empty `fees` array. A fee
        code every rule of which is outside its window resolves to an entry with
        a null winner and the expired rules as candidates — "considered, nothing
        applies" and "no such code" are different answers.

        Cache-Control: no-store, the same correctness tier as price resolution.
      parameters:
        - name: id
          in: path
          required: true
          description: >
            Named `id` rather than `ticketTypeId` to match the hand-mounted
            sibling /internal/ticket-types/{id} it shares a router with; two
            different parameter names at one position is a routing conflict, not
            a style choice.
          schema:
            type: string
            format: uuid
        - name: channel_code
          in: query
          required: false
          description: >
            The sales channel to resolve for. An exact opaque string (ADR-024).
            A channel registry now exists (TKT-235) but is a LOOKUP, NOT A
            CONSTRAINT: nothing validates this value against it, and an
            unregistered code resolves exactly as it always has.
            OMITTING it is the default/public context, in which
            only channel-agnostic rules are eligible; it is NOT a wildcard, and a
            channel-specific rule never applies to a sale that named no channel.
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        '200':
          description: The fees that apply, with full provenance
          headers:
            Cache-Control:
              $ref: '#/components/headers/PriceResolutionCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeeResolution'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalRouteUnauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /staff/authenticate:
    post:
      operationId: authenticateStaff
      summary: Verify back-office staff credentials and return the principal (TKT-190)
      description: >
        Verifies an identifier/password pair against the staff accounts catalog
        owns (ADR-002 assigns organizers and tenant-scoped configuration here;
        ADR-042 records why staff live here rather than in a sixth service).
        Returns the principal — staff id, organizer and role (TKT-197) — and
        never any password material.

        This operation is deliberately PUBLIC rather than internal-token guarded.
        The back-office login form in front of it must be anonymous by
        construction (a staff member cannot sign in through a page that requires
        a session), so an unauthenticated caller already has an unlimited
        credential-submission channel; making this endpoint internal would move
        the front door without locking it, at the price of handing the
        public-facing back-office process the shared credential that also opens
        commerce's refunds and inventory's operational holds. Rate limiting and
        abuse telemetry are TKT-195 and cover this endpoint AND the form.

        Unknown identifier and wrong password are the same 401 with the same
        body, and the store performs the same number of key-derivation
        comparisons on both paths — status parity alone would still leak account
        existence through timing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffCredentials'
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '200':
          description: Credentials verified
          headers:
            Cache-Control:
              $ref: '#/components/headers/NeverCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffPrincipal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: >-
            Invalid credentials. Identical for an unknown identifier and a wrong
            password — the body never says which, and never echoes the submitted
            identifier.

            Since TKT-191 this status also carries the staff-write credential
            refusal, because this operation is guarded like every other unsafe
            one. The two are indistinguishable to a caller by design; the back
            office tells them apart by failing at startup when its own credential
            is missing, never by reading this response.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NeverCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: >-
            Rate limited (TKT-195, ADR-042). This status is what the description
            above promised and did not have: until ai-review S4 the control was
            named in two comments and installed nowhere, so an unauthenticated
            caller had an unbounded credential-submission channel.

            Discloses nothing about the submitted identifier. The budget is spent
            BEFORE the account lookup, so the answer is identical for an
            identifier that exists and one that does not — a 429 that arrived
            only for real accounts would be a sharper oracle than the shared 401
            this operation goes to some trouble to build.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NeverCacheControl'
            Retry-After: {description: Seconds to wait before retrying, schema: {type: string}}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /public/events:
