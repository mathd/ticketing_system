# Catalog public contract (US-002 / TKT-26) — source of truth per ADR-009.
# Served by the service at /openapi.yaml; public URL /api/catalog/openapi.yaml
# (the gateway strips the /api/catalog prefix). Regenerate code with `make generate`.
openapi: 3.0.3
info:
  title: Catalog service API
  description: >
    Venues, events, performances (dated slots per ADR-005) and ticket types.
    Write endpoints are v1-trusted (no auth yet, recorded in TKT-26). Public
    reads are aggregated (one call per storefront page view, ADR-004) and carry
    volatility-tiered Cache-Control headers. Money is integer minor units +
    ISO-4217 currency (ADR-001); floats never appear on money paths.
  version: 1.0.0
# Every operation requires the staff-write credential unless it explicitly opts
# out with `security: []` (TKT-191). Stated as a DOCUMENT-LEVEL default so a new
# operation is closed by construction: going public is a visible, deliberate
# edit rather than an omission. `security` is enforced at runtime by the request
# validator's AuthenticationFunc, and the same declaration is what
# write_credential_test.go reads — one source of truth for the contract, the
# server and the test.
security:
  - CatalogStaffWriteCredential: []
paths:
  /venues:
    post:
      operationId: createVenue
      summary: Create a general-admission venue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VenueCreate'
      responses:
        '401':
          $ref: '#/components/responses/StaffWriteUnauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '201':
          description: Venue created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Venue'
        '400':
          $ref: '#/components/responses/BadRequest'
  /venues/{venueId}/seat-maps:
    post:
      operationId: createSeatMap
      summary: Create a draft seat map under a venue (US-019)
      description: >
        Authors a new versioned seat map in the draft state under a venue.
        The venue keeps its GA capacity; a venue may carry GA capacity and
        seat maps simultaneously. Publishing is TKT-103; only draft maps are
        writable here.
      parameters:
        - $ref: '#/components/parameters/VenueId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SeatMapCreate' }
      responses:
        '401':
          $ref: '#/components/responses/StaffWriteUnauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '201':
          description: Draft seat map created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeatMap' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /seat-maps/{seatMapId}/sections:
    post:
      operationId: addSeatMapSection
      summary: Add a section to a draft seat map (US-019)
      parameters:
        - $ref: '#/components/parameters/SeatMapId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SeatMapSectionCreate' }
      responses:
        '401':
          $ref: '#/components/responses/StaffWriteUnauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '201':
          description: Section added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeatSection' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Duplicate section name or position within the map
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /seat-maps/{seatMapId}/rows:
    post:
      operationId: addSeatMapRow
      summary: Add a row to a section of a draft seat map (US-019)
      parameters:
        - $ref: '#/components/parameters/SeatMapId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SeatMapRowCreate' }
      responses:
        '401':
          $ref: '#/components/responses/StaffWriteUnauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '201':
          description: Row added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeatRow' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Duplicate row label or position within the section
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /seat-maps/{seatMapId}/seats:
    post:
      operationId: addSeatMapSeat
      summary: Add a seat to a row of a draft seat map (US-019)
      description: >
        The stable seat identity is composed server-side as
        "section/row/seat" from the parent labels; a duplicate identity within
        the map version is a 409.
      parameters:
        - $ref: '#/components/parameters/SeatMapId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SeatMapSeatCreate' }
      responses:
        '401':
          $ref: '#/components/responses/StaffWriteUnauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '201':
          description: Seat added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Seat' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Duplicate seat identity or position within the row
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /seat-maps/{seatMapId}/publish:
    post:
      operationId: publishSeatMap
      summary: Publish a seat map (idempotent, TKT-103)
      description: >
        Flips a seat map draft to published and emits the
        platform.catalog.seat_map.published domain event at least once while it
        is owed (envelope id is deterministic per publication, so retried or
        raced emissions de-duplicate). A published version is immutable — further
        section/row/seat authoring is refused. Publishing an already-published
        map returns 200 without re-emitting; an archived map is a 409.
      parameters:
        - $ref: '#/components/parameters/SeatMapId'
      responses:
        '401':
          $ref: '#/components/responses/StaffWriteUnauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '200':
          description: Seat map is published
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeatMap' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: An archived seat map cannot be published
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /seat-maps/{seatMapId}/edit:
    post:
      operationId: editSeatMap
      summary: Edit a published seat map, producing a new version (TKT-105)
      description: >
        Surfaces the TKT-104 safe-edit contract (ADR-029) over HTTP. The body is
        the FULL replacement geometry (section -> row -> seat); seatMapId may be
        ANY version of the target family — the store resolves the current
        published version, takes a family-scoped advisory lock, and INSERTs a new
        published version (version+1). The predecessor stays immutable. An edit
        whose new geometry would orphan a seat identity pinned by a sale/hold is
        hard-rejected (409) — no new domain rule is introduced here, the contract
        is TKT-104's. Emits platform.catalog.seat_map.published for the new
        version at least once (deterministic id; de-duplicated on retry).
      parameters:
        - $ref: '#/components/parameters/SeatMapId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SeatMapEdit' }
      responses:
        '401':
          $ref: '#/components/responses/StaffWriteUnauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '201':
          description: A new published version was created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeatMap' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >
            The edit would orphan a pinned seat identity, or the new geometry has
            a duplicate seat identity.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /venues/{venueId}/ga-capacity:
    post:
      operationId: updateVenueGaCapacity
      summary: Update a venue's GA capacity (TKT-105)
      description: >
        Sets a venue's general-admission capacity (write-once at venue creation
        until now). POST-action style, matching the spec's other mutations
        (publish/close/reopen). Organizer-scoped (ADR-002). A venue may carry GA
        capacity and seat maps simultaneously — this only touches ga_capacity.
      parameters:
        - $ref: '#/components/parameters/VenueId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VenueGaCapacityUpdate' }
      responses:
        '401':
          $ref: '#/components/responses/StaffWriteUnauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '200':
          description: The updated venue
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Venue' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /events:
    post:
      operationId: createEvent
      summary: Create an event (localizable content)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventCreate'
      responses:
        '401':
          $ref: '#/components/responses/StaffWriteUnauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '201':
          description: Event created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/BadRequest'
  /performances:
    post:
      operationId: createPerformance
      summary: Create a dated performance (draft)
      description: >
        A performance is the catalog's first dated slot (ADR-005): a datable,
        admission-granting offer. Its shape deliberately carries no
        concert-specific fields so festival days and park operating days fit
        the same machinery later.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PerformanceCreate'
      responses:
        '401':
          $ref: '#/components/responses/StaffWriteUnauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '201':
          description: Performance created in draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Performance'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >
            Seated reference to a seat map that is not published (TKT-103).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /performances/{performanceId}/publish:
    post:
      operationId: publishPerformance
      summary: Publish a performance (idempotent)
      description: >
        Flips draft to published and emits the
        platform.catalog.performance.published domain event at least once
        while it is owed (envelope id is deterministic per
        publication, so retried or raced emissions de-duplicate). Publishing
        an already-published performance returns 200 without re-emitting.
        Publishing a performance with no ticket type is a 409 — the
        publication event and public visibility must never disagree.
      parameters:
        - $ref: '#/components/parameters/PerformanceId'
      responses:
        '401':
          $ref: '#/components/responses/StaffWriteUnauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '200':
          description: Performance is published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Performance'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: No sellable offer, or archived performances cannot be re-published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /performances/{performanceId}/archive:
    post:
      operationId: archivePerformance
      summary: Archive a published performance (idempotent)
      description: >
        Flips published to archived and emits the
        platform.catalog.performance.archived domain event at least once
        while it is owed. Retried or raced emissions de-duplicate at the
        stream using a deterministic envelope id. Any publication event still
        owed is emitted before the archive event. Re-archiving returns 200;
        archiving a draft returns 409.
      parameters:
        - $ref: '#/components/parameters/PerformanceId'
      responses:
        '401':
          $ref: '#/components/responses/StaffWriteUnauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '200':
          description: Performance is archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Performance'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Draft performances cannot be archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /performances/{performanceId}/close:
    post:
      operationId: closeSlot
      summary: Close a published slot (weather closure; idempotent)
      description: >
        Sets the orthogonal closure attribute to closed and emits
        platform.catalog.performance.closed at least once while owed (spike
        §Case 3). Closure is reversible (see reopen) and does not change the
        draft/published/archived lifecycle. Closing an already-closed slot
        returns 200 without a new transition. Only published slots can close.
      parameters:
        - $ref: '#/components/parameters/PerformanceId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SlotCloseRequest'
      responses:
        '401':
          $ref: '#/components/responses/StaffWriteUnauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '200':
          description: Slot is closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Performance'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Only published slots can be closed, or a prior closure event is still owed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /performances/{performanceId}/reopen:
    post:
      operationId: reopenSlot
      summary: Reopen a closed slot (idempotent)
      description: >
        Sets the closure attribute back to open and emits
        platform.catalog.performance.reopened at least once while owed.
        Reopening an already-open slot returns 200 without a new transition.
      parameters:
        - $ref: '#/components/parameters/PerformanceId'
      responses:
        '401':
          $ref: '#/components/responses/StaffWriteUnauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '200':
          description: Slot is open
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Performance'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Only published slots can be reopened, or a prior closure event is still owed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /series:
    post:
      operationId: createSeries
      summary: Create a localized series for one event
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SeriesCreate' }
      responses:
        '401':
          $ref: '#/components/responses/StaffWriteUnauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '201':
          description: Series created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Series' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /series/{seriesId}/performances:
    post:
      operationId: attachPerformanceToSeries
      summary: Attach an ordered draft slot to a series
      parameters:
        - $ref: '#/components/parameters/SeriesId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SeriesPerformanceAttach' }
      responses:
        '401':
          $ref: '#/components/responses/StaffWriteUnauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '200':
          description: Updated series
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Series' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Slot already belongs to a series, position is occupied, or membership is frozen
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /series/{seriesId}/publish:
    post:
      operationId: publishSeries
      summary: Atomically publish every slot in the series
      parameters:
        - $ref: '#/components/parameters/SeriesId'
      responses:
        '401':
          $ref: '#/components/responses/StaffWriteUnauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '200':
          description: Series members are published
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeriesLifecycleResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Empty series or a member cannot publish
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeriesTransitionConflict' }
  /series/{seriesId}/archive:
    post:
      operationId: archiveSeries
      summary: Atomically archive every published slot in the series
      parameters:
        - $ref: '#/components/parameters/SeriesId'
      responses:
        '401':
          $ref: '#/components/responses/StaffWriteUnauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '200':
          description: Series members are archived
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeriesLifecycleResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Empty series, draft member, or member with an owed closure event
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeriesTransitionConflict' }
  /seasons:
    post:
      operationId: createSeason
      summary: Create a localized season
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SeasonCreate' }
      responses:
        '401':
          $ref: '#/components/responses/StaffWriteUnauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '201':
          description: Season created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Season' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /seasons/{seasonId}/series:
    post:
      operationId: attachSeriesToSeason
      summary: Attach a series to a season
      parameters:
        - $ref: '#/components/parameters/SeasonId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SeasonSeriesAttach' }
      responses:
        '401':
          $ref: '#/components/responses/StaffWriteUnauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '200':
          description: Updated season
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Season' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Duplicate membership
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /seasons/{seasonId}/events:
    post:
      operationId: attachEventToSeason
      summary: Attach a standalone event to a season
      parameters:
        - $ref: '#/components/parameters/SeasonId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SeasonEventAttach' }
      responses:
        '401':
          $ref: '#/components/responses/StaffWriteUnauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '200':
          description: Updated season
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Season' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Duplicate membership
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /festivals:
    post:
      operationId: createFestival
      summary: Create a localized shared-capacity festival
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FestivalCreate' }
      responses:
        '401':
          $ref: '#/components/responses/StaffWriteUnauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '201':
          description: Festival created in draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Festival' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /festivals/{festivalId}/days:
    post:
      operationId: attachDayToFestival
      summary: Attach a draft festival day to the shared-capacity festival
      parameters:
        - $ref: '#/components/parameters/FestivalId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FestivalDayAttach' }
      responses:
        '401':
          $ref: '#/components/responses/StaffWriteUnauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '200':
          description: Updated festival
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Festival' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Wrong slot kind, existing group, frozen day, or launched festival
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /festivals/{festivalId}/publish:
    post:
      operationId: publishFestival
      summary: Atomically publish the festival and every member day
      parameters:
        - $ref: '#/components/parameters/FestivalId'
      responses:
        '401':
          $ref: '#/components/responses/StaffWriteUnauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '200':
          description: Festival and member days are published
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FestivalLifecycleResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Empty festival or a member cannot publish
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeriesTransitionConflict' }
  /festivals/{festivalId}/archive:
    post:
      operationId: archiveFestival
      summary: Atomically archive the festival and every member day
      parameters:
        - $ref: '#/components/parameters/FestivalId'
      responses:
        '401':
          $ref: '#/components/responses/StaffWriteUnauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '200':
          description: Festival and member days are archived
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FestivalLifecycleResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Empty festival, draft member, or member with an owed closure event
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeriesTransitionConflict' }
  /ticket-types:
    post:
      operationId: createTicketType
      summary: Create a ticket type with a price
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketTypeCreate'
      responses:
        '401':
          $ref: '#/components/responses/StaffWriteUnauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '201':
          description: Ticket type created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketType'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /ticket-types/{ticketTypeId}/price-resolution:
    get:
      operationId: resolveTicketTypePrice
      # Public read: opts out of the document-level staff-write requirement.
      security: []
      summary: Resolve a ticket type's unit price through the rule hierarchy, with provenance
      description: >
        Answers "what does this ticket type cost right now, and why" (TKT-151,
        ADR-036). Rules attach to one of five scope levels — ticket_type, slot,
        series, event, venue — and the narrowest wins, except that a rule marked
        force_ancestor_override restricts the competition to forced rules and
        inverts the order, so the broadest house rule wins. Ties break on
        priority, then on lowest rule id.

        With no applicable rule the ticket type's own price is returned and
        fallback_reason says so, so a catalog with no rules prices exactly as it
        did before this operation existed.

        The evaluation instant is the server's, NOT a request parameter. Letting
        a caller choose it would let anyone ask a sale-time price endpoint for
        early-bird pricing after the window closed. TKT-152 adds effective
        windows; the instant stays server-side.

        This is catalog's question, not commerce's: ADR-036 §6 amends ADR-002 so
        rule-based unit-price resolution sits with the rule definitions, while
        sale-time composition (price + fees + promos + taxes) stays in commerce.

        Cache-Control: no-store. That is a correctness tier, not a performance
        one: a resolved price feeds a money decision, and with effective windows
        the answer's correctness expires at an exact, known instant. A future
        browse-only endpoint could cache, but its max-age would have to be
        rounded down and capped at the earliest upcoming window boundary — a
        different endpoint and a different contract.
      parameters:
        - name: ticketTypeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Resolved price with full provenance
          headers:
            Cache-Control:
              $ref: '#/components/headers/PriceResolutionCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceResolution'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /staff/authenticate:
    post:
      operationId: authenticateStaff
      summary: Verify back-office staff credentials and return the principal (TKT-190)
      description: >
        Verifies an identifier/password pair against the staff accounts catalog
        owns (ADR-002 assigns organizers and tenant-scoped configuration here;
        ADR-042 records why staff live here rather than in a sixth service).
        Returns the principal — staff id, organizer and role (TKT-197) — and
        never any password material.

        This operation is deliberately PUBLIC rather than internal-token guarded.
        The back-office login form in front of it must be anonymous by
        construction (a staff member cannot sign in through a page that requires
        a session), so an unauthenticated caller already has an unlimited
        credential-submission channel; making this endpoint internal would move
        the front door without locking it, at the price of handing the
        public-facing back-office process the shared credential that also opens
        commerce's refunds and inventory's operational holds. Rate limiting and
        abuse telemetry are TKT-195 and cover this endpoint AND the form.

        Unknown identifier and wrong password are the same 401 with the same
        body, and the store performs the same number of key-derivation
        comparisons on both paths — status parity alone would still leak account
        existence through timing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffCredentials'
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '200':
          description: Credentials verified
          headers:
            Cache-Control:
              $ref: '#/components/headers/NeverCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffPrincipal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: >-
            Invalid credentials. Identical for an unknown identifier and a wrong
            password — the body never says which, and never echoes the submitted
            identifier.

            Since TKT-191 this status also carries the staff-write credential
            refusal, because this operation is guarded like every other unsafe
            one. The two are indistinguishable to a caller by design; the back
            office tells them apart by failing at startup when its own credential
            is missing, never by reading this response.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NeverCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /public/events:
    get:
      operationId: listPublicEvents
      # Public read: opts out of the document-level staff-write requirement.
      security: []
      summary: Aggregated storefront list read (minutes tier)
      description: >
        Everything the storefront list page needs in one call (ADR-004 rule 3).
        Only events with at least one publicly listable performance appear —
        published AND carrying at least one ticket type (no sellable offer, no
        listing). An event with several such performances appears once,
        listing each slot.
        Cache-Control: public, max-age=300, s-maxage=300 (minutes tier).
      parameters:
        - $ref: '#/components/parameters/Locale'
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '200':
          description: Published events, localized
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Age:
              $ref: '#/components/headers/PublicReadAge'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicEventList'
        '400':
          $ref: '#/components/responses/BadRequest'
  /public/events/{eventId}:
    get:
      operationId: getPublicEvent
      # Public read: opts out of the document-level staff-write requirement.
      security: []
      summary: Aggregated storefront detail read (minutes tier)
      description: >
        Everything the storefront detail page needs in one call, including
        ticket types and prices. 404 unless the event has at least one
        publicly listable performance (published + priced). Cache-Control: public, max-age=300,
        s-maxage=300 (minutes tier).
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/Locale'
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '200':
          description: Published event detail, localized
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Age:
              $ref: '#/components/headers/PublicReadAge'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicEventDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /public/seasons/{seasonId}:
    get:
      operationId: getPublicSeason
      # Public read: opts out of the document-level staff-write requirement.
      security: []
      summary: Aggregated public season detail (minutes tier)
      description: >
        One call returns the localized season and its deduplicated public event
        details, retaining series framing. Program membership changes on the
        same editorial cadence as event detail, so it uses that five-minute
        tier: Cache-Control: public, max-age=300, s-maxage=300.
      parameters:
        - $ref: '#/components/parameters/SeasonId'
        - $ref: '#/components/parameters/Locale'
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '200':
          description: Published season detail, localized
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
            Age: { $ref: '#/components/headers/PublicReadAge' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicSeasonDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /public/festivals/{festivalId}:
    get:
      operationId: getPublicFestival
      # Public read: opts out of the document-level staff-write requirement.
      security: []
      summary: Aggregated public festival detail (minutes tier)
      description: >
        One call returns the localized festival and all publicly listable
        festival days drawing on its shared capacity. Festival programming
        uses the ADR-004 minutes tier: Cache-Control: public, max-age=300,
        s-maxage=300.
      parameters:
        - $ref: '#/components/parameters/FestivalId'
        - $ref: '#/components/parameters/Locale'
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '200':
          description: Published festival detail, localized
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
            Age: { $ref: '#/components/headers/PublicReadAge' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicFestivalDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /public/venues:
    get:
      operationId: listPublicVenues
      # Public read: opts out of the document-level staff-write requirement.
      security: []
      summary: Organizer-scoped venue list (hours tier)
      description: >
        The venues owned by an organizer, for the back-office venue list
        (US-018). Venue geometry is long-lived, so this read uses the ADR-004
        hours tier — Cache-Control: public, max-age=3600, s-maxage=3600 —
        distinct from the events minutes tier. Scoped explicitly by
        organizer_id (ADR-002); there is no session to infer it from.
      parameters:
        - $ref: '#/components/parameters/OrganizerId'
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '200':
          description: The organizer's venues
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicVenueList' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /public/venues/{venueId}/seat-maps:
    get:
      operationId: listVenueSeatMaps
      # Public read: opts out of the document-level staff-write requirement.
      security: []
      summary: A venue's seat-map summaries (status-driven cache tier)
      description: >
        The seat maps authored under a venue — summaries only, no geometry —
        for the back-office venue page (US-019). Cache tier follows the payload's
        statuses (TKT-107): the ADR-004 hours tier (public, max-age=3600,
        s-maxage=3600) only when the list is non-empty and every map is published;
        no-store for a draft-bearing, mixed, or empty list. Scoped to the venue,
        backed by seat_maps_by_venue (ADR-019).
      parameters:
        - $ref: '#/components/parameters/VenueId'
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '200':
          description: The venue's seat maps
          headers:
            Cache-Control: { $ref: '#/components/headers/SeatMapCacheControl' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeatMapList' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /public/seat-maps/{seatMapId}:
    get:
      operationId: getPublicSeatMapGeometry
      # Public read: opts out of the document-level staff-write requirement.
      security: []
      summary: A seat map's full geometry (status-driven cache tier)
      description: >
        The full nested geometry (sections -> rows -> seats, each ordered by
        position) of one seat map, for the back-office authoring page (US-019).
        Cache tier follows the map's status (TKT-107): a published version is
        immutable (ADR-029) and keeps the ADR-004 hours tier, Cache-Control:
        public, max-age=3600, s-maxage=3600; a draft is mutable and is no-store.
      parameters:
        - $ref: '#/components/parameters/SeatMapId'
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '200':
          description: The seat map geometry
          headers:
            Cache-Control: { $ref: '#/components/headers/SeatMapCacheControl' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeatMapGeometry' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /public/seat-maps/{seatMapId}/versions:
    get:
      operationId: listSeatMapVersions
      # Public read: opts out of the document-level staff-write requirement.
      security: []
      summary: A seat map family's version history (status-driven cache tier, TKT-105)
      description: >
        Every version of the seat-map family that seatMapId belongs to (any
        version resolves the family), newest first, each carrying its
        published_at. current_version is the highest published version — the one
        an edit targets — and is absent for a draft-only family. Cache tier follows
        the payload's statuses (TKT-107): the ADR-004 hours tier (public,
        max-age=3600, s-maxage=3600) only when every version listed is published,
        no-store as soon as one is a draft. Catalog-owned; the back office does not
        keep a version store of its own.
      parameters:
        - $ref: '#/components/parameters/SeatMapId'
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '200':
          description: The family's versions, newest first
          headers:
            Cache-Control: { $ref: '#/components/headers/SeatMapCacheControl' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeatMapVersionHistory' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /openapi.yaml:
    get:
      operationId: getOpenAPISpec
      # Public read: opts out of the document-level staff-write requirement.
      security: []
      summary: This contract, as committed (ADR-009)
      responses:
        '200':
          description: The OpenAPI document, byte-identical to the repo file
          content:
            application/yaml:
              schema:
                type: string
components:
  securitySchemes:
    CatalogStaffWriteCredential:
      description: >
        The back office's credential for catalog writes (TKT-191, ADR-042). It
        authenticates the DEPUTY, not the individual staff member: catalog knows
        the caller is the back office, and the back office is what decides which
        staff member may drive which write. Roles are TKT-197.

        Deliberately NOT the shared INTERNAL_SERVICE_TOKEN — that one value opens
        every service's internal surface, and this one opens catalog writes only.
      type: apiKey
      in: header
      name: X-Catalog-Staff-Write-Token
  parameters:
    Locale:
      name: locale
      in: query
      required: true
      description: BCP-47 primary subtag; supported set is data, not schema (TKT-36)
      schema:
        type: string
        pattern: '^[a-z]{2}$'
    PerformanceId:
      name: performanceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EventId:
      name: eventId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SeriesId:
      name: seriesId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SeasonId:
      name: seasonId
      in: path
      required: true
      schema: { type: string, format: uuid }
    FestivalId:
      name: festivalId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OrganizerId:
      name: organizer_id
      in: query
      required: true
      description: Tenant scope (ADR-002); required — no session to infer from
      schema: { type: string, format: uuid }
    VenueId:
      name: venueId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SeatMapId:
      name: seatMapId
      in: path
      required: true
      schema: { type: string, format: uuid }
  headers:
    CacheControl:
      description: ADR-004 volatility tier, explicit on every public read
      schema:
        type: string
    PublicReadAge:
      description: >
        Seconds this answer has already spent in catalog's in-memory public-read
        cache (TKT-206, ADR-045), rounded up. Required, and 0 on a cache miss.

        It exists so two staleness budgets cannot stack. Cache-Control declares
        these responses publicly cacheable for five minutes, and the storefront's
        SSR cache starts every entry it fetches at age zero — so without Age, a
        catalog entry already 299 seconds old would be granted another 300 by
        Astro, giving a buyer ten minutes of staleness against a tier that
        promises five. Age is RFC 9111's mechanism for exactly this, and it is
        the only one available here: varying Cache-Control by remaining freshness
        is what the storefront middleware does for pages, but ADR-028 validates
        this response header against its declaration, so the tier is a fixed
        value.

        Bounded by the tier itself: an entry older than max-age is not served.
      required: true
      schema:
        type: integer
        minimum: 0
        maximum: 300
    SeatMapCacheControl:
      description: >
        ADR-004 volatility tier for a seat-map read, driven by the payload's
        statuses (TKT-107): the hours tier only when the response is non-empty and
        every seat map in it is published, otherwise no-store. Draft geometry is
        mutable, so an hour of shared-cache lifetime would make an authoring write
        look lost; a published version is immutable (ADR-029), which is what makes
        the hours branch correct. One response carries one header, so a list takes
        its least-cacheable member's tier, and an empty list fails closed. The enum
        is enforced at runtime, not only by the gate: catalog's ADR-028 response
        validator checks response headers and turns a third value into a 500 with
        the payload withheld. no-store closes the shared-cache vector only — it is
        not access control.
      schema:
        type: string
        enum:
          - 'no-store'
          - 'public, max-age=3600, s-maxage=3600'
    PriceResolutionCacheControl:
      description: >
        Always no-store. A resolved price feeds a money decision (ADR-004's
        "never" tier), and once TKT-152 adds effective windows the response's
        correctness expires at a known instant — caching it past that instant
        would sell at a stale price. Single-valued and required so the ADR-028
        response validator turns any other value into a 500.
      required: true
      schema:
        type: string
        enum:
          - 'no-store'
    NeverCacheControl:
      description: >
        Always no-store — ADR-004's "never" tier. An authentication response is
        never shared-cacheable: it is computed from a submitted credential and
        says whether that credential is good. Single-valued and required so the
        ADR-028 response validator turns any other value into a 500.
      required: true
      schema:
        type: string
        enum:
          - 'no-store'
  responses:
    StaffWriteUnauthorized:
      description: >-
        The staff-write credential was absent or wrong. Deliberately says which
        of those it was NOT: distinguishing them tells a caller whether a
        credential is configured at all. Identical bytes either way.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NeverCacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Referenced entity does not exist (or is not published, on public reads)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: >-
        Internal error. Emit-failure bodies carry an actionable recovery hint
        (e.g. retry the publish); declared so the fail-closed response
        validator (ADR-028) does not mask them as contract drift (TKT-108).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    StaffCredentials:
      description: >
        A back-office sign-in attempt (TKT-190). maxLength on both fields bounds
        the work an unauthenticated caller can ask for: 72 bytes is bcrypt's hard
        input limit, past which it silently ignores the tail, so a longer password
        and its 72-byte prefix would authenticate each other.
      type: object
      required: [identifier, password]
      additionalProperties: false
      properties:
        identifier:
          type: string
          minLength: 1
          maxLength: 320
        password:
          type: string
          minLength: 1
          maxLength: 72
    StaffRole:
      description: >
        The staff role vocabulary (TKT-197). This enum is the SINGLE source: it
        generates the Go constants catalog validates against and the TypeScript
        union the back office's route matrix is typed on, so adding a role here
        without deciding its permissions fails the back-office build rather than
        silently defaulting to something permissive.

        Deliberately NOT also a CHECK constraint on staff_accounts.role. That
        would be a second hand-written vocabulary to keep in step, and per
        ADR-021 it constrains nobody who can write the database — they can drop
        the constraint or grant themselves admin. The fail-closed boundary is the
        application: an unrecognised stored role does not authenticate.

        admin reaches everything the back office exposes. box_office is for order
        lookup and post-purchase actions (TKT-193/TKT-194); finance is for
        settlement and reporting (TKT-23). Both reach almost nothing today, and
        that is correct — the surfaces they exist for are not built yet.
      type: string
      enum: [admin, box_office, finance]
    StaffPrincipal:
      description: >
        Who signed in, and in what role. Carries no password material of any kind.

        The role is here because the back office gates on it (TKT-197). TKT-190
        deliberately withheld it while the vocabulary was undecided; TKT-197 is
        the ticket that decided it.
      type: object
      required: [staff_id, organizer_id, role]
      additionalProperties: false
      properties:
        staff_id:
          type: string
          format: uuid
        organizer_id:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/StaffRole'
    LocalizedString:
      description: Locale-keyed text; adding a locale is data, not a schema change (TKT-36)
      type: object
      additionalProperties:
        type: string
    PriceRuleProvenance:
      description: One pricing rule as reported in a resolution's provenance (ADR-036 §5).
      type: object
      # effective_from / effective_until are REQUIRED and nullable, not optional:
      # the point of declaring them in TKT-151 is that TKT-153 persists this shape
      # as a snapshot, and an absent key is a different shape from an explicit
      # null. Optional + omitempty would have shipped the second while claiming
      # the first.
      required: [rule_id, scope_level, scope_id, action_kind, amount, currency,
                 effective_from, effective_until, priority, forced]
      properties:
        rule_id:
          type: string
          format: uuid
        scope_level:
          type: string
          enum: [ticket_type, slot, series, event, venue]
        scope_id:
          type: string
          format: uuid
        action_kind:
          description: Tagged union with one member today; widening it later is additive (ADR-036 §2).
          type: string
          enum: [absolute]
        amount:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        effective_from:
          description: >
            Inclusive lower bound of the rule's effective window; null means
            unbounded. The interval is HALF-OPEN [effective_from,
            effective_until) — a rule is eligible at an instant equal to
            effective_from and NOT eligible at one equal to effective_until.
            Stated explicitly because an inclusive/exclusive ambiguity at a tier
            boundary is a money bug, not a rounding detail. A reversed window is
            rejected by the database.
          type: string
          format: date-time
          nullable: true
        effective_until:
          description: >
            Exclusive upper bound; null means unbounded. See effective_from for
            the half-open semantics. A rule whose window has closed is inert: it
            can never price anything again, so a misconfiguration in it is
            ignored rather than failing every resolution forever.
          type: string
          format: date-time
          nullable: true
        priority:
          type: integer
          format: int32
        forced:
          description: force_ancestor_override — restricts the competition to forced rules and inverts the scope order.
          type: boolean
    LosingPriceRule:
      description: >
        A candidate that did not win, and why. The reason enum is closed and
        total over the comparator: every way a rule can lose has a value.
      type: object
      required: [rule, reason]
      properties:
        rule:
          $ref: '#/components/schemas/PriceRuleProvenance'
        reason:
          type: string
          enum:
            - less_specific
            - forced_broader_scope
            - excluded_by_forced_rule
            - lower_forced_scope
            - lower_priority
            - stable_id_tiebreak
            - outside_window_past
            - outside_window_future
    PriceResolution:
      description: >
        A resolved unit price and the provenance of that answer (ADR-036 §5).
        candidates holds every considered rule EXCEPT the winner — stated
        explicitly because "candidates" and "the losers" pull in opposite
        directions and two implementations of a looser sentence would disagree.
        It is ordered by rule id ascending; the order is representation only and
        carries no precedence.

        INVARIANT, guaranteed by the server: winner and fallback_reason are
        mutually exclusive and jointly exhaustive — exactly one of "winner is
        non-null" and "fallback_reason is present" holds.

        This FLAT schema cannot express that. OpenAPI 3.0 could, as a oneOf of
        two variants — the accurate statement is not "impossible" but "not worth
        it here": a oneOf would turn PriceResolution into a union in the
        generated Go and in both generated TypeScript clients, for a pair no
        consumer branches on. So the contract is deliberately BROADER than the
        runtime: a client may rely on the invariant, and the server side is
        pinned by TestResolveTicketTypePriceWinnerAndFallbackAreExclusive, which
        covers a winner, an empty-candidate fallback, and a fallback WITH
        candidates (every rule window-ineligible) — the three shapes the handler
        can actually produce.
      type: object
      # winner is required and nullable for the same reason: a fallback response
      # must say "winner: null", not omit the key.
      required: [resolver_version, evaluated_at, organizer_id, performance_id,
                 base_price, resolved_price, winner, candidates]
      properties:
        organizer_id:
          description: >
            Tenant that owns the ticket type. Present so ONE call answers a
            caller's whole question: commerce needs it to authorize the sale, and
            a second catalog read to fetch it would have to be reconciled against
            this response on every reserve (TKT-153).
          type: string
          format: uuid
        performance_id:
          description: >
            The dated slot the ticket type belongs to — the inventory pool a hold
            is placed against. Present for the same reason as organizer_id.
          type: string
          format: uuid
        resolver_version:
          description: >
            Bumped when the comparator's semantics change. A commitment, not a
            decoration: TKT-153 persists snapshots that must stay interpretable.
          type: integer
          format: int32
          minimum: 1
        evaluated_at:
          description: The server-side instant the rules were evaluated against.
          type: string
          format: date-time
        base_price:
          # The ticket type's own price, before any rule.
          $ref: '#/components/schemas/Money'
        resolved_price:
          # What the winning rule produced, or base_price when none applied.
          $ref: '#/components/schemas/Money'
        winner:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/PriceRuleProvenance'
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/LosingPriceRule'
        fallback_reason:
          description: Present only when no rule applied and base_price is the answer.
          type: string
          enum: [no_eligible_rule]
    Money:
      description: Integer minor units + ISO-4217 code (ADR-001); no floats, ever
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: integer
          format: int64
          minimum: 0
          # bounded to JavaScript's safe-integer range: every consumer of
          # this contract (storefront included) must represent it exactly
          maximum: 9007199254740991
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
    VenueCreate:
      type: object
      required: [organizer_id, name, ga_capacity]
      properties:
        organizer_id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
        ga_capacity:
          type: integer
          format: int32
          minimum: 1
    Venue:
      type: object
      required: [id, organizer_id, name, ga_capacity, created_at]
      properties:
        id:
          type: string
          format: uuid
        organizer_id:
          type: string
          format: uuid
        name:
          type: string
        ga_capacity:
          type: integer
          format: int32
        created_at:
          type: string
          format: date-time
    SeatMapCreate:
      type: object
      required: [organizer_id, name]
      properties:
        organizer_id: { type: string, format: uuid }
        name: { type: string, minLength: 1 }
        orphan_prevention_enabled:
          type: boolean
          default: false
          description: >
            Refuse a seat selection that would strand a lone free seat in a row
            (ADR-041). Optional and defaulting to false, so a caller that has never
            heard of the rule creates exactly the map it created before. Nothing
            enforces it yet — TKT-181 puts it on the wire, TKT-182 acts on it.
    SeatMap:
      type: object
      required: [id, organizer_id, venue_id, name, version, status, created_at, orphan_prevention_enabled]
      properties:
        id: { type: string, format: uuid }
        organizer_id: { type: string, format: uuid }
        venue_id: { type: string, format: uuid }
        name: { type: string }
        version: { type: integer, format: int32 }
        status:
          type: string
          enum: [draft, published, archived]
        published_at:
          description: Publication instant (TKT-103); absent while draft
          type: string
          format: date-time
        orphan_prevention_enabled:
          type: boolean
          description: >
            Whether slots seated against THIS version refuse a selection that would
            strand a lone free seat (ADR-041). Per version, not per family: a
            published version is immutable and an edit mints a new one (ADR-029), so
            a seated pool's rule cannot change under it. Required on the response —
            every map has a value, and an absent field would read as "unknown" when
            the answer is always known.
        created_at: { type: string, format: date-time }
    SeatMapSectionCreate:
      type: object
      required: [organizer_id, name, position]
      properties:
        organizer_id: { type: string, format: uuid }
        # no '/': it is the seat-identity delimiter, so a component carrying one
        # would make distinct seats compose to the same identity.
        name: { type: string, minLength: 1, pattern: '^[^/]+$' }
        position: { type: integer, format: int32, minimum: 1 }
    SeatMapRowCreate:
      type: object
      required: [organizer_id, section_id, label, position]
      properties:
        organizer_id: { type: string, format: uuid }
        section_id: { type: string, format: uuid }
        label: { type: string, minLength: 1, pattern: '^[^/]+$' }
        position: { type: integer, format: int32, minimum: 1 }
    SeatMapSeatCreate:
      type: object
      required: [organizer_id, row_id, label, position]
      properties:
        organizer_id: { type: string, format: uuid }
        row_id: { type: string, format: uuid }
        label: { type: string, minLength: 1, pattern: '^[^/]+$' }
        position: { type: integer, format: int32, minimum: 1 }
    Seat:
      type: object
      required: [id, seat_identity, label, position]
      properties:
        id: { type: string, format: uuid }
        seat_identity: { type: string }
        label: { type: string }
        position: { type: integer, format: int32 }
    SeatRow:
      type: object
      required: [id, label, position]
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        position: { type: integer, format: int32 }
        # populated only in the geometry read; omitted on the create response
        seats:
          type: array
          items: { $ref: '#/components/schemas/Seat' }
    SeatSection:
      type: object
      required: [id, name, position]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        position: { type: integer, format: int32 }
        # populated only in the geometry read; omitted on the create response
        rows:
          type: array
          items: { $ref: '#/components/schemas/SeatRow' }
    SeatMapGeometry:
      type: object
      required: [map, sections]
      properties:
        map: { $ref: '#/components/schemas/SeatMap' }
        sections:
          type: array
          items: { $ref: '#/components/schemas/SeatSection' }
    SeatMapList:
      type: object
      required: [seat_maps]
      properties:
        seat_maps:
          type: array
          items: { $ref: '#/components/schemas/SeatMap' }
    SeatMapVersionHistory:
      description: A seat-map family's versions (TKT-105), newest first.
      type: object
      required: [versions]
      properties:
        current_version:
          description: >
            Highest published version — the one an edit targets. Absent when the
            family has no published version yet (draft-only).
          type: integer
          format: int32
        versions:
          type: array
          items: { $ref: '#/components/schemas/SeatMap' }
    SeatMapEdit:
      description: >
        Full replacement geometry for a published seat map (TKT-105). Mirrors the
        store's EditSeatMapInput; seat identity is composed server-side from the
        section/row/seat labels, so no component may contain the '/' delimiter.
      type: object
      required: [organizer_id, sections]
      properties:
        organizer_id: { type: string, format: uuid }
        orphan_prevention_enabled:
          type: boolean
          description: >
            Omit to INHERIT the edited version's setting; set to apply a new value to
            the newly minted version only (ADR-029: the edited version is immutable
            and is never altered either way). Inheritance is the default because an
            edit is a geometry change — a staffer who says nothing about the rule
            must not silently switch it off.
        sections:
          type: array
          items: { $ref: '#/components/schemas/SeatMapEditSection' }
    SeatMapEditSection:
      type: object
      required: [name, position, rows]
      properties:
        name: { type: string, minLength: 1, pattern: '^[^/]+$' }
        position: { type: integer, format: int32, minimum: 1 }
        rows:
          type: array
          items: { $ref: '#/components/schemas/SeatMapEditRow' }
    SeatMapEditRow:
      type: object
      required: [label, position, seats]
      properties:
        label: { type: string, minLength: 1, pattern: '^[^/]+$' }
        position: { type: integer, format: int32, minimum: 1 }
        seats:
          type: array
          items: { $ref: '#/components/schemas/SeatMapEditSeat' }
    SeatMapEditSeat:
      type: object
      required: [label, position]
      properties:
        label: { type: string, minLength: 1, pattern: '^[^/]+$' }
        position: { type: integer, format: int32, minimum: 1 }
    VenueGaCapacityUpdate:
      type: object
      required: [organizer_id, ga_capacity]
      properties:
        organizer_id: { type: string, format: uuid }
        ga_capacity: { type: integer, format: int32, minimum: 1 }
    EventCreate:
      type: object
      required: [organizer_id, name]
      properties:
        organizer_id:
          type: string
          format: uuid
        name:
          $ref: '#/components/schemas/LocalizedString'
        description:
          $ref: '#/components/schemas/LocalizedString'
    Event:
      type: object
      required: [id, organizer_id, name, created_at]
      properties:
        id:
          type: string
          format: uuid
        organizer_id:
          type: string
          format: uuid
        name:
          $ref: '#/components/schemas/LocalizedString'
        description:
          $ref: '#/components/schemas/LocalizedString'
        created_at:
          type: string
          format: date-time
    SlotKind:
      description: >
        The dated-slot kind (ADR-005 amendment / US-009). 'performance' carries
        starts_at; 'festival_day'/'operating_day' carry the operating window.
      type: string
      enum: [performance, festival_day, operating_day]
    ReEntryPolicy:
      description: >
        How many admissions one entitlement grants on the slot (spike §Case 1).
        'single' is the performance case; 'count_limited' requires max_entries.
      type: object
      required: [mode, requires_exit]
      properties:
        mode:
          type: string
          enum: [single, multi, count_limited]
        max_entries:
          type: integer
          format: int32
          minimum: 1
          nullable: true
        requires_exit:
          type: boolean
    Closure:
      description: >
        Weather-closure state (spike §Case 3), orthogonal to the
        draft/published/archived lifecycle. A closed slot is still published.
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [open, closed]
        closed_at:
          type: string
          format: date-time
          nullable: true
        reason:
          type: string
          nullable: true
    SlotCloseRequest:
      description: Optional operator-supplied reason for the closure
      type: object
      properties:
        reason:
          type: string
          minLength: 1
    PerformanceCreate:
      description: >
        Creates a dated slot in draft. kind defaults to 'performance' (which
        requires starts_at); 'festival_day'/'operating_day' require the
        operating window (operating_date + opens_at + closes_at). re_entry
        defaults to single-entry.
      type: object
      required: [organizer_id, event_id, venue_id, timezone]
      properties:
        organizer_id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        venue_id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/SlotKind'
        starts_at:
          description: Instant for kind 'performance'; omit for day kinds
          type: string
          format: date-time
        operating_date:
          description: Local operating date for day kinds
          type: string
          format: date
        opens_at:
          description: Local opening time-of-day (HH:MM) for day kinds
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        closes_at:
          description: Local closing time-of-day (HH:MM); < opens_at spans midnight
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        timezone:
          type: string
          description: IANA zone name, e.g. Europe/Paris
          minLength: 1
        re_entry:
          $ref: '#/components/schemas/ReEntryPolicy'
        seat_map_id:
          description: >
            Published seat-map version to seat this slot against (TKT-103). Omit
            for a GA slot. The referenced map must be published and share the
            slot's organizer and venue; a festival day cannot be seated.
          type: string
          format: uuid
    Performance:
      type: object
      required: [id, organizer_id, event_id, venue_id, kind, timezone, re_entry, closure, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        organizer_id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        venue_id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/SlotKind'
        starts_at:
          description: Present for kind 'performance'; absent for day kinds
          type: string
          format: date-time
        operating_date:
          type: string
          format: date
        opens_at:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        closes_at:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        timezone:
          type: string
        re_entry:
          $ref: '#/components/schemas/ReEntryPolicy'
        closure:
          $ref: '#/components/schemas/Closure'
        status:
          type: string
          enum: [draft, published, archived]
        published_at:
          type: string
          format: date-time
        archived_at:
          type: string
          format: date-time
          nullable: true
        capacity_group_id:
          description: Festival capacity-group id for grouped festival days
          type: string
          format: uuid
        seat_map_id:
          description: >
            Published seat-map version this slot is seated against (TKT-103);
            absent for a GA slot.
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
    TicketTypeCreate:
      type: object
      required: [organizer_id, performance_id, name, price]
      properties:
        organizer_id:
          type: string
          format: uuid
        performance_id:
          type: string
          format: uuid
        name:
          $ref: '#/components/schemas/LocalizedString'
        price:
          $ref: '#/components/schemas/Money'
    TicketType:
      type: object
      required: [id, organizer_id, performance_id, name, price, created_at]
      properties:
        id:
          type: string
          format: uuid
        organizer_id:
          type: string
          format: uuid
        performance_id:
          type: string
          format: uuid
        name:
          $ref: '#/components/schemas/LocalizedString'
        price:
          $ref: '#/components/schemas/Money'
        created_at:
          type: string
          format: date-time
    SeriesCreate:
      type: object
      required: [organizer_id, event_id, name]
      properties:
        organizer_id: { type: string, format: uuid }
        event_id: { type: string, format: uuid }
        name: { $ref: '#/components/schemas/LocalizedString' }
    SeriesPerformanceAttach:
      type: object
      required: [performance_id, position]
      properties:
        performance_id: { type: string, format: uuid }
        position: { type: integer, format: int32, minimum: 1 }
    SeriesMember:
      type: object
      required: [performance_id, position]
      properties:
        performance_id: { type: string, format: uuid }
        position: { type: integer, format: int32, minimum: 1 }
    Series:
      type: object
      required: [id, organizer_id, event_id, name, members, created_at]
      properties:
        id: { type: string, format: uuid }
        organizer_id: { type: string, format: uuid }
        event_id: { type: string, format: uuid }
        name: { $ref: '#/components/schemas/LocalizedString' }
        members:
          type: array
          items: { $ref: '#/components/schemas/SeriesMember' }
        created_at: { type: string, format: date-time }
    SeriesLifecycleResult:
      type: object
      required: [series_id, performances]
      properties:
        series_id: { type: string, format: uuid }
        performances:
          type: array
          items: { $ref: '#/components/schemas/Performance' }
    SeriesTransitionConflict:
      type: object
      required: [error, reason]
      properties:
        error: { type: string }
        reason: { type: string }
        blocking_performance_id: { type: string, format: uuid }
    SeasonCreate:
      type: object
      required: [organizer_id, name]
      properties:
        organizer_id: { type: string, format: uuid }
        name: { $ref: '#/components/schemas/LocalizedString' }
    SeasonSeriesAttach:
      type: object
      required: [series_id]
      properties:
        series_id: { type: string, format: uuid }
    SeasonEventAttach:
      type: object
      required: [event_id]
      properties:
        event_id: { type: string, format: uuid }
    Season:
      type: object
      required: [id, organizer_id, name, series_ids, event_ids, created_at]
      properties:
        id: { type: string, format: uuid }
        organizer_id: { type: string, format: uuid }
        name: { $ref: '#/components/schemas/LocalizedString' }
        series_ids:
          type: array
          items: { type: string, format: uuid }
        event_ids:
          type: array
          items: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
    FestivalCreate:
      type: object
      required: [organizer_id, name, shared_capacity]
      properties:
        organizer_id: { type: string, format: uuid }
        name: { $ref: '#/components/schemas/LocalizedString' }
        shared_capacity: { type: integer, format: int32, minimum: 1 }
    FestivalDayAttach:
      type: object
      required: [performance_id]
      properties:
        performance_id: { type: string, format: uuid }
    Festival:
      type: object
      required: [id, organizer_id, name, shared_capacity, status, member_ids, created_at]
      properties:
        id: { type: string, format: uuid }
        organizer_id: { type: string, format: uuid }
        name: { $ref: '#/components/schemas/LocalizedString' }
        shared_capacity: { type: integer, format: int32, minimum: 1 }
        status: { type: string, enum: [draft, published, archived] }
        member_ids:
          type: array
          items: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
    FestivalLifecycleResult:
      type: object
      required: [festival_id, performances]
      properties:
        festival_id: { type: string, format: uuid }
        performances:
          type: array
          items: { $ref: '#/components/schemas/Performance' }
    PublicEventList:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/PublicEventSummary'
    PublicVenueList:
      description: >
        The back-office venue list (US-018). Wrapper object (not a bare array)
        matching PublicEventList, so pagination can be added without a breaking
        contract change. Items are the full Venue (ga_capacity + tenancy),
        distinct from the id+name PublicVenue used inside event/festival detail.
      type: object
      required: [venues]
      properties:
        venues:
          type: array
          items:
            $ref: '#/components/schemas/Venue'
    PublicEventSummary:
      type: object
      required: [id, name, performances]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        performances:
          type: array
          items:
            $ref: '#/components/schemas/PublicPerformanceSummary'
    PublicPerformanceSummary:
      type: object
      required: [id, starts_at, timezone, venue_name, from_price]
      properties:
        id:
          type: string
          format: uuid
        starts_at:
          type: string
          format: date-time
        timezone:
          type: string
        venue_name:
          type: string
        from_price:
          $ref: '#/components/schemas/Money'
    PublicEventDetail:
      type: object
      required: [id, organizer_id, name, series, performances]
      properties:
        id:
          type: string
          format: uuid
        organizer_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        series:
          type: array
          items: { $ref: '#/components/schemas/PublicSeriesContext' }
        performances:
          type: array
          items:
            $ref: '#/components/schemas/PublicPerformanceDetail'
    PublicPerformanceDetail:
      type: object
      required: [id, starts_at, timezone, venue, ticket_types]
      properties:
        id:
          type: string
          format: uuid
        starts_at:
          type: string
          format: date-time
        timezone:
          type: string
        venue:
          $ref: '#/components/schemas/PublicVenue'
        seat_map_id:
          type: string
          format: uuid
          description: >
            The published seat-map version this performance is seated against
            (TKT-172). Optional and OMITTED for a GA performance — a storefront
            reads its presence as "this slot is seated, render this map", so a
            null would be a third state nobody wants. It names the exact version
            the performance was bound to at creation, not the family's newest:
            a published version is immutable and an edit mints a new one
            (ADR-029), and re-pointing a live slot is not something a read does.
            A festival day is never seated (the write path refuses it), so a
            grouped day never carries this.
        ticket_types:
          type: array
          items:
            $ref: '#/components/schemas/PublicTicketType'
    PublicSeriesContext:
      type: object
      required: [id, name, performance_ids]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        performance_ids:
          type: array
          items: { type: string, format: uuid }
    PublicSeasonDetail:
      type: object
      required: [id, organizer_id, name, events]
      properties:
        id: { type: string, format: uuid }
        organizer_id: { type: string, format: uuid }
        name: { type: string }
        events:
          type: array
          items: { $ref: '#/components/schemas/PublicEventDetail' }
    PublicFestivalDetail:
      type: object
      required: [id, organizer_id, name, days]
      properties:
        id: { type: string, format: uuid }
        organizer_id: { type: string, format: uuid }
        name: { type: string }
        days:
          type: array
          items: { $ref: '#/components/schemas/PublicPerformanceDetail' }
    PublicVenue:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    PublicTicketType:
      type: object
      required: [id, name, price]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        price:
          $ref: '#/components/schemas/Money'
