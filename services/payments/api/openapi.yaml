openapi: 3.0.3
info: {title: Payments internal API, version: 1.0.0}
paths:
  /internal/facts:
    post:
      operationId: appendFact
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Fact'}}}}
      responses:
        '200': {description: Appended, content: {application/json: {schema: {$ref: '#/components/schemas/FactResult'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        # The handler answers 400 through `refused`, which classifies: a store.IsRefusal
        # sentinel is echoed to the caller, and anything else — every wrapped pgx error —
        # becomes a 500 (TKT-256). Undeclared, ADR-028 failed that closed and rewrote it
        # into a generic contract 500 plus an ERROR log, hiding the store fault behind a
        # contract alarm.
        '500': {$ref: '#/components/responses/Error'}
  /internal/charges:
    post:
      operationId: charge
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Charge'}}}}
      responses:
        '200': {description: Captured, content: {application/json: {schema: {$ref: '#/components/schemas/ChargeResult'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '402': {description: Declined, content: {application/json: {schema: {$ref: '#/components/schemas/ChargeResult'}}}}
        '408': {description: Timeout, content: {application/json: {schema: {$ref: '#/components/schemas/ChargeResult'}}}}
        '409': {$ref: '#/components/responses/Error'}
        # The provider answered, but with money that does not match the request — a
        # different captured amount or a different currency (TKT-257). The charge is
        # REFUSED before anything is journalled or settled, and the operation stays bound
        # and unresolved: recoverable via /internal/psp/status, never terminal. A provider
        # that captured the wrong amount still moved money, so this is not a decline (402)
        # and not a no-side-effect timeout (408).
        '502': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /internal/orders/{orderId}/settlement:
    get:
      operationId: getOrderSettlement
      summary: The ledger lines attributing one order's capture
      description: >
        Who was owed what out of a captured order (TKT-217, ADR-048). Every line
        for the capture, and the total they sum to — which is the amount the
        provider took.

        A fee line with a null payee is money that was COLLECTED AND
        UNATTRIBUTED: the fee code had no split schedule at sale time. It is
        recorded rather than refused, because fees shipped before split schedules
        did, and refusing would have failed those sales at checkout. Finding one
        here is the signal to author a schedule.

        Internal: settlement names who gets paid what, which is the most
        sensitive thing this epic produces.
      parameters:
        - name: orderId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: organizer_id
          in: query
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: The order's settlement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderSettlement'
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /internal/operations:
    get:
      # Read-only lookup of an already-bound payment operation. Commerce's recovery
      # runner uses it to resolve an order whose local state is ambiguous, without
      # re-driving a charge: the payment token is never persisted by commerce and
      # payments folds it into a one-way fingerprint, so a replay is impossible.
      # Distinct from POST /internal/charges, whose BindOperation inserts and leases —
      # a recovery pass must never create an operation for an order that never charged.
      operationId: getOperation
      parameters:
        - {name: organizer_id, in: query, required: true, schema: {type: string, format: uuid}}
        - {name: idempotency_key, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 200}}
      responses:
        '200': {description: Operation state, content: {application/json: {schema: {$ref: '#/components/schemas/OperationState'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        # A failing LookupOperation is a 500 the handler writes itself (TKT-256). It is
        # distinct from 404: 404 is evidence the charge was never submitted, which commerce
        # acts on, while this says the journal could not be read at all — a difference a
        # recovery pass must not lose to ADR-028's generic rewrite.
        '500': {$ref: '#/components/responses/Error'}
  /internal/refund-legs:
    get:
      # Read-only evidence for ONE post-purchase refund leg (TKT-168, ADR-032
      # §Provider-neutral evidence reads). A leg is addressed by three parts — the
      # organizer, the CHARGE's idempotency key it refunds, and its own refund key — which
      # is why it is its own path rather than a variant of /internal/operations: that read
      # is keyed by a single idempotency key and answers about a different record.
      #
      # Strictly a read: it binds nothing, calls no provider, and appends no fact. It
      # exists because a caller could previously prove a charge ran but not that a refund
      # leg had settled, nor for how much — so a refund replaced by a successful no-op was
      # indistinguishable from one that moved money.
      operationId: getRefundLeg
      parameters:
        - {name: organizer_id, in: query, required: true, schema: {type: string, format: uuid}}
        - {name: source_idempotency_key, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 200}}
        - {name: refund_idempotency_key, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 200}}
      responses:
        '200': {description: Refund leg evidence, content: {application/json: {schema: {$ref: '#/components/schemas/RefundLegState'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /internal/psp/status:
    get:
      # Provider-neutral status resolution (ADR-032 §Status/replay). A resolved operation
      # answers from its recorded terminal status; an unresolved one asks the provider —
      # retrieve when the provider reference was persisted, or replay the original create
      # under the SAME idempotency key when it was lost to a crash. 502 = still ambiguous:
      # the operation stays recoverable, never invented as terminal.
      operationId: pspStatus
      parameters:
        - {name: organizer_id, in: query, required: true, schema: {type: string, format: uuid}}
        - {name: idempotency_key, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 200}}
      responses:
        '200': {description: Normalized provider state, content: {application/json: {schema: {$ref: '#/components/schemas/PSPStatus'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        # The status-replay window expired: the operation is unresolved, has no persisted
        # provider reference, and is older than the provider's idempotency-key retention —
        # a same-key replay would mint a NEW PaymentIntent. Manual reconciliation, not a
        # transient failure (which stays 502) — callers park, never retry.
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}
  /internal/psp/void:
    post:
      # Void an authorized, uncaptured operation. Amounts and provider references come
      # from the stored operation, never the caller; a successful void appends the
      # payment.voided compensating fact exactly once. 409 = the stored evidence does not
      # support a void; 502 = provider unresolved, compensation stays bound (recoverable).
      operationId: pspVoid
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PSPCompensation'}}}}
      responses:
        '200': {description: Voided (or replay of the completed void), content: {application/json: {schema: {$ref: '#/components/schemas/PSPCompensationResult'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}
  /internal/psp/refund:
    post:
      # Refund captured money. The refund amount/currency are the STORED captured amount —
      # callers cannot supply an amount. A pending/failed provider refund is 502 with the
      # compensation still bound: payment.refunded is appended only on a settled success.
      operationId: pspRefund
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PSPCompensation'}}}}
      responses:
        '200': {description: Refunded (or replay of the completed refund), content: {application/json: {schema: {$ref: '#/components/schemas/PSPCompensationResult'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}
  /internal/psp/partial-refund:
    post:
      # Post-purchase partial refund leg (TKT-156, ADR-037). The ONE refund path whose
      # amount comes from the caller — validated against the operation's own durable
      # captured evidence under a row lock before any provider call, so it can only ever
      # be a subset of money payments already knows moved. Repeatable: many legs against
      # one charge, each with its own refund_key and its own provider idempotency key.
      # Mutually exclusive with the whole-refund recovery path above.
      operationId: pspPartialRefund
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PSPPartialRefund'}}}}
      responses:
        '200': {description: Refunded (or replay of the completed leg), content: {application/json: {schema: {$ref: '#/components/schemas/PSPPartialRefundResult'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}
components:
  parameters:
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 200}}
  responses:
    Error: {description: Error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  schemas:
    Error: {type: object, additionalProperties: false, required: [error], properties: {error: {type: string}}}
    Fact:
      type: object
      additionalProperties: false
      required: [fact_id, organizer_id, fact_type, occurred_at, buyer_id, amount, currency]
      properties:
        fact_id: {type: string, format: uuid}
        organizer_id: {type: string, format: uuid}
        fact_type: {type: string}
        occurred_at: {type: string, format: date-time}
        buyer_id: {type: string, format: uuid}
        amount: {type: integer, format: int64}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        payload: {type: object, additionalProperties: {type: string}}
    FactResult:
      type: object
      additionalProperties: false
      required: [sequence, hash, replay]
      properties: {sequence: {type: integer, format: int64}, hash: {type: string}, replay: {type: boolean}}
    Charge:
      type: object
      additionalProperties: false
      required: [order_id, organizer_id, buyer_id, amount, currency, payment_token, settlement]
      properties:
        order_id: {type: string, format: uuid}
        organizer_id: {type: string, format: uuid}
        buyer_id: {type: string, format: uuid}
        amount: {type: integer, format: int64, minimum: 0}
        currency: {type: string, enum: [EUR]}
        payment_token: {type: string}
        settlement:
          description: >
            How this capture is attributed (TKT-217, ADR-048). Commerce derives it
            from the fee snapshot it already persisted at reserve time — NEVER
            from a fresh catalog read, so a schedule edited between the sale and
            the capture cannot change who gets paid for it.

            REQUIRED, and required BEFORE the outcome is known. A declined or
            timed-out charge settles nothing, so an attribution for it is never
            written — but the plan has to be validated before the provider is
            called, and at that point the outcome does not exist yet. Making it
            optional meant a charge that could not be settled was discovered only
            after the money had moved, with no captured fact and no ledger to
            account for it. This costs nothing: the charge path's only success
            outcome is a capture, so a plan-less charge could never have
            succeeded.
          allOf:
            - $ref: '#/components/schemas/SettlementPlan'
    SettlementPlan:
      description: >
        The composition of one capture. `face_value + passed_on` must equal both
        `total_amount` and the charged amount; absorbed fees do not change what
        the buyer paid but are still owed to a payee out of it.
      type: object
      additionalProperties: false
      required: [face_value, passed_on, absorbed, total_amount, currency, fees]
      properties:
        face_value: {type: integer, format: int64, minimum: 0}
        passed_on: {type: integer, format: int64, minimum: 0}
        absorbed: {type: integer, format: int64, minimum: 0}
        total_amount: {type: integer, format: int64, minimum: 0}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        fees:
          type: array
          items:
            $ref: '#/components/schemas/SettlementFee'
    SettlementFee:
      description: >
        One fee and the payees it resolved to.
      type: object
      additionalProperties: false
      required: [fee_code, incidence, amount, currency, parts]
      properties:
        fee_code: {type: string, minLength: 1, maxLength: 64}
        incidence: {type: string, enum: [passed_on, absorbed]}
        amount: {type: integer, format: int64, minimum: 0}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        parts:
          description: >
            EMPTY when the fee code had no split schedule at sale time. The fee
            is then recorded as collected and UNATTRIBUTED rather than refused:
            fees shipped before split schedules did, so refusing would fail those
            sales at checkout, after the buyer committed.
          type: array
          items:
            $ref: '#/components/schemas/SettlementPart'
    SettlementPart:
      description: >
        One payee's share, with its identity SNAPSHOTTED — a settlement row must
        keep saying who was paid at the time they were paid, and a display name
        is editable in catalog.
      type: object
      additionalProperties: false
      required: [payee_id, kind, display_name, share_bps]
      properties:
        payee_id: {type: string, format: uuid}
        kind: {type: string, minLength: 1, maxLength: 40}
        display_name: {type: string, minLength: 1, maxLength: 200}
        external_reference: {type: string, minLength: 1, maxLength: 200}
        share_bps: {type: integer, format: int32, minimum: 0, maximum: 10000}
    OrderSettlement:
      type: object
      additionalProperties: false
      required: [order_id, currency, total, entries]
      properties:
        order_id: {type: string, format: uuid}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        total:
          description: The sum of every line, which equals the captured amount.
          type: integer
          format: int64
        entries:
          type: array
          items:
            $ref: '#/components/schemas/SettlementLedgerEntry'
    SettlementLedgerEntry:
      type: object
      additionalProperties: false
      required: [entry_kind, amount, currency, payee_id, payee_kind, payee_display_name, fee_code, incidence]
      properties:
        entry_kind:
          description: >
            `legacy_unattributed` marks a capture that predates the settlement
            ledger: the amount is known and its split is not, so it is recorded
            whole and owed to nobody rather than guessed at.
          type: string
          enum: [face_value, fee, legacy_unattributed]
        amount:
          description: >
            SIGNED. The organizer's line goes negative when they absorbed more in
            fees than the face value — a real, if misconfigured, sale.
          type: integer
          format: int64
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        payee_id: {type: string, format: uuid, nullable: true}
        payee_kind: {type: string, nullable: true}
        payee_display_name: {type: string, nullable: true}
        fee_code: {type: string, nullable: true}
        incidence: {type: string, enum: [passed_on, absorbed], nullable: true}
    ChargeResult:
      type: object
      additionalProperties: false
      required: [status, payment_id, replay]
      properties:
        status: {type: string}
        payment_id: {type: string, format: uuid}
        sequence: {type: integer, format: int64}
        replay: {type: boolean}
    PSPCompensation:
      # Provider-neutral compensation identity: the organizer-scoped source operation
      # only. No Stripe references, no amounts (the stored row is the basis).
      type: object
      additionalProperties: false
      required: [organizer_id, idempotency_key]
      properties:
        organizer_id: {type: string, format: uuid}
        idempotency_key: {type: string, minLength: 1, maxLength: 200}
    PSPCompensationResult:
      type: object
      additionalProperties: false
      required: [status, fact_id, replay]
      properties:
        status: {type: string, enum: [voided, refunded]}
        fact_id: {type: string, format: uuid}
        replay: {type: boolean}
    PSPPartialRefund:
      # One post-purchase refund leg. refund_key is the leg's own identity — two legs
      # against one charge differ only there, and that is what makes them two provider
      # operations. The amount is validated against the stored captured evidence.
      type: object
      additionalProperties: false
      required: [organizer_id, idempotency_key, refund_key, amount, currency]
      properties:
        organizer_id: {type: string, format: uuid}
        idempotency_key: {type: string, minLength: 1, maxLength: 200}
        refund_key: {type: string, minLength: 1, maxLength: 200}
        amount:
          type: integer
          format: int64
          minimum: 1
          # int64's own bound, NOT catalog's Money cap of 9007199254740991.
          # A capture may legitimately exceed 2^53-1: commerce composes an order
          # total with checkedAdd, which bounds at int64, and its tests pin that a
          # large-but-representable total must still sell. A refund is a subset of
          # a capture, so the JS-safe cap would refuse honest refunds of large
          # orders. Do not "tidy" this to the Money cap.
          # This is a DECLARATION of payments' bound for consumers and generated
          # clients — it is not the refusal that protects the ceiling. That is the
          # checked addition in store.BindRefundLeg, which refuses any leg taking
          # the cumulative total past the captured amount.
          maximum: 9223372036854775807
        currency: {type: string, pattern: '^[A-Z]{3}$'}
    PSPPartialRefundResult:
      type: object
      additionalProperties: false
      required: [status, fact_id, amount, currency, replay]
      properties:
        status: {type: string, enum: [refunded]}
        fact_id: {type: string, format: uuid}
        amount: {type: integer, format: int64}
        currency: {type: string}
        replay: {type: boolean}
    PSPStatus:
      # Normalized provider evidence. Never contains provider references (pi_/ch_/re_),
      # the payment-method reference, or any secret material.
      type: object
      additionalProperties: false
      required: [outcome, terminal_no_side_effect, captured, authorized, authorized_amount, captured_amount, currency]
      properties:
        outcome: {type: string, enum: [authorized, captured, declined, timeout, unknown, voided, refunded]}
        terminal_no_side_effect: {type: boolean}
        captured: {type: boolean}
        authorized: {type: boolean}
        authorized_amount: {type: integer, format: int64}
        captured_amount: {type: integer, format: int64}
        currency: {type: string}
        # What the PROVIDER reported capturing, checked against the request before it was
        # recorded (TKT-257). OPTIONAL and omitted when the operation carries no such
        # evidence — a row written before payments migration 0006, or one no provider ever
        # confirmed. An absent key means "never confirmed", never "confirmed zero".
        #
        # captured_amount above keeps exactly its existing meaning and stays required:
        # commerce's recovery runner decides whether to refund from it, and redefining it
        # would change when money moves in another service.
        confirmed_captured_amount: {type: integer, format: int64}
        # What the PROVIDER reported RETURNING, for an operation a completed whole-refund
        # compensation supersedes (TKT-298). A SEPARATE field rather than reusing
        # confirmed_captured_amount, because the two confirm opposite movements: publishing
        # a refund's figure under the capture's name hands a consumer refund evidence under
        # a capture-evidence name, and nothing in the payload lets it tell which movement
        # was confirmed. Same absence rule as its sibling — omitted for a compensation
        # completed before payments migration 0006, and for a void, which moves no money
        # and which CompleteCompensation refuses a confirmation on. An absent key means
        # "never confirmed", never "confirmed zero".
        #
        # confirmed_currency is shared: at most one of the two amounts is ever present on a
        # single answer, since the refunded branch returns before the resolved-operation
        # branch can run.
        confirmed_refunded_amount: {type: integer, format: int64}
        confirmed_currency: {type: string, pattern: '^[A-Z]{3}$'}
    OperationState:
      type: object
      additionalProperties: false
      required: [resolved]
      properties:
        # false when the operation exists but has no terminal result yet: it was bound
        # and the charge is still in flight (or its process died). The caller must not
        # infer "no side effect" from this — an unresolved operation is precisely the
        # payment_unknown case, whose resolution needs real-PSP status (TKT-56).
        resolved: {type: boolean}
        # Present only when resolved: the terminal result payments recorded.
        status: {type: string}
        fact_id: {type: string, format: uuid}
        # The durable bind time — present for EVERY found operation (TKT-115): an
        # unresolved operation's caller derives the status-replay deadline from it.
        occurred_at: {type: string, format: date-time}
        # Present when the operation is unresolved, has no persisted provider
        # reference, and the configured provider bounds same-key replay (Stripe ~24h):
        # past this instant /internal/psp/status answers 409 — the replay would mint a
        # NEW PaymentIntent — and the operation is manual reconciliation, not retry
        # fodder (ADR-032 §Status/replay amendment).
        status_replay_deadline_at: {type: string, format: date-time}
        # Provider-neutral amount evidence (TKT-168, ADR-032 §Provider-neutral evidence
        # reads). Present ONLY for an operation that captured: these say how much money
        # moved, and an operation that has not captured has no such answer. Omitted rather
        # than zeroed — a zero cannot be told apart from a genuine zero-value capture.
        #
        # Neutral by the same rule PSPStatus already publishes them under: an amount in
        # integer minor units and its ISO currency describe the movement, not the
        # processor, the instrument, or the provider object that produced it.
        captured_amount: {type: integer, format: int64}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        # The provider's own confirmation of what it captured, as distinct from
        # captured_amount, which is what payments durably recorded (TKT-257). Omitted for a
        # pre-0006 row, which has no confirmation and never can — its requested figure is
        # NOT promoted to confirmed evidence.
        confirmed_captured_amount: {type: integer, format: int64}
        confirmed_currency: {type: string, pattern: '^[A-Z]{3}$'}
    RefundLegState:
      # One post-purchase refund leg's evidence (TKT-168). Never contains the provider
      # idempotency key, the provider reference, or any other provider identity — the leg
      # row carries both, and neither crosses this boundary.
      type: object
      additionalProperties: false
      required: [completed, amount, currency]
      properties:
        # false while the leg is BOUND: the provider call has not settled. A bound leg is
        # money the buyer has not been given back yet, so it must be distinguishable from a
        # completed one rather than collapsed into "a refund exists".
        completed: {type: boolean}
        amount: {type: integer, format: int64}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        # The provider's confirmation that this money actually came back, as distinct from
        # `amount`, which is what the leg BOUND before the provider call (TKT-257).
        # Completion now refuses without it, so a leg completed from here on always carries
        # one; a leg completed before payments migration 0006 has none and answers absent.
        confirmed_amount: {type: integer, format: int64}
        confirmed_currency: {type: string, pattern: '^[A-Z]{3}$'}
