# Smoke override: swap the hermetic in-Docker builds for packaging-only
# images that COPY host-built artifacts (make build-gate-linux / build-ts).
# Applied by scripts/smoke.sh unless SMOKE_HERMETIC=1. A Go service present
# in compose.yaml but missing here falls back to the hermetic build — slower
# but never wrong.
services:
  catalog:
    build: { context: ., dockerfile: build/go-bin.Dockerfile, args: { BIN: catalog } }
  inventory:
    build: { context: ., dockerfile: build/go-bin.Dockerfile, args: { BIN: inventory } }
  commerce:
    build: { context: ., dockerfile: build/go-bin.Dockerfile, args: { BIN: commerce } }
  payments:
    build: { context: ., dockerfile: build/go-bin.Dockerfile, args: { BIN: payments } }
  access:
    build: { context: ., dockerfile: build/go-bin.Dockerfile, args: { BIN: access } }
  # The migrate jobs (ADR-022) run the same binaries; override them too, or
  # each falls back to a hermetic build — correct, but five needless rebuilds.
  catalog-migrate:
    build: { context: ., dockerfile: build/go-bin.Dockerfile, args: { BIN: catalog } }
  inventory-migrate:
    build: { context: ., dockerfile: build/go-bin.Dockerfile, args: { BIN: inventory } }
  commerce-migrate:
    build: { context: ., dockerfile: build/go-bin.Dockerfile, args: { BIN: commerce } }
  payments-migrate:
    build: { context: ., dockerfile: build/go-bin.Dockerfile, args: { BIN: payments } }
  access-migrate:
    build: { context: ., dockerfile: build/go-bin.Dockerfile, args: { BIN: access } }
  # The lifecycle backfill (ADR-021 §D9) is a one-shot job on the same binary.
  access-lifecycle-backfill:
    build: { context: ., dockerfile: build/go-bin.Dockerfile, args: { BIN: access } }
  gateway:
    build: { context: ., dockerfile: build/go-bin.Dockerfile, args: { BIN: gateway } }
  scanner:
    build: { context: ., dockerfile: web/scanner/Dockerfile.smoke }
  storefront:
    build: { context: ., dockerfile: web/storefront/Dockerfile.smoke }
